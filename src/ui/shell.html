<script>
/**
 * Client core. Modules plug in with FT.module({...}); see AGENTS.md for the contract.
 *
 *   FT.module({
 *     id: 'log',
 *     tab:   { title: 'Log', order: 40, render: function (FT) { return '<html string>'; } },   // optional top-level tab
 *     slots: { 'project.page': [{ order: 10, span: 'full' | 'half', render: function (project, FT) { return html; } }],
 *              'projects.tab': [{ order: 10, render: function (FT) { return html; } }],
              'today.panels': [{ order: 10, render: function (FT) { return html; } }] },        // optional extension points
 *     onProject: function (projectId) {}                                                           // optional, runs when a project page opens
 *   });
 * Interactions use data attributes handled by delegation:
 *   data-act="module.name"     click   -> FT.action('module.name', function (el, event) {})
 *   data-change="module.name"  change  -> FT.on('change', 'module.name', fn)
 *   data-input="module.name"   input   -> FT.on('input', 'module.name', fn)   (every keystroke)
 *   data-enter="module.name"   Enter key in an input
 */
var FT = (function () {
  var modules = {}, loaded = {}, renderHooks = [], handlers = { act: {}, change: {}, input: {}, enter: {} }, pending = 0, syncTimer = null;
  var MODE_KEY = 'ft.mode';
  var FT = { store: {}, config: { staleDays: 5, modes: [] }, state: { view: null, projectId: null, mode: null }, ready: false };

  function $(id) { return document.getElementById(id); }

  // ---------- helpers ----------
  FT.esc = function (s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  FT.daysSince = function (iso) {
    var t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? 9999 : Math.max(0, Math.floor((Date.now() - t) / 86400000));
  };
  FT.ageLabel = function (n) { return n >= 9999 ? 'never' : n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
  FT.ageClass = function (n) { return n >= FT.config.staleDays ? 'age-stale' : n >= 3 ? 'age-soon' : 'age-fresh'; };
  FT.fmtDate = function (iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  FT.categories = function () { return FT.store.categories || []; };
  FT.category = function (id) {
    var list = FT.categories();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return { id: id, label: id, color: '' };
  };
  FT.pill = function (id) {
    var c = FT.category(id);
    return '<span class="pill" style="--c: var(--cat-' + FT.esc(c.color || 'none') + ')">' + FT.esc(c.label) + '</span>';
  };
  FT.project = function (id) {
    var list = FT.store.projects || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  };
  // Web addresses in plain text. Trailing punctuation (a full stop after a link) stays outside the link.
  var URL_PATTERN = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]]/g;

  /** Escape text for HTML and make web addresses in it clickable links that open in a new tab. */
  FT.linkify = function (text) {
    return FT.esc(text).replace(URL_PATTERN, function (url) {
      return '<a class="textlink" href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
    });
  };

  FT.errorText = function (err) {
    var m = err && err.message ? err.message : String(err || 'Something went wrong.');
    return m.replace(/^(Error:\s*)+/, '');
  };

  // ---------- module registry ----------
  FT.module = function (def) { modules[def.id] = def; };
  /** A module's client code is always on the page; it only shows when the current mode loads its server side. */
  function isLoaded(id) { return !!loaded[id]; }
  FT.slots = function (name) {
    var out = [];
    Object.keys(modules).filter(isLoaded).forEach(function (id) {
      var s = modules[id].slots && modules[id].slots[name];
      if (s) (Array.isArray(s) ? s : [s]).forEach(function (x) { out.push(x); });
    });
    return out.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  };
  FT.onRender = function (fn) { renderHooks.push(fn); };
  FT.action = function (name, fn) { handlers.act[name] = fn; };
  FT.on = function (kind, name, fn) { handlers[kind][name] = fn; };

  // ---------- server calls ----------
  function setPending(delta) {
    pending += delta;
    document.body.classList.toggle('busy', pending > 0); // a bar along the top of the page while anything is waiting for Google
    var el = $('sync');
    clearTimeout(syncTimer);
    if (pending > 0) { el.textContent = 'Saving…'; el.dataset.state = 'saving'; return; }
    el.textContent = 'Saved'; el.dataset.state = 'saved';
    syncTimer = setTimeout(function () { el.textContent = ''; }, 1500);
  }

  /** An id for a new item, made here so the item can show before the server answers. 8 hex characters, like the server's. */
  FT.newId = function () {
    var bytes = new Uint8Array(4);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  };

  // Changes go to the server one at a time, in the order they were made. A reply's fresh data is only used when no
  // later change is still waiting: the screen already shows that later change, and older data would undo it.
  var queue = Promise.resolve(), waiting = 0;

  /**
   * Call a module's server api in the current mode. Merges any refreshed slices into the store and re-renders
   * unless opts.render === false. opts.parallel: a read that need not wait for earlier changes.
   * Slices that arrive after a mode switch belong to the old mode, so they are dropped.
   */
  FT.rpc = function (moduleId, fn, args, opts) {
    opts = opts || {};
    var mode = opts.mode || FT.state.mode; // opts.mode: a save that belongs to a mode the user has since switched away from
    // opts.raw: resolve with the whole reply (result, slices, version, conflicts). opts.noMerge: do not use the reply's slices.
    // opts.timeout (ms): give up waiting, so a call that never answers cannot hold up every later change.
    function send() {
      setPending(1);
      return new Promise(function (resolve, reject) {
        var settled = false, timer = null;
        function finish() { settled = true; clearTimeout(timer); setPending(-1); if (!opts.parallel) waiting--; }
        if (opts.timeout) timer = setTimeout(function () {
          if (settled) return;
          finish();
          var e = new Error('Timed out waiting for Google.'); e.network = true; reject(e);
        }, opts.timeout);
        google.script.run
          .withSuccessHandler(function (res) {
            if (settled) return;
            finish();
            if (mode !== FT.state.mode) { resolve(opts.raw ? res : res ? res.result : null); return; }
            if (res && res.undo) FT.state.canUndo = true;
            if (!opts.noMerge && (opts.parallel || waiting === 0)) {
              var slices = (res && res.slices) || {};
              Object.keys(slices).forEach(function (k) { FT.store[k] = slices[k]; });
              if (opts.render !== false) FT.render();
            }
            resolve(opts.raw ? res : res ? res.result : null);
          })
          .withFailureHandler(function (err) {
            if (settled) return;
            finish();
            var msg = FT.errorText(err), e = new Error(msg);
            if (FT.offline && FT.offline.isNetworkError(err)) e.network = true;
            if (!opts.quiet) FT.toast(msg, 'error');
            reject(e);
          })
          .rpc(moduleId, fn, args || {}, mode);
      });
    }
    if (opts.parallel) return send();
    waiting++;
    var done = queue.then(send);
    queue = done.catch(function () {});
    return done;
  };

  /** How many changes are on their way to the server. */
  FT.pendingSaves = function () { return waiting; };

  // Editors that save after a delay register here, so their text is sent when the page may be going away:
  // hidden (another app, the phone locked), closed, or switching mode.
  var leaveHooks = [];
  FT.onLeave = function (fn) { leaveHooks.push(fn); };
  FT.leaving = function () { leaveHooks.forEach(function (fn) { try { fn(); } catch (e) {} }); };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') FT.leaving(); });
  window.addEventListener('pagehide', FT.leaving);

  // Closing or reloading the tab while changes are still on their way would lose them, so the browser asks first.
  // (Changes the offline queue holds are kept on this device, so they do not count.)
  window.addEventListener('beforeunload', function (e) {
    FT.leaving();
    if (waiting > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  /** A change shown on screen before the server answered failed: tell the user and reload the true state. */
  FT.saveFailed = function () {
    queue.then(function () { if (waiting === 0) FT.reload(); });
  };

  // Words for the undo message, by module.function. Anything else is "Last change".
  var UNDO_WORDS = {
    'kanban.addTask': 'Card added', 'kanban.deleteTask': 'Card deleted', 'kanban.moveTask': 'Card moved', 'kanban.updateTask': 'Card edit',
    'kanban.addColumn': 'Column added', 'kanban.renameColumn': 'Column rename', 'kanban.moveColumn': 'Column moved', 'kanban.deleteColumn': 'Column deleted',
    'projects.create': 'Project added', 'projects.update': 'Project edit', 'projects.remove': 'Project deleted',
    'lists.create': 'List added', 'lists.rename': 'List rename', 'lists.remove': 'List deleted', 'lists.setColor': 'List colour',
    'criteria.add': 'Criterion added', 'criteria.update': 'Criterion change', 'criteria.remove': 'Criterion deleted',
    'categories.add': 'Category added', 'categories.update': 'Category edit', 'categories.remove': 'Category deleted',
    'stickies.add': 'Sticky note added', 'stickies.update': 'Sticky note change', 'stickies.remove': 'Sticky note deleted',
    'whiteboard.create': 'Whiteboard added', 'whiteboard.rename': 'Whiteboard rename', 'whiteboard.remove': 'Whiteboard removed',
    'resources.add': 'Link added', 'resources.remove': 'Link removed',
    'links.add': 'Project link added', 'links.remove': 'Project link removed', 'today.finish': 'Session saved', 'today.swap': 'Focus swap'
  };
  FT.undoWords = function (action) { return UNDO_WORDS[action] || 'Last change'; };

  /**
   * Show a change on screen at once, then save it. apply() changes FT.store and returns a function that puts it back;
   * send() returns the save's promise. If the save fails the screen goes back (the error is already shown by FT.rpc).
   * Without this, a button waits for Google (often 1 to 3 seconds, longer behind other saves) and looks dead.
   */
  FT.optimistic = function (apply, send) {
    var revert = apply();
    FT.render();
    return send().catch(function (e) {
      if (typeof revert === 'function') { revert(); FT.render(); }
      throw e;
    });
  };

  /** Undo the newest change in this mode (after any changes still being saved). */
  FT.undo = function () {
    var mode = FT.state.mode;
    FT.toast('Undoing…');
    waiting++;
    var done = queue.then(function () {
      setPending(1);
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            setPending(-1); waiting--;
            if (mode !== FT.state.mode) { resolve(); return; }
            if (!res.undone) { FT.toast('Nothing to undo.'); resolve(); return; }
            FT.store = res.data;
            FT.render();
            FT.toast('Undone: ' + FT.undoWords(res.undone));
            resolve();
          })
          .withFailureHandler(function (err) { setPending(-1); waiting--; FT.toast(FT.errorText(err), 'error'); resolve(); })
          .undo(mode);
      });
    });
    queue = done;
    return done;
  };

  /** Do again the change that was just undone (after any changes still being saved). */
  FT.redo = function () {
    var mode = FT.state.mode;
    FT.toast('Redoing…');
    waiting++;
    var done = queue.then(function () {
      setPending(1);
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            setPending(-1); waiting--;
            if (mode !== FT.state.mode) { resolve(); return; }
            if (!res.redone) { FT.toast('Nothing to redo.'); resolve(); return; }
            FT.store = res.data;
            FT.render();
            FT.toast('Redone: ' + FT.undoWords(res.redone));
            resolve();
          })
          .withFailureHandler(function (err) { setPending(-1); waiting--; FT.toast(FT.errorText(err), 'error'); resolve(); })
          .redo(mode);
      });
    });
    queue = done;
    return done;
  };

  FT.reload = function () {
    return new Promise(function (resolve) {
      google.script.run.withSuccessHandler(function (b) {
        FT.store = b.data; FT.render(); resolve();
      }).withFailureHandler(function (e) { FT.toast(FT.errorText(e), 'error'); resolve(); }).bootstrap(FT.state.mode);
    });
  };

  // ---------- toast ----------
  var toastTimer = null;
  /** A short message at the bottom. action: optional { label, run } for a button in it, such as Undo. */
  FT.toast = function (msg, kind, action) {
    var el = $('toast');
    el.textContent = ''; el.className = 'toast' + (kind ? ' ' + kind : ''); el.hidden = false;
    el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    var text = document.createElement('span'); text.textContent = msg; text.style.flex = '1 1 auto'; el.appendChild(text);
    if (action) {
      var btn = document.createElement('button');
      btn.className = 'toastbtn'; btn.textContent = action.label;
      btn.onclick = function () { el.hidden = true; action.run(); };
      el.appendChild(btn);
    }
    if (kind === 'error') {
      var x = document.createElement('button');
      x.className = 'toastx'; x.setAttribute('aria-label', 'Dismiss'); x.textContent = '×';
      x.onclick = function () { el.hidden = true; };
      el.appendChild(x);
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, kind === 'error' ? 9000 : action ? 7000 : 4500);
  };

  /** After a delete: say what went and offer Undo. */
  FT.deleted = function (what) {
    FT.toast(what + ' deleted.', null, { label: 'Undo', run: FT.undo });
  };

  // ---------- dialog ----------
  var dialogOpener = null;
  var requestClose = null; // the open dialog's "close unless it would lose changes"
  /** Close the open dialog the way a tap outside it or Esc does: dialogs with unsaved changes warn first. */
  FT.requestCloseDialog = function () { if (requestClose) requestClose(); else FT.closeDialog(); };
  FT.closeDialog = function () {
    requestClose = null;
    $('dialogRoot').innerHTML = '';
    document.body.classList.remove('dlg-open');
    var wrap = document.querySelector('.wrap');
    if (wrap) wrap.removeAttribute('inert');
    var back = dialogOpener; dialogOpener = null;
    if (back && document.body.contains(back) && back.focus) { try { back.focus(); } catch (e) {} }
  };
  /**
   * opts: { title, subtitle, body (html), fields: [{id,label,type,value,placeholder,options}], after (html), hint (text), submit, danger,
   *         wide (true for a wider dialog), cancel (false: no Cancel button, for dialogs that apply changes at once),
   *         onOpen(), onSubmit(values) }
   * onSubmit may return a promise; a thrown error or rejection is shown inside the dialog.
   */
  FT.dialog = function (opts) {
    var fields = (opts.fields || []).map(function (f) {
      var id = 'dlg-' + f.id, ctl;
      if (f.type === 'textarea') ctl = '<textarea id="' + id + '" placeholder="' + FT.esc(f.placeholder || '') + '" style="min-height:84px">' + FT.esc(f.value || '') + '</textarea>';
      else if (f.type === 'select') ctl = '<select id="' + id + '">' + f.options.map(function (o) {
        return '<option value="' + FT.esc(o.value) + '"' + (o.value === f.value ? ' selected' : '') + '>' + FT.esc(o.label) + '</option>';
      }).join('') + '</select>';
      else ctl = '<input type="text" id="' + id + '" value="' + FT.esc(f.value || '') + '" placeholder="' + FT.esc(f.placeholder || '') + '"' + (f.maxlength ? ' maxlength="' + f.maxlength + '"' : '') + '>';
      return '<label for="' + id + '">' + FT.esc(f.label) + '</label>' + ctl;
    }).join('');
    $('dialogRoot').innerHTML = '<div class="scrim" id="dlg-scrim"><div class="dialog' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="dlg-heading">' +
      '<h2 id="dlg-heading">' + FT.esc(opts.title) + '</h2>' +
      (opts.subtitle ? '<div class="meta">' + FT.esc(opts.subtitle) + '</div>' : '') +
      (opts.body || '') + fields + (opts.after || '') +
      '<div class="err" id="dlg-err" role="alert"></div>' +
      (opts.hint ? '<div class="hint">' + FT.esc(opts.hint) + '</div>' : '') +
      '<div class="actions"><button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="dlg-submit">' + FT.esc(opts.submit || 'Save') + '</button>' +
      (opts.cancel === false ? '' : '<button class="btn" id="dlg-cancel">Cancel</button>') + '</div></div></div>';

    function values() {
      var v = {};
      (opts.fields || []).forEach(function (f) { v[f.id] = $('dlg-' + f.id).value.trim(); });
      return v;
    }
    function submit() {
      var btn = $('dlg-submit'); if (!btn || btn.disabled) return; // a second Enter or tap while saving does nothing
      btn.disabled = true; $('dlg-err').textContent = '';
      Promise.resolve().then(function () { return opts.onSubmit(values()); })
        .then(function () { FT.closeDialog(); })
        .catch(function (e) { btn.disabled = false; $('dlg-err').textContent = FT.errorText(e); });
    }
    // opts.isDirty(): true when closing would lose changes. A tap outside or Esc then warns once; a second one discards.
    var warned = false;
    requestClose = function () {
      if (!warned && opts.isDirty && opts.isDirty()) {
        warned = true;
        $('dlg-err').textContent = 'You have unsaved changes. Press ' + (opts.submit || 'Save') + ' to keep them, or tap outside again (or Esc) to discard them.';
        return;
      }
      FT.closeDialog();
    };
    $('dlg-submit').onclick = submit;
    if ($('dlg-cancel')) $('dlg-cancel').onclick = FT.closeDialog;
    $('dlg-scrim').onclick = function (e) { if (e.target.id === 'dlg-scrim') requestClose(); };
    $('dialogRoot').onkeydown = function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
      if (e.key === 'Tab') {
        var items = Array.prototype.filter.call($('dialogRoot').querySelectorAll('a[href], button, input, select, textarea, [contenteditable="true"], [tabindex]:not([tabindex="-1"])'),
          function (n) { return !n.disabled && n.offsetParent !== null; });
        if (!items.length) return;
        var firstItem = items[0], lastItem = items[items.length - 1];
        if (e.shiftKey && (document.activeElement === firstItem || document.activeElement === $('dialogRoot').querySelector('.dialog'))) { e.preventDefault(); lastItem.focus(); }
        else if (!e.shiftKey && document.activeElement === lastItem) { e.preventDefault(); firstItem.focus(); }
      }
    };
    // Keep the page behind the dialog still: it cannot be tabbed into or scrolled, and focus comes back to where it was.
    if (!dialogOpener) dialogOpener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
    document.body.classList.add('dlg-open');
    var wrap = document.querySelector('.wrap');
    if (wrap) wrap.setAttribute('inert', '');
    var box = $('dialogRoot').querySelector('.dialog');
    box.setAttribute('tabindex', '-1');
    // On a phone the keyboard should not pop up before the dialog has been read, so focus the dialog itself there.
    var first = $('dialogRoot').querySelector('input, textarea, select');
    if (first && !narrow.matches) first.focus(); else box.focus();
    if (opts.onOpen) opts.onOpen();
  };

  // ---------- navigation and rendering ----------
  function tabs() {
    return Object.keys(modules).filter(isLoaded).map(function (id) { return modules[id]; })
      .filter(function (m) { return m.tab; })
      .sort(function (a, b) { return (a.tab.order || 0) - (b.tab.order || 0); });
  }

  // Back: the pages you came from in this device and mode, newest last (kept in this browser so it survives a reload).
  var BACK_KEY = 'ft.back.', BACK_MAX = 20, backStack = null, going = false;
  function pageNow() { return { view: FT.state.view, projectId: FT.state.view === 'project' ? FT.state.projectId : '' }; }
  function samePage(a, b) { return !!a && !!b && a.view === b.view && (a.projectId || '') === (b.projectId || ''); }
  function backPages() {
    if (backStack) return backStack;
    try { backStack = JSON.parse(localStorage.getItem(BACK_KEY + FT.state.mode) || '[]'); } catch (e) { backStack = []; }
    return Array.isArray(backStack) ? backStack : (backStack = []);
  }
  function keepBack() { try { localStorage.setItem(BACK_KEY + FT.state.mode, JSON.stringify(backPages())); } catch (e) {} }
  function showBackButton() { var b = $('backBtn'); if (b) b.disabled = !FT.ready || backPages().length === 0; } // in Settings, while it is open

  // The phone's own back button: each in-app step also adds a browser history entry (this page load only), and going back through
  // one of them takes the same step as the Back button. A panel that is open on top of a page (the full screen notes) can add an
  // entry too and handle the back press itself with FT.onBack.
  var pushedEntries = 0, quietBacks = 0, backHandlers = [];
  FT.pushHistory = function () {
    try { history.pushState({ ft: 1 }, ''); pushedEntries++; return true; } catch (e) { return false; }
  };
  /** Drop the newest entry without taking a step (a panel closed by its own button). */
  FT.popHistory = function () {
    if (pushedEntries < 1) return;
    quietBacks++;
    try { history.back(); } catch (e) { quietBacks--; pushedEntries--; }
  };
  /** fn() runs on a back press; return true if it handled it (closed something), so the page does not change. */
  FT.onBack = function (fn) { backHandlers.push(fn); };
  window.addEventListener('popstate', function () {
    if (pushedEntries > 0) pushedEntries--;
    if (quietBacks > 0) { quietBacks--; return; }
    for (var i = 0; i < backHandlers.length; i++) { if (backHandlers[i]()) return; }
    previousPage();
  });

  /** The Back button: through the browser history when this page load added entries, so it matches the phone's back button. */
  FT.back = function () {
    if (pushedEntries > 0) { try { history.back(); return; } catch (e) {} }
    previousPage();
  };

  function previousPage() {
    var pages = backPages();
    while (pages.length) {
      var page = pages.pop();
      keepBack();
      if (usablePage(page) && !samePage(page, pageNow())) {
        going = true;
        try { if (page.view === 'project') FT.go('project', { id: page.projectId }); else FT.go(page.view); } finally { going = false; }
        return;
      }
    }
    showBackButton();
  };

  FT.go = function (view, opts) {
    if (!going && FT.ready && FT.state.view) {
      var from = pageNow(), to = { view: view, projectId: view === 'project' ? opts.id : '' };
      if (!samePage(from, to)) { var pages = backPages(); pages.push(from); if (pages.length > BACK_MAX) pages.shift(); keepBack(); FT.pushHistory(); }
    }
    FT.state.view = view;
    if (view === 'project') {
      FT.state.projectId = opts.id;
      Object.keys(modules).forEach(function (id) { if (modules[id].onProject) modules[id].onProject(opts.id); });
    }
    document.body.classList.remove('menuopen');
    FT.render();
    window.scrollTo(0, 0);
  };

  function renderTabs() {
    var current = FT.state.view === 'project' ? 'projects' : FT.state.view;
    $('tabs').innerHTML = tabs().map(function (m) {
      return '<button class="tab" data-act="core.tab" data-view="' + FT.esc(m.id) + '"' + (m.id === current ? ' aria-current="page"' : '') + '>' + FT.esc(m.tab.title) + '</button>';
    }).join('');
    renderPager(current);
  }

  /** The strip under the phone's bar: the previous view, this one with its place among the dots, and the next. */
  function renderPager(current) {
    var list = tabs(), at = list.map(function (m) { return m.id; }).indexOf(current), el = $('pager');
    if (!el) return;
    if (at < 0) { el.hidden = true; el.innerHTML = ''; return; }
    var prev = list[at - 1], next = list[at + 1];
    el.hidden = false;
    el.innerHTML = (prev ? '<button class="pg-side pg-prev" data-act="core.tab" data-view="' + FT.esc(prev.id) + '">‹ ' + FT.esc(prev.tab.title) + '</button>' : '<span></span>') +

    var noBack = !FT.ready || backPages().length === 0;
    return '<div class="historyrow">' +
      '<button class="btn" type="button" id="undoBtn" data-act="core.undo" aria-label="Undo the last change (Ctrl or Cmd + Z)" title="Undo (Ctrl or Cmd + Z)">' + ICON_UNDO + 'Undo</button>' +
      '<button class="btn" type="button" id="redoBtn" data-act="core.redo" aria-label="Redo the change you just undid (Ctrl or Cmd + Shift + Z)" title="Redo (Ctrl or Cmd + Shift + Z)">' + ICON_REDO + 'Redo</button>' +
      '<button class="btn" type="button" id="backBtn" data-act="core.back" aria-label="Back to the previous page" title="' + (noBack ? 'No page to go back to' : 'Back to the previous page') + '"' + (noBack ? ' disabled' : '') + '>' + ICON_BACK + 'Back</button></div>';
  } });

  FT.settings.add({ id: 'data', order: 10, html: function () {
    var mode = currentMode();
    return '<label>Data</label><div class="settingrow"><span style="color:var(--muted)">The ' + FT.esc(mode.label) + ' Sheet, notes and whiteboards are in one Drive folder.</span>' +
      (FT.config.folderUrl ? '<a class="btn" id="dlg-drive" href="' + FT.esc(FT.config.folderUrl) + '" target="_blank" rel="noopener noreferrer">Open ' + FT.esc(mode.label) + ' folder in Drive</a>' : '') + '</div>';
  } });

  FT.settings.add({ id: 'openOn', order: 20, html: function () {
    var on = openOn();
    return '<label>When the app opens (this device)</label><div class="choice two" role="radiogroup" aria-label="When the app opens">' + OPEN_ON.map(function (o) {
      return '<label><input type="radio" name="dlg-openon" value="' + o[0] + '"' + (o[0] === on ? ' checked' : '') + '>' + o[1] + '</label>';
    }).join('') + '</div>';
  }, onOpen: function (root) {
    Array.prototype.forEach.call(root.querySelectorAll('input[name="dlg-openon"]'), function (radio) {
      radio.addEventListener('change', function () { if (radio.value) lsSet(OPEN_ON_KEY, radio.value); else lsRemove(OPEN_ON_KEY); });
    });
  } });

  FT.settings.add({ id: 'theme', order: 30, html: function () {
    var theme = savedTheme();
    return '<label>Theme</label><div class="choice" role="radiogroup" aria-label="Theme">' + THEMES.map(function (t) {
      return '<label><input type="radio" name="dlg-theme" value="' + t[0] + '"' + (t[0] === theme ? ' checked' : '') + '>' + t[1] + '</label>';
    }).join('') + '</div>';
  }, onOpen: function (root) {
    // The theme changes as soon as it is picked, so you can see it before closing.
    Array.prototype.forEach.call(root.querySelectorAll('input[name="dlg-theme"]'), function (radio) {
      radio.addEventListener('change', function () { FT.setTheme(radio.value); });
    });
  } });

  FT.settings.add({ id: 'wrapper', order: 40, html: function () {
    return '<label>Wrapper site</label><div class="settingrow"><span style="color:var(--muted)">Opens this app full screen without Google\'s banner, and can be installed on a phone. The button copies this app\'s address and opens the wrapper.</span>' +
      '<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="dlg-wrapper">Copy address and open wrapper</button>' +
      '<a class="btn" id="dlg-wrapperlink" href="' + FT.esc(FT.config.wrapperUrl || '#') + '" target="_blank" rel="noopener noreferrer">Wrapper site</a></span></div>' +
      '<div id="dlg-copied" class="hint" style="background:none;padding:4px 0 0" hidden></div>';
  }, onOpen: function () { $('dlg-wrapper').addEventListener('click', copyAndOpenWrapper); } });

  FT.settings.add({ id: 'build', order: 1000, html: function () {
    return '<div style="margin-top:12px;color:var(--muted);font-size:12px">Build 2026-10-28</div>';
  } });

  function settingsDialog() {
    var sections = settingSections.slice();
    FT.dialog({
      title: 'Settings',
      submit: 'Done',
      cancel: false,
      body: sections.map(function (s) { return '<div class="settingsec" data-section="' + FT.esc(s.id) + '">' + s.html() + '</div>'; }).join(''),
      onOpen: function () {
        var root = $('dialogRoot').querySelector('.dialog');
        sections.forEach(function (s) { if (s.onOpen) s.onOpen(root); });
      },
      onSubmit: function () {}
    });
  }

  function newModeDialog() {
    renderModeBar();
    FT.dialog({
      title: 'New mode',
      subtitle: 'A mode keeps its own projects, lists and settings, in its own Sheet and Drive folder.',
      submit: 'Create mode',
      fields: [{ id: 'modename', label: 'Name', placeholder: 'e.g. Side projects' }],
      onSubmit: function (v) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(function (mode) {
              FT.config.modes = (FT.config.modes || []).concat([mode]);
              resolve();
              FT.switchMode(mode.id);
            })
            .withFailureHandler(function (err) { reject(new Error(FT.errorText(err))); })
            .createMode(v.modename);
        });
      }
    });
  }

  // ---------- last page (this device only) ----------
  // The page you were on (a tab, or a project) is kept in this browser, per mode, so a reload puts you back there.
  // It never goes to the server: another device keeps its own.
  var LAST_KEY = 'ft.last.', DEFAULT_MODE_KEY = 'ft.defaultMode';

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function lsRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

  // "When the app opens" (Settings, this device only): 'today' starts on Today; nothing saved means the page you were on.
  var OPEN_ON_KEY = 'ft.openOn', OPEN_ON = [['today', 'Today'], ['', 'The page I was on']];
  function openOn() { return lsGet(OPEN_ON_KEY) === 'today' ? 'today' : ''; }

  function saveLastPage() {
    if (!FT.ready || !FT.state.view || !FT.state.mode) return;
    lsSet(LAST_KEY + FT.state.mode, JSON.stringify({ view: FT.state.view, projectId: FT.state.view === 'project' ? FT.state.projectId : '' }));
  }
  FT.onRender(saveLastPage);
  FT.onRender(showBackButton);

  /** A saved page that still exists and is not locked, or null (the caller then shows the first tab, Today). */
  function usablePage(page) {
    if (!page || typeof page.view !== 'string') return null;
    if (page.view === 'project') {
      var project = FT.project(page.projectId);
      return project && !(FT.lockedUntil && FT.lockedUntil(project)) ? page : null;
    }
    return tabs().some(function (m) { return m.id === page.view; }) ? page : null;
  }

  function showPage(page) {
    FT.state.view = page.view;
    if (page.view !== 'project') return;
    FT.state.projectId = page.projectId;
    Object.keys(modules).forEach(function (id) { if (modules[id].onProject) modules[id].onProject(page.projectId); });
  }

  /**
   * opts.restore: go back to the page this device was last on (a page load only; switching modes starts on the first tab).
   * opts.keepPage: stay on the page now showing (a fresh load replacing the saved copy) if it is still there.
   * opts.requested: the mode the page asked for; null means the default mode, whose id is remembered for the cache.
   */
  function applyBootstrap(b, opts) {
    opts = opts || {};
    var current = opts.keepPage ? { view: FT.state.view, projectId: FT.state.projectId } : null;
    FT.config = b.config; FT.store = b.data; FT.state.mode = b.config.mode; FT.ready = true; backStack = null;
    loaded = {};
    b.modules.forEach(function (m) { loaded[m.id] = true; });
    document.title = b.config.appName || document.title;
    var first = tabs()[0];
    FT.state.view = first ? first.id : null;
    var saved = null;
    if (!current && opts.restore) {
      if (openOn() === 'today') saved = { view: 'today', projectId: '' };
      else { try { saved = JSON.parse(lsGet(LAST_KEY + b.config.mode) || 'null'); } catch (e) {} }
    }
    var page = usablePage(current || saved);
    if (page) showPage(page);
    if (!opts.requested) lsSet(DEFAULT_MODE_KEY, b.config.mode);
    renderModeBar();
    FT.render();
  }

  function savedMode() {
    try { return localStorage.getItem(MODE_KEY); } catch (e) { return null; }
  }

  /** The key a mode's saved copy and waiting changes are kept under; the default mode (null) uses its remembered id. */
  function cacheKey(mode) { return mode || lsGet(DEFAULT_MODE_KEY) || '_default'; }

  /** True while the user is typing in a box on the page, so a redraw would throw their text away. */
  function typingInPage() {
    var el = document.activeElement;
    if (!el || !$('app').contains(el)) return false;
    return (/^(INPUT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox' && el.type !== 'radio' && el.value !== '') || el.isContentEditable;
  }

  /** Run fn once no change is waiting to be sent and nobody is typing, so fresh data never undoes an edit still on its way. */
  function whenSettled(fn) {
    var busy = FT.pendingSaves() > 0 || (FT.offline && FT.offline.busy()) || typingInPage();
    if (!busy) { fn(); return; }
    setTimeout(function () { whenSettled(fn); }, 200);
  }

  /**
   * Load a mode. A remembered mode that no longer exists falls back to the default one.
   * The copy of this mode's data saved on this device (see offline.html) is shown at once, then replaced by the fresh load.
   * If Google cannot be reached but a saved copy is showing, the copy stays and loading is retried.
   */
  var loadToken = 0;
  function loadMode(mode, isPageLoad) {
    var token = ++loadToken, key = cacheKey(mode), haveFresh = false;
    if (FT.offline) {
      FT.offline.useMode(key);
      FT.offline.setUpdating(true);
      FT.offline.loadSnapshot(key).then(function (b) {
        if (!b || haveFresh || token !== loadToken) return;
        applyBootstrap(b, { requested: mode, restore: isPageLoad });
      });
    }
    function attempt() {
      google.script.run
        .withSuccessHandler(function (b) {
          if (token !== loadToken) return;
          haveFresh = true;
          // Wait for any change still on its way, so the fresh data does not undo it.
          whenSettled(function () {
            if (token !== loadToken) return;
            applyBootstrap(b, { requested: mode, keepPage: FT.ready, restore: isPageLoad });
            // The default mode's real id is known now, so the copy and the queue are kept under it from here on.
            if (FT.offline) { FT.offline.setUpdating(false); FT.offline.onFresh(cacheKey(mode)); FT.offline.saveSnapshot(cacheKey(mode), b); }
          });
        })
        .withFailureHandler(function (err) {
          if (token !== loadToken) return;
          if (mode && /Unknown mode/.test(FT.errorText(err))) { FT.state.mode = null; loadMode(null, isPageLoad); return; }
          if (FT.ready && FT.offline) {
            // A saved copy is showing: keep it, and try again until Google answers.
            if (FT.offline.isNetworkError(err)) { FT.offline.markDown(); setTimeout(attempt, 8000); }
            else { FT.offline.setUpdating(false); FT.toast('Could not update: ' + FT.errorText(err), 'error'); }
            return;
          }
          if (FT.offline) FT.offline.setUpdating(false);
          var offline = FT.offline && FT.offline.isNetworkError(err);
          $('app').innerHTML = '<div class="panel"><div class="label">' + (offline ? 'You are offline' : 'Could not load') + '</div><p>' +
            (offline ? 'Focus Tracker could not reach Google, and there is no saved copy on this device yet. Try again when you have a connection.' : FT.esc(FT.errorText(err))) +
            '</p><button class="btn" data-act="core.reload">Try again</button></div>';
        })
        .bootstrap(mode);
    }
    attempt();
  }

  /** Call when a drag ends: draws any update that arrived during it. */
  FT.dragEnded = function () {
    FT.state.dragging = false;
    FT.render();
  };

  FT.switchMode = function (mode) {
    if (mode === FT.state.mode) return;
    FT.leaving(); // edits waiting on a timer are sent to the mode they were made in
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    FT.state.mode = mode; FT.state.projectId = null; FT.state.editLayout = false; FT.ready = false;
    renderModeBar();
    FT.toast('Switched to ' + currentMode().label + '.');
    $('app').innerHTML = '<p class="empty">Loading…</p>';
    loadMode(mode);
  };

  FT.boot = function () {
    FT.state.mode = savedMode();
    loadMode(FT.state.mode, true);
  };

  // ---------- full width (desktop) ----------
  var WIDE_KEY = 'ft.wide';
  function applyWide(on) {
    document.body.classList.toggle('wide', on);
    var btn = $('wideBtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? 'Normal width' : 'Full width';
    btn.setAttribute('aria-label', btn.title);
    btn.textContent = on ? '⤡' : '⤢';
  }
  var wideSaved = false;
  try { wideSaved = localStorage.getItem(WIDE_KEY) === '1'; } catch (e) {}
  applyWide(wideSaved);

  // ---------- swipe between views (phone) ----------
  // A sideways swipe moves to the next or previous tab. It is ignored where a sideways gesture already means something:
  // boards (drag and drop, sideways scroll), sticky notes, whiteboards, editors, dialogs and anything that scrolls sideways.
  var swipeStart = null;
  /** Elements that use a sideways gesture themselves block a swipe outright. */
  function swipeBlocked(el) {
    for (; el && el !== document.body; el = el.parentElement) {
      if (el.matches && el.matches('.board, .sticky, .stickymenu, .wbfull, input, textarea, select, [contenteditable], .scrim, .tabs, [data-noswipe]')) return true;
    }
    return false;
  }
  /** Sideways scrollers (a wide table) only block the swipe while they can still scroll the way the finger is going. */
  function sidewaysScrollers(el) {
    var list = [];
    for (; el && el !== document.body; el = el.parentElement) {
      if (el.scrollWidth > el.clientWidth + 2) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') list.push(el);
      }
    }
    return list;
  }
  function canScrollThatWay(list, dx) {
    return list.some(function (el) { return dx < 0 ? el.scrollLeft + el.clientWidth < el.scrollWidth - 2 : el.scrollLeft > 2; });
  }

  function viewIds() { return tabs().map(function (m) { return m.id; }); }
  function currentIndex() { return viewIds().indexOf(FT.state.view === 'project' ? 'projects' : FT.state.view); }
  function motionOk() { return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) && document.documentElement.dataset.theme !== 'eink'; }

  /** Changes view with a slide: the page leaves one way and arrives from the other. dir is +1 for a later tab, -1 for an earlier one. */
  function slideTo(view, dir) {
    var el = $('app');
    if (!el || !motionOk() || !narrow.matches) { FT.go(view); return; }
    el.style.transition = 'transform 0.14s ease-in, opacity 0.14s ease-in';
    el.style.transform = 'translateX(' + (-dir * 64) + 'px)'; el.style.opacity = '0';
    setTimeout(function () {
      el.style.transition = 'none'; el.style.transform = 'translateX(' + (dir * 64) + 'px)';
      FT.go(view);
      void el.offsetWidth;
      el.style.transition = 'transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.24s ease-out'; el.style.transform = ''; el.style.opacity = '';
      setTimeout(function () { el.style.transition = ''; }, 280);
    }, 140);
  }
  function snapBack() {
    var el = $('app');
    if (!el) return;
    el.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out'; el.style.transform = ''; el.style.opacity = '';
    setTimeout(function () { el.style.transition = ''; }, 240);
  }

  document.addEventListener('touchstart', function (e) {
    swipeStart = narrow.matches && e.touches.length === 1 && !swipeBlocked(e.target)
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), dragging: false, scrollers: sidewaysScrollers(e.target), decided: false, blocked: false } : null;
  }, { passive: true });
  // While the finger is down the page follows it (less at the first or last view, so you can feel the end).
  document.addEventListener('touchmove', function (e) {
    var s = swipeStart, el = $('app');
    if (!s || !el || !e.touches.length || FT.state.editLayout || !motionOk()) return;
    var dx = e.touches[0].clientX - s.x, dy = e.touches[0].clientY - s.y;
    if (!s.dragging) {
      if (Math.abs(dx) > 16 && Math.abs(dx) > Math.abs(dy) * 1.6) { s.dragging = true; s.blocked = canScrollThatWay(s.scrollers, dx); s.decided = true; } else return;
    }
    if (s.blocked) return;
    var at = currentIndex(), target = at + (dx < 0 ? 1 : -1), atEnd = at < 0 || target < 0 || target >= viewIds().length;
    var pull = dx * (atEnd ? 0.2 : 0.55);
    el.style.transition = 'none'; el.style.transform = 'translateX(' + pull + 'px)'; el.style.opacity = String(1 - Math.min(Math.abs(pull) / 320, 0.45));
  }, { passive: true });
  document.addEventListener('touchcancel', function () { if (swipeStart && swipeStart.dragging) snapBack(); swipeStart = null; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var s = swipeStart; swipeStart = null;
    if (!s || !e.changedTouches.length || FT.state.editLayout) return;
    var dx = e.changedTouches[0].clientX - s.x, dy = e.changedTouches[0].clientY - s.y;
    var ids = viewIds(), at = currentIndex(), next = at + (dx < 0 ? 1 : -1);
    if (!s.decided) s.blocked = canScrollThatWay(s.scrollers, dx);
    if (s.blocked) return;
    var commit = Math.abs(dx) >= 70 && Math.abs(dx) >= Math.abs(dy) * 1.6 && Date.now() - s.t <= 900 && at >= 0 && next >= 0 && next < ids.length;
    if (commit) slideTo(ids[next], dx < 0 ? 1 : -1);
    else if (s.dragging) snapBack();
  }, { passive: true });

  // ---------- event delegation ----------
  FT.action('core.tab', function (el) {
    var ids = viewIds(), from = currentIndex(), to = ids.indexOf(el.dataset.view);
    if (narrow.matches && from >= 0 && to >= 0 && to !== from) slideTo(el.dataset.view, to > from ? 1 : -1); else FT.go(el.dataset.view);
  });
  function closeMenu() {
    document.body.classList.remove('menuopen');
    $('menuBtn').setAttribute('aria-expanded', 'false');
  }
  FT.action('core.menu', function () {
    var open = document.body.classList.toggle('menuopen');
    $('menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // The menu closes on a tap outside it, with Escape, and when it has done its job (Settings, a mode change, a view).
  document.addEventListener('click', function (e) {
    if (document.body.classList.contains('menuopen') && !(e.target.closest && e.target.closest('#menupanel, #menuBtn'))) closeMenu();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('menuopen')) closeMenu(); });
  // Undo, Redo and Back live in Settings: each closes it first, so the page shows what it did. The keyboard calls FT.undo and FT.redo directly.
  FT.action('core.back', function () { FT.closeDialog(); FT.back(); });
  // "Skip to content" moves focus with script, because following the #app link would add a browser history step that the back button would then undo.
  FT.action('core.skip', function () { var m = $('app'); if (m) { m.focus(); m.scrollIntoView(); } });
  FT.action('core.reload', function () { location.reload(); });
  FT.on('change', 'core.mode', function (el) {
    closeMenu();
    if (el.value === NEW_MODE) newModeDialog(); else FT.switchMode(el.value);
  });
  FT.action('core.layout', function () { FT.state.editLayout = !FT.state.editLayout; FT.render(); });
  FT.action('core.undo', function () { FT.closeDialog(); FT.undo(); });
  FT.action('core.redo', function () { FT.closeDialog(); FT.redo(); });
  FT.action('core.settings', function () { closeMenu(); settingsDialog(); });
  FT.action('core.hidePanel', function (el) { setPanelHidden(el.dataset.id, true); });
  FT.action('core.showPanel', function (el) { setPanelHidden(el.dataset.id, false); });
  FT.action('core.layoutReset', function () {
    if (!layoutPage) return;
    if (FT.store.layout) delete FT.store.layout[layoutPage];
    FT.rpc('layout', 'reset', { page: layoutPage }).catch(function () {});
  });
  FT.action('core.wide', function () {
    var on = !document.body.classList.contains('wide');
    applyWide(on);
    try { localStorage.setItem(WIDE_KEY, on ? '1' : '0'); } catch (e) {}
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    // A link inside a clickable card or row opens the link, not the card.
    var link = e.target.closest('a[href]');
    if (link && el.contains(link)) return;
    var fn = handlers.act[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest ? e.target.closest('[data-change]') : null;
    if (el && handlers.change[el.dataset.change]) handlers.change[el.dataset.change](el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target.closest ? e.target.closest('[data-input]') : null;
    if (el && handlers.input[el.dataset.input]) handlers.input[el.dataset.input](el, e);
  });
  function isTyping(el) {
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('dialogRoot').innerHTML) FT.requestCloseDialog();
      else if (FT.state.editLayout) { FT.state.editLayout = false; FT.render(); }
    }
    // Clickable areas that are not buttons (they hold links, which may not sit inside a button) answer Enter and Space.
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) {
      e.preventDefault();
      e.target.click();
      return;
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-enter]')) {
      var fn = handlers.enter[e.target.dataset.enter];
      if (fn) { e.preventDefault(); fn(e.target, e); }
      return;
    }
    // Enter saves an inline name field (column, list, category): it commits the change by leaving the field.
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type="text"][data-change]')) { e.preventDefault(); e.target.blur(); return; }
    if ((e.metaKey || e.ctrlKey) && !isTyping(e.target) && !$('dialogRoot').innerHTML) {
      var key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey) { e.preventDefault(); FT.undo(); }
      else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); FT.redo(); }
    }
  });

  return FT;
})();
</script>

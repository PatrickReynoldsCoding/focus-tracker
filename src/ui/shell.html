<script>
/**
 * Client core. Modules plug in with FT.module({...}); see AGENTS.md for the contract.
 *
 *   FT.module({
 *     id: 'log',
 *     tab:   { title: 'Log', order: 40, render: function (FT) { return '<html string>'; } },   // optional top-level tab
 *     slots: { 'project.page': [{ order: 10, span: 'full' | 'half', render: function (project, FT) { return html; } }],
 *              'projects.tab': [{ order: 10, render: function (FT) { return html; } }],
              'today.panels': [{ order: 10, render: function (FT) { return html; } }] },        // optional extension points
 *     onProject: function (projectId) {}                                                           // optional, runs when a project page opens
 *   });
 * Interactions use data attributes handled by delegation:
 *   data-act="module.name"     click   -> FT.action('module.name', function (el, event) {})
 *   data-change="module.name"  change  -> FT.on('change', 'module.name', fn)
 *   data-input="module.name"   input   -> FT.on('input', 'module.name', fn)   (every keystroke)
 *   data-enter="module.name"   Enter key in an input
 */
var FT = (function () {
  var modules = {}, loaded = {}, renderHooks = [], handlers = { act: {}, change: {}, input: {}, enter: {} }, pending = 0, syncTimer = null;
  var MODE_KEY = 'ft.mode';
  var FT = { store: {}, config: { staleDays: 5, modes: [] }, state: { view: null, projectId: null, mode: null }, ready: false };

  function $(id) { return document.getElementById(id); }

  // ---------- helpers ----------
  FT.esc = function (s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  FT.daysSince = function (iso) {
    var t = iso ? new Date(iso).getTime() : NaN;
    return isNaN(t) ? 9999 : Math.max(0, Math.floor((Date.now() - t) / 86400000));
  };
  FT.ageLabel = function (n) { return n >= 9999 ? 'never' : n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
  FT.ageClass = function (n) { return n >= FT.config.staleDays ? 'age-stale' : n >= 3 ? 'age-soon' : 'age-fresh'; };
  FT.fmtDate = function (iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  FT.categories = function () { return FT.store.categories || []; };
  FT.category = function (id) {
    var list = FT.categories();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return { id: id, label: id, color: '' };
  };
  FT.pill = function (id) {
    var c = FT.category(id);
    return '<span class="pill" style="--c: var(--cat-' + FT.esc(c.color || 'none') + ')">' + FT.esc(c.label) + '</span>';
  };
  FT.project = function (id) {
    var list = FT.store.projects || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  };
  // Web addresses in plain text. Trailing punctuation (a full stop after a link) stays outside the link.
  var URL_PATTERN = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]]/g;

  /** Escape text for HTML and make web addresses in it clickable links that open in a new tab. */
  FT.linkify = function (text) {
    return FT.esc(text).replace(URL_PATTERN, function (url) {
      return '<a class="textlink" href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
    });
  };

  FT.errorText = function (err) {
    var m = err && err.message ? err.message : String(err || 'Something went wrong.');
    return m.replace(/^(Error:\s*)+/, '');
  };

  // ---------- module registry ----------
  FT.module = function (def) { modules[def.id] = def; };
  /** A module's client code is always on the page; it only shows when the current mode loads its server side. */
  function isLoaded(id) { return !!loaded[id]; }
  FT.slots = function (name) {
    var out = [];
    Object.keys(modules).filter(isLoaded).forEach(function (id) {
      var s = modules[id].slots && modules[id].slots[name];
      if (s) (Array.isArray(s) ? s : [s]).forEach(function (x) { out.push(x); });
    });
    return out.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  };
  FT.onRender = function (fn) { renderHooks.push(fn); };
  FT.action = function (name, fn) { handlers.act[name] = fn; };
  FT.on = function (kind, name, fn) { handlers[kind][name] = fn; };

  // ---------- server calls ----------
  function setPending(delta) {
    pending += delta;
    var el = $('sync');
    clearTimeout(syncTimer);
    if (pending > 0) { el.textContent = 'Saving…'; return; }
    el.textContent = 'Saved';
    syncTimer = setTimeout(function () { el.textContent = ''; }, 1500);
  }

  /** An id for a new item, made here so the item can show before the server answers. 8 hex characters, like the server's. */
  FT.newId = function () {
    var bytes = new Uint8Array(4);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  };

  // Changes go to the server one at a time, in the order they were made. A reply's fresh data is only used when no
  // later change is still waiting: the screen already shows that later change, and older data would undo it.
  var queue = Promise.resolve(), waiting = 0;

  /**
   * Call a module's server api in the current mode. Merges any refreshed slices into the store and re-renders
   * unless opts.render === false. opts.parallel: a read that need not wait for earlier changes.
   * Slices that arrive after a mode switch belong to the old mode, so they are dropped.
   */
  FT.rpc = function (moduleId, fn, args, opts) {
    opts = opts || {};
    var mode = FT.state.mode;
    function send() {
      setPending(1);
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (res) {
            setPending(-1);
            if (!opts.parallel) waiting--;
            if (mode !== FT.state.mode) { resolve(res ? res.result : null); return; }
            if (res && res.undo) FT.state.canUndo = true;
            if (opts.parallel || waiting === 0) {
              var slices = (res && res.slices) || {};
              Object.keys(slices).forEach(function (k) { FT.store[k] = slices[k]; });
              if (opts.render !== false) FT.render();
            }
            resolve(res ? res.result : null);
          })
          .withFailureHandler(function (err) {
            setPending(-1);
            if (!opts.parallel) waiting--;
            var msg = FT.errorText(err);
            if (!opts.quiet) FT.toast(msg, 'error');
            reject(new Error(msg));
          })
          .rpc(moduleId, fn, args || {}, mode);
      });
    }
    if (opts.parallel) return send();
    waiting++;
    var done = queue.then(send);
    queue = done.catch(function () {});
    return done;
  };

  // Closing or reloading the tab while changes are still on their way would lose them, so the browser asks first.
  window.addEventListener('beforeunload', function (e) {
    if (waiting > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  /** A change shown on screen before the server answered failed: tell the user and reload the true state. */
  FT.saveFailed = function () {
    queue.then(function () { if (waiting === 0) FT.reload(); });
  };

  // Words for the undo message, by module.function. Anything else is "Last change".
  var UNDO_WORDS = {
    'kanban.addTask': 'Card added', 'kanban.deleteTask': 'Card deleted', 'kanban.moveTask': 'Card moved', 'kanban.updateTask': 'Card edit',
    'kanban.addColumn': 'Column added', 'kanban.renameColumn': 'Column rename', 'kanban.deleteColumn': 'Column deleted',
    'projects.create': 'Project added', 'projects.update': 'Project edit', 'projects.remove': 'Project deleted',
    'lists.create': 'List added', 'lists.rename': 'List rename', 'lists.remove': 'List deleted', 'lists.setColor': 'List colour',
    'criteria.add': 'Criterion added', 'criteria.update': 'Criterion change', 'criteria.remove': 'Criterion deleted',
    'categories.add': 'Category added', 'categories.update': 'Category edit', 'categories.remove': 'Category deleted',
    'resources.add': 'Link added', 'resources.remove': 'Link removed', 'today.finish': 'Session saved', 'today.swap': 'Focus swap'
  };
  FT.undoWords = function (action) { return UNDO_WORDS[action] || 'Last change'; };

  /** Undo the newest change in this mode (after any changes still being saved). */
  FT.undo = function () {
    var mode = FT.state.mode;
    waiting++;
    var done = queue.then(function () {
      setPending(1);
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            setPending(-1); waiting--;
            if (mode !== FT.state.mode) { resolve(); return; }
            if (!res.undone) { FT.toast('Nothing to undo.'); resolve(); return; }
            FT.store = res.data;
            FT.render();
            FT.toast('Undone: ' + FT.undoWords(res.undone));
            resolve();
          })
          .withFailureHandler(function (err) { setPending(-1); waiting--; FT.toast(FT.errorText(err), 'error'); resolve(); })
          .undo(mode);
      });
    });
    queue = done;
    return done;
  };

  FT.reload = function () {
    return new Promise(function (resolve) {
      google.script.run.withSuccessHandler(function (b) {
        FT.store = b.data; FT.render(); resolve();
      }).withFailureHandler(function (e) { FT.toast(FT.errorText(e), 'error'); resolve(); }).bootstrap(FT.state.mode);
    });
  };

  // ---------- toast ----------
  var toastTimer = null;
  /** A short message at the bottom. action: optional { label, run } for a button in it, such as Undo. */
  FT.toast = function (msg, kind, action) {
    var el = $('toast');
    el.textContent = msg; el.className = 'toast' + (kind ? ' ' + kind : ''); el.hidden = false;
    if (action) {
      var btn = document.createElement('button');
      btn.className = 'toastbtn'; btn.textContent = action.label;
      btn.onclick = function () { el.hidden = true; action.run(); };
      el.appendChild(btn);
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, action ? 7000 : 4500);
  };

  /** After a delete: say what went and offer Undo. */
  FT.deleted = function (what) {
    FT.toast(what + ' deleted.', null, { label: 'Undo', run: FT.undo });
  };

  // ---------- dialog ----------
  FT.closeDialog = function () { $('dialogRoot').innerHTML = ''; };
  /**
   * opts: { title, subtitle, body (html), fields: [{id,label,type,value,placeholder,options}], after (html), hint (text), submit, danger,
   *         wide (true for a wider dialog), onOpen(), onSubmit(values) }
   * onSubmit may return a promise; a thrown error or rejection is shown inside the dialog.
   */
  FT.dialog = function (opts) {
    var fields = (opts.fields || []).map(function (f) {
      var id = 'dlg-' + f.id, ctl;
      if (f.type === 'textarea') ctl = '<textarea id="' + id + '" placeholder="' + FT.esc(f.placeholder || '') + '" style="min-height:84px">' + FT.esc(f.value || '') + '</textarea>';
      else if (f.type === 'select') ctl = '<select id="' + id + '">' + f.options.map(function (o) {
        return '<option value="' + FT.esc(o.value) + '"' + (o.value === f.value ? ' selected' : '') + '>' + FT.esc(o.label) + '</option>';
      }).join('') + '</select>';
      else ctl = '<input type="text" id="' + id + '" value="' + FT.esc(f.value || '') + '" placeholder="' + FT.esc(f.placeholder || '') + '">';
      return '<label for="' + id + '">' + FT.esc(f.label) + '</label>' + ctl;
    }).join('');
    $('dialogRoot').innerHTML = '<div class="scrim" id="dlg-scrim"><div class="dialog' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="dlg-heading">' +
      '<h2 id="dlg-heading">' + FT.esc(opts.title) + '</h2>' +
      (opts.subtitle ? '<div class="meta">' + FT.esc(opts.subtitle) + '</div>' : '') +
      (opts.body || '') + fields + (opts.after || '') +
      '<div class="err" id="dlg-err" role="alert"></div>' +
      (opts.hint ? '<div class="hint">' + FT.esc(opts.hint) + '</div>' : '') +
      '<div class="actions"><button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="dlg-submit">' + FT.esc(opts.submit || 'Save') + '</button>' +
      '<button class="btn" id="dlg-cancel">Cancel</button></div></div></div>';

    function values() {
      var v = {};
      (opts.fields || []).forEach(function (f) { v[f.id] = $('dlg-' + f.id).value.trim(); });
      return v;
    }
    function submit() {
      var btn = $('dlg-submit'); btn.disabled = true; $('dlg-err').textContent = '';
      Promise.resolve().then(function () { return opts.onSubmit(values()); })
        .then(function () { FT.closeDialog(); })
        .catch(function (e) { btn.disabled = false; $('dlg-err').textContent = FT.errorText(e); });
    }
    $('dlg-submit').onclick = submit;
    $('dlg-cancel').onclick = FT.closeDialog;
    $('dlg-scrim').onclick = function (e) { if (e.target.id === 'dlg-scrim') FT.closeDialog(); };
    $('dialogRoot').onkeydown = function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
    };
    var first = $('dialogRoot').querySelector('input, textarea, select');
    if (first) first.focus(); else $('dlg-submit').focus();
    if (opts.onOpen) opts.onOpen();
  };

  // ---------- navigation and rendering ----------
  function tabs() {
    return Object.keys(modules).filter(isLoaded).map(function (id) { return modules[id]; })
      .filter(function (m) { return m.tab; })
      .sort(function (a, b) { return (a.tab.order || 0) - (b.tab.order || 0); });
  }

  FT.go = function (view, opts) {
    FT.state.view = view;
    if (view === 'project') {
      FT.state.projectId = opts.id;
      Object.keys(modules).forEach(function (id) { if (modules[id].onProject) modules[id].onProject(opts.id); });
    }
    FT.render();
    window.scrollTo(0, 0);
  };

  function renderTabs() {
    var current = FT.state.view === 'project' ? 'projects' : FT.state.view;
    $('tabs').innerHTML = tabs().map(function (m) {
      return '<button class="tab" data-act="core.tab" data-view="' + FT.esc(m.id) + '"' + (m.id === current ? ' aria-current="page"' : '') + '>' + FT.esc(m.tab.title) + '</button>';
    }).join('');
  }

  function projectPage(id) {
    var project = FT.project(id);
    if (!project) return '<p class="empty">That project no longer exists.</p><button class="btn" data-act="core.tab" data-view="projects">Back to projects</button>';
    var panels = FT.slots('project.page').map(function (s) {
      return { id: s.id || 'slot' + s.order, title: s.title, html: s.render(project, FT), w: s.span === 'full' ? 12 : 6 };
    });
    return '<div><button class="btn sm back" data-act="core.tab" data-view="projects">‹ All projects</button></div>' + FT.layout('project', panels);
  }

  // ---------- page layout ----------
  // Desktop pages are a 12-column grid (GridStack, loaded from a CDN). In "Edit layout" mode panels can be dragged
  // and their left or right edge dragged to change the width; heights follow the content. Places are saved per page.
  // On a phone, or if the grid library did not load, panels flow in order.
  var LAYOUT_COLUMNS = 12, grids = [], layoutPage = null, layoutHidden = [];
  var narrow = window.matchMedia('(max-width: 760px)');
  if (narrow.addEventListener) narrow.addEventListener('change', function () { FT.state.editLayout = false; FT.render(); });

  function canArrange() { return !!window.GridStack && isLoaded('layout') && !narrow.matches; }

  /** Saved panels first, in reading order (top to bottom, left to right), then new panels in their default order. */
  function readingOrder(panels, saved) {
    return panels.map(function (p, i) { return { p: p, i: i, s: saved[p.id] }; }).sort(function (a, b) {
      if (a.s && b.s) return (a.s.y - b.s.y) || (a.s.x - b.s.x);
      if (a.s || b.s) return a.s ? -1 : 1;
      return a.i - b.i;
    }).map(function (x) { return x.p; });
  }

  /**
   * Lay out a page's panels. page: a short key such as 'today'. panels: [{ id, html, w }] where w is the default
   * width in twelfths. Panels with no html are left out.
   */
  FT.layout = function (page, panels) {
    layoutPage = page;
    var saved = (FT.store.layout || {})[page] || {};
    layoutHidden = panels.filter(function (p) { return p.html && saved[p.id] && saved[p.id].hidden; });
    var shown = panels.filter(function (p) { return p.html && !(saved[p.id] && saved[p.id].hidden); });
    if (!canArrange()) {
      return '<div class="lflow">' + readingOrder(shown, saved).map(function (p) {
        var w = saved[p.id] ? saved[p.id].w : (p.w || LAYOUT_COLUMNS);
        return '<div class="lcell" style="--span:' + w + '">' + p.html + '</div>';
      }).join('') + '</div>';
    }
    return '<div class="grid-stack" data-page="' + FT.esc(page) + '">' + shown.map(function (p) {
      var s = saved[p.id];
      var place = s ? ' gs-x="' + s.x + '" gs-y="' + s.y + '" gs-w="' + s.w + '"' : ' gs-w="' + (p.w || LAYOUT_COLUMNS) + '" gs-auto-position="true"';
      var hide = FT.state.editLayout ? '<button class="hidebtn" data-act="core.hidePanel" data-id="' + FT.esc(p.id) + '" aria-label="Hide this panel">Hide</button>' : '';
      return '<div class="grid-stack-item" gs-id="' + FT.esc(p.id) + '"' + place + '><div class="grid-stack-item-content">' + p.html + '</div>' + hide + '</div>';
    }).join('') + '</div>';
  };

  function saveLayout(page, grid) {
    var previous = (FT.store.layout || {})[page] || {};
    var items = grid.engine.nodes.map(function (n) { return { id: n.id, x: n.x, y: n.y, w: n.w }; });
    Object.keys(previous).forEach(function (id) {
      if (previous[id].hidden) items.push({ id: id, x: previous[id].x, y: previous[id].y, w: previous[id].w, hidden: true });
    });
    var positions = {};
    items.forEach(function (it) { positions[it.id] = { x: it.x, y: it.y, w: it.w }; if (it.hidden) positions[it.id].hidden = true; });
    FT.store.layout = FT.store.layout || {};
    FT.store.layout[page] = positions;
    FT.rpc('layout', 'save', { page: page, items: items }, { render: false }).catch(function () {});
  }

  function initGrids() {
    grids.forEach(function (g) { g.destroy(false); });
    grids = [];
    if (!canArrange()) return;
    Array.prototype.forEach.call(document.querySelectorAll('#app .grid-stack'), function (el) {
      var grid = window.GridStack.init({
        column: LAYOUT_COLUMNS, cellHeight: 8, margin: 8, float: false, animate: false,
        staticGrid: !FT.state.editLayout, sizeToContent: true, resizable: { handles: 'e, w' }
      }, el);
      var page = el.dataset.page;
      grid.on('dragstop resizestop', function () { setTimeout(function () { saveLayout(page, grid); }, 0); });
      grids.push(grid);
    });
  }

  function renderLayoutButton() {
    var btn = $('layoutBtn');
    if (!btn) return;
    btn.hidden = !canArrange() || !layoutPage;
    btn.setAttribute('aria-pressed', FT.state.editLayout ? 'true' : 'false');
  }

  function setPanelHidden(id, hidden) {
    if (!layoutPage) return;
    var page = layoutPage;
    FT.store.layout = FT.store.layout || {};
    var pageLayout = FT.store.layout[page] = FT.store.layout[page] || {};
    var place = pageLayout[id] || { x: 0, y: 10000, w: 12 };
    if (hidden) place.hidden = true; else delete place.hidden;
    pageLayout[id] = place;
    FT.render();
    FT.rpc('layout', 'setHidden', { page: page, id: id, hidden: hidden }, { render: false }).catch(FT.saveFailed);
  }

  function hiddenListHtml() {
    if (!layoutHidden.length) return '';
    return '<span class="hiddenlist">Hidden: ' + layoutHidden.map(function (p) {
      return '<button class="btn sm" data-act="core.showPanel" data-id="' + FT.esc(p.id) + '">Show ' + FT.esc(p.title || p.id) + '</button>';
    }).join(' ') + '</span>';
  }

  function editBarHtml() {
    if (!FT.state.editLayout || !canArrange() || !layoutPage) return '';
    return '<div class="editbar" role="status"><span><b>Editing layout.</b> Drag a panel to move it. Drag its left or right edge to change its width. "Hide" takes a panel off the page.</span>' + hiddenListHtml() +
      '<span class="actions" style="margin:0"><button class="btn sm" data-act="core.layoutReset">Reset this page</button>' +
      '<button class="btn sm primary" data-act="core.layout">Done</button></span></div>';
  }

  var renderWaiting = false;
  FT.render = function () {
    if (!FT.ready) return;
    // While a card is being dragged, a redraw would pull it out from under the pointer; draw once the drag ends.
    if (FT.state.dragging) { renderWaiting = true; return; }
    renderWaiting = false;
    renderTabs();
    layoutPage = null;
    var html = '';
    if (FT.state.view === 'project') html = projectPage(FT.state.projectId);
    else if (modules[FT.state.view] && modules[FT.state.view].tab) html = modules[FT.state.view].tab.render(FT);
    var y = window.scrollY;
    $('app').innerHTML = editBarHtml() + html; // after the page html, so the bar knows the page's hidden panels
    document.body.classList.toggle('editing-layout', !!(FT.state.editLayout && canArrange() && layoutPage));
    initGrids();
    renderLayoutButton();
    window.scrollTo(0, y);
    renderHooks.forEach(function (fn) { fn(); });
  };

  // ---------- modes ----------
  var NEW_MODE = '__new';

  function currentMode() {
    return (FT.config.modes || []).filter(function (m) { return m.id === FT.state.mode; })[0] || { id: FT.state.mode, label: '', accent: '' };
  }

  /** The mode menu: every mode, then "New mode…". The page takes the mode's accent colour. */
  function renderModeBar() {
    var modes = FT.config.modes || [], mode = currentMode();
    $('modes').innerHTML = '<select id="modeSelect" class="modeselect" aria-label="Mode" data-change="core.mode">' + modes.map(function (m) {
      return '<option value="' + FT.esc(m.id) + '"' + (m.id === FT.state.mode ? ' selected' : '') + '>' + FT.esc(m.label) + '</option>';
    }).join('') + '<option disabled>────</option><option value="' + NEW_MODE + '">+ New mode…</option></select>';
    var link = $('driveLink');
    link.hidden = !FT.config.folderUrl;
    link.href = FT.config.folderUrl || '#';
    link.title = 'Open the ' + mode.label + ' folder in Google Drive';
    link.setAttribute('aria-label', link.title);
    document.body.dataset.mode = FT.state.mode || '';
    if (mode.accent) { document.body.dataset.accent = mode.accent; document.body.style.setProperty('--mode-accent', 'var(--cat-' + mode.accent + ')'); }
    else { delete document.body.dataset.accent; document.body.style.removeProperty('--mode-accent'); }
  }

  function newModeDialog() {
    renderModeBar();
    FT.dialog({
      title: 'New mode',
      subtitle: 'A mode keeps its own projects, lists and settings, in its own Sheet and Drive folder.',
      submit: 'Create mode',
      fields: [{ id: 'modename', label: 'Name', placeholder: 'e.g. Side projects' }],
      onSubmit: function (v) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(function (mode) {
              FT.config.modes = (FT.config.modes || []).concat([mode]);
              resolve();
              FT.switchMode(mode.id);
            })
            .withFailureHandler(function (err) { reject(new Error(FT.errorText(err))); })
            .createMode(v.modename);
        });
      }
    });
  }

  function applyBootstrap(b) {
    FT.config = b.config; FT.store = b.data; FT.state.mode = b.config.mode; FT.ready = true;
    loaded = {};
    b.modules.forEach(function (m) { loaded[m.id] = true; });
    document.title = b.config.appName || document.title;
    var first = tabs()[0];
    FT.state.view = first ? first.id : null;
    renderModeBar();
    FT.render();
  }

  function savedMode() {
    try { return localStorage.getItem(MODE_KEY); } catch (e) { return null; }
  }

  /** Load a mode. A remembered mode that no longer exists falls back to the default one. */
  function loadMode(mode) {
    google.script.run
      .withSuccessHandler(applyBootstrap)
      .withFailureHandler(function (err) {
        if (mode && /Unknown mode/.test(FT.errorText(err))) { FT.state.mode = null; loadMode(null); return; }
        $('app').innerHTML = '<div class="panel"><div class="label">Could not load</div><p>' + FT.esc(FT.errorText(err)) +
          '</p><button class="btn" data-act="core.reload">Try again</button></div>';
      })
      .bootstrap(mode);
  }

  /** Call when a drag ends: draws any update that arrived during it. */
  FT.dragEnded = function () {
    FT.state.dragging = false;
    FT.render();
  };

  FT.switchMode = function (mode) {
    if (mode === FT.state.mode) return;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    FT.state.mode = mode; FT.state.projectId = null; FT.state.editLayout = false; FT.ready = false;
    renderModeBar();
    $('app').innerHTML = '<p class="empty">Loading…</p>';
    loadMode(mode);
  };

  FT.boot = function () {
    FT.state.mode = savedMode();
    loadMode(FT.state.mode);
  };

  // ---------- full width (desktop) ----------
  var WIDE_KEY = 'ft.wide';
  function applyWide(on) {
    document.body.classList.toggle('wide', on);
    var btn = $('wideBtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? 'Normal width' : 'Full width';
    btn.setAttribute('aria-label', btn.title);
    btn.textContent = on ? '⤡' : '⤢';
  }
  var wideSaved = false;
  try { wideSaved = localStorage.getItem(WIDE_KEY) === '1'; } catch (e) {}
  applyWide(wideSaved);

  // ---------- event delegation ----------
  FT.action('core.tab', function (el) { FT.go(el.dataset.view); });
  FT.action('core.reload', function () { location.reload(); });
  FT.on('change', 'core.mode', function (el) {
    if (el.value === NEW_MODE) newModeDialog(); else FT.switchMode(el.value);
  });
  FT.action('core.layout', function () { FT.state.editLayout = !FT.state.editLayout; FT.render(); });
  FT.action('core.undo', function () { FT.undo(); });
  FT.action('core.hidePanel', function (el) { setPanelHidden(el.dataset.id, true); });
  FT.action('core.showPanel', function (el) { setPanelHidden(el.dataset.id, false); });
  FT.action('core.layoutReset', function () {
    if (!layoutPage) return;
    if (FT.store.layout) delete FT.store.layout[layoutPage];
    FT.rpc('layout', 'reset', { page: layoutPage }).catch(function () {});
  });
  FT.action('core.wide', function () {
    var on = !document.body.classList.contains('wide');
    applyWide(on);
    try { localStorage.setItem(WIDE_KEY, on ? '1' : '0'); } catch (e) {}
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    // A link inside a clickable card or row opens the link, not the card.
    var link = e.target.closest('a[href]');
    if (link && el.contains(link)) return;
    var fn = handlers.act[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest ? e.target.closest('[data-change]') : null;
    if (el && handlers.change[el.dataset.change]) handlers.change[el.dataset.change](el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target.closest ? e.target.closest('[data-input]') : null;
    if (el && handlers.input[el.dataset.input]) handlers.input[el.dataset.input](el, e);
  });
  function isTyping(el) {
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('dialogRoot').innerHTML) FT.closeDialog();
      else if (FT.state.editLayout) { FT.state.editLayout = false; FT.render(); }
    }
    // Clickable areas that are not buttons (they hold links, which may not sit inside a button) answer Enter and Space.
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) {
      e.preventDefault();
      e.target.click();
      return;
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-enter]')) {
      var fn = handlers.enter[e.target.dataset.enter];
      if (fn) { e.preventDefault(); fn(e.target, e); }
      return;
    }
    // Enter saves an inline name field (column, list, category): it commits the change by leaving the field.
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type="text"][data-change]')) { e.preventDefault(); e.target.blur(); return; }
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !isTyping(e.target) && !$('dialogRoot').innerHTML) {
      e.preventDefault();
      FT.undo();
    }
  });

  return FT;
})();
</script>

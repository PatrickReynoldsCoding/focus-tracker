<style>
/* Shared look: tokens, layout and generic components. Module-specific styles live in each module's view.html. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #e6ecea; --ink: #15201e; --muted: #5a6b68; --line: #d3dcd9;
  --accent: #0e6b62; --accent-ink: #ffffff; --accent-soft: #d9efeb;
  --warn: #a35d00; --warn-soft: #fbeed8; --bad: #b3322f; --bad-soft: #f9e0df; --ok: #2b7a4b; --ok-soft: #dcf0e4;
  --cat-1: #0e6b62; --cat-2: #a35d00; --cat-3: #4a5fa8; --cat-4: #b3322f; --cat-5: #7a4fa8; --cat-6: #2b7a4b; --cat-7: #5a6b68; --cat-8: #c2561b;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
/* Dark colours: when the theme is Dark, or "Same as computer" and the computer is in dark mode (Settings, ⚙). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #151f1d; --surface-2: #1d2b29; --ink: #e6efed; --muted: #94a9a5; --line: #2a3b38;
    --accent: #4fc4b5; --accent-ink: #062320; --accent-soft: #14312e;
    --warn: #e8a54b; --warn-soft: #33260f; --bad: #ee7b77; --bad-soft: #351817; --ok: #6cc590; --ok-soft: #142a1d;
    --cat-1: #4fc4b5; --cat-2: #e8a54b; --cat-3: #8fa5ee; --cat-4: #ee7b77; --cat-5: #c4a2ee; --cat-6: #6cc590; --cat-7: #a9bbb7; --cat-8: #f29a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0d1413; --surface: #151f1d; --surface-2: #1d2b29; --ink: #e6efed; --muted: #94a9a5; --line: #2a3b38;
    --accent: #4fc4b5; --accent-ink: #062320; --accent-soft: #14312e;
    --warn: #e8a54b; --warn-soft: #33260f; --bad: #ee7b77; --bad-soft: #351817; --ok: #6cc590; --ok-soft: #142a1d;
    --cat-1: #4fc4b5; --cat-2: #e8a54b; --cat-3: #8fa5ee; --cat-4: #ee7b77; --cat-5: #c4a2ee; --cat-6: #6cc590; --cat-7: #a9bbb7; --cat-8: #f29a5e;
    color-scheme: dark;
}
/* Work mode uses a blue accent so it is always clear which mode's data is on screen. */
body[data-mode="work"] { --accent: #2f5aa8; --accent-soft: #dfe7f6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-mode="work"] { --accent: #8fb0ee; --accent-ink: #0b1a33; --accent-soft: #18243a; } }
:root[data-theme="dark"] body[data-mode="work"] { --accent: #8fb0ee; --accent-ink: #0b1a33; --accent-soft: #18243a; }
/* Modes made in the app pick an accent from the category palette (body style --mode-accent). */
body[data-accent] { --accent: var(--mode-accent); --accent-soft: color-mix(in srgb, var(--mode-accent) 16%, var(--surface)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-accent] { --accent-ink: #0d1413; } }
:root[data-theme="dark"] body[data-accent] { --accent-ink: #0d1413; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
a.textlink { overflow-wrap: anywhere; text-decoration: underline; text-underline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1 1 auto; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.sync { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; flex: none; }
.iconbtn:hover, .iconbtn[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
body.wide .wrap { max-width: none; }
a.iconbtn { display: inline-flex; align-items: center; justify-content: center; }
a.iconbtn[hidden] { display: none; }
.modes { flex: none; }
.modeselect { width: auto; padding: 6px 30px 6px 12px; font-weight: 600; font-size: 13.5px; border-color: var(--accent); color: var(--accent); background-color: var(--accent-soft); cursor: pointer; }
@media (max-width: 760px) { .widebtn, .layoutbtn { display: none; } body.wide .wrap { max-width: 1080px; } }
/* Phone: the bar is only the menu button, the name, sync and undo. Views, mode and Settings sit in the menu. */
.menubtn, .menulabel { display: none; }
@media (max-width: 760px) {
  .bar { flex-wrap: wrap; gap: 6px 10px; padding: 8px 0; }
  .menubtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
  .brand { font-size: 17px; flex: 1 1 auto; }
  #undoBtn { width: 40px; height: 40px; }
  .sync { min-width: 0; }
  .tabs, .modes, #settingsBtn { display: none; }
  body.menuopen .tabs { display: flex; flex-direction: column; flex: 1 1 100%; overflow: visible; gap: 2px; }
  body.menuopen .tab { text-align: left; padding: 12px 14px; font-size: 16px; }
  body.menuopen .modes { display: block; flex: 1 1 100%; }
  body.menuopen .modeselect { width: 100%; min-height: 44px; font-size: 16px; }
  body.menuopen #settingsBtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 14px; font-size: 16px; color: var(--ink); }
  body.menuopen .menulabel { display: inline; }
}

main { padding-top: 16px; display: grid; gap: 16px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
/* Page layout: a 12-column flow when panels cannot be arranged (phone, or the grid library did not load). */
.lflow { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.lcell { grid-column: span var(--span, 12); min-width: 0; display: grid; gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .lflow { grid-template-columns: minmax(0, 1fr); } .lcell { grid-column: 1 / -1; } }
/* GridStack: the item insets by its margin; panels fill the content box. Outside edit mode nothing scrolls inside. */
.grid-stack { margin: -8px; }
.grid-stack-item-content { overflow: visible !important; display: grid; gap: 16px; align-content: start; }
body.editing-layout .grid-stack-item-content { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 10px; cursor: move; }
body.editing-layout .grid-stack-item-content > * { pointer-events: none; }
.grid-stack-placeholder > .placeholder-content { border: 2px dashed var(--accent) !important; border-radius: 10px; background: var(--accent-soft) !important; }
.editbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.iconbtn[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.label { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 13.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.age-fresh { color: var(--ok); } .age-soon { color: var(--warn); font-weight: 600; } .age-stale { color: var(--bad); font-weight: 600; }
.next { margin: 16px 0 10px; padding: 14px; border-radius: 8px; background: var(--accent-soft); font-size: 17px; font-weight: 500; }
.next small { display: block; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 4px; }
.banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.empty { color: var(--muted); padding: 10px 0; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.45; cursor: default; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
.scroll table { min-width: 620px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

select, input[type="text"], textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
select.auto { width: auto; max-width: 100%; }
textarea { min-height: 150px; resize: vertical; }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 13, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(460px, 100%); max-height: 100%; overflow: auto; }
.dialog.wide { width: min(640px, 100%); }
.choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dialog .choice label { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); font-size: 14px; position: relative; text-align: center; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; font-weight: 600; }
.choice label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.dialog .settingrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }
.dialog h2 { font-size: 22px; margin-bottom: 4px; }
.dialog label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 5px; }
.dialog p { margin: 8px 0 0; color: var(--muted); }
.dialog .actions { margin-top: 20px; }
.hint { font-size: 13px; color: var(--muted); background: var(--warn-soft); border-radius: 8px; padding: 9px 11px; margin-top: 14px; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: min(92vw, 520px); font-size: 14px; }
.toast.error { background: var(--bad); color: #fff; }
.toastbtn { margin-left: 12px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
.hidebtn { position: absolute; top: 14px; right: 14px; z-index: 5; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.hiddenlist { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.back { margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) { .btn, .tab { transition: background 0.12s, color 0.12s; } }
</style>

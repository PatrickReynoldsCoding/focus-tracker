:root {

/* Dark colours: when the theme is Dark, or "Same as computer" and the computer is in dark mode (Settings, ⚙). */

    --bg: #0d1413; --surface: #151f1d; --surface-2: #1d2b29; --ink: #e6efed; --muted: #a6b9b5; --line: #2a3b38;
    --accent: #4fc4b5; --accent-ink: #062320; --accent-soft: #14312e;
    --warn: #e8a54b; --warn-soft: #33260f; --bad: #ee7b77; --bad-soft: #351817; --ok: #6cc590; --ok-soft: #142a1d;
    --cat-1: #4fc4b5; --cat-2: #e8a54b; --cat-3: #8fa5ee; --cat-4: #ee7b77; --cat-5: #c4a2ee; --cat-6: #6cc590; --cat-7: #a9bbb7; --cat-8: #f29a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0d1413; --surface: #151f1d; --surface-2: #1d2b29; --ink: #e6efed; --muted: #a6b9b5; --line: #2a3b38;
    --accent: #4fc4b5; --accent-ink: #062320; --accent-soft: #14312e;
    --warn: #e8a54b; --warn-soft: #33260f; --bad: #ee7b77; --bad-soft: #351817; --ok: #6cc590; --ok-soft: #142a1d;
    --cat-1: #4fc4b5; --cat-2: #e8a54b; --cat-3: #8fa5ee; --cat-4: #ee7b77; --cat-5: #c4a2ee; --cat-6: #6cc590; --cat-7: #a9bbb7; --cat-8: #f29a5e;
    color-scheme: dark;
}
/* Work mode uses a blue accent so it is always clear which mode's data is on screen. */
body[data-mode="work"] { --accent: #2f5aa8; --accent-soft: #dfe7f6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="eink"]) body[data-mode="work"] { --accent: #8fb0ee; --accent-ink: #0b1a33; --accent-soft: #18243a; } }
:root[data-theme="dark"] body[data-mode="work"] { --accent: #8fb0ee; --accent-ink: #0b1a33; --accent-soft: #18243a; }
/* Modes made in the app pick an accent from the category palette (body style --mode-accent). */
body[data-accent] { --accent: var(--mode-accent); --accent-soft: color-mix(in srgb, var(--mode-accent) 16%, var(--surface)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="eink"]) body[data-accent] { --accent-ink: #0d1413; } }
:root[data-theme="dark"] body[data-accent] { --accent-ink: #0d1413; }
/* E-ink (Hisense A9 and similar): white paper, black ink, thick black borders, no colour tints, shadows or motion, big tap targets. */
:root[data-theme="eink"] {
  --bg: #fff; --surface: #fff; --surface-2: #fff; --ink: #000; --muted: #222; --line: #000;
  --accent: #000; --accent-ink: #fff; --accent-soft: #fff;

:root[data-theme="eink"] body[data-mode="work"], :root[data-theme="eink"] body[data-accent] { --accent: #000; --accent-ink: #fff; --accent-soft: #fff; }
:root[data-theme="eink"] *, :root[data-theme="eink"] *::before, :root[data-theme="eink"] *::after {
  transition: none !important; animation: none !important; box-shadow: none !important; text-shadow: none !important; scroll-behavior: auto !important;
}
:root[data-theme="eink"] body { font-size: 17px; line-height: 1.55; background: #fff; }
:root[data-theme="eink"] .panel, :root[data-theme="eink"] .dialog, :root[data-theme="eink"] .col, :root[data-theme="eink"] .next,
:root[data-theme="eink"] .lockbox, :root[data-theme="eink"] .rotq, :root[data-theme="eink"] .sticky, :root[data-theme="eink"] .stickymenu,

:root[data-theme="eink"] .btn, :root[data-theme="eink"] .iconbtn, :root[data-theme="eink"] input:not([type="radio"]):not([type="checkbox"]),

:root[data-theme="eink"] .tab { border: 2px solid transparent; font-weight: 600; color: #000; padding: 10px 14px; }
:root[data-theme="eink"] .tab[aria-current="page"] { background: #000; color: #fff; }

:root[data-theme="eink"] .pill::before { background: #000; }
:root[data-theme="eink"] .age-fresh, :root[data-theme="eink"] .age-soon, :root[data-theme="eink"] .age-stale { color: #000; }
:root[data-theme="eink"] .age-stale { text-decoration: underline; }
:root[data-theme="eink"] .scrim { background: #fff; }
:root[data-theme="eink"] .rotq .rotbody { transition: none !important; }
:root[data-theme="eink"] :focus-visible { outline: 4px solid #000; outline-offset: 2px; }
:root[data-theme="eink"] .sticky { --paper: #fff; --paper-a: 1; }
:root[data-theme="eink"] .swatches span { border: 2px solid #000; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
body { overscroll-behavior-x: none; }
body.dlg-open { overflow: hidden; }
main, .dialog, .toast, .panel { overflow-wrap: anywhere; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
a.textlink { overflow-wrap: anywhere; text-decoration: underline; text-underline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 12px 0; display: flex; flex-wrap: nowrap; align-items: center; gap: 10px 16px; border-bottom: 1px solid var(--line); }
.menupanel { display: contents; }
/* Anything waiting for Google shows a bar along the bottom of the header (after a short moment, so quick saves do not flash it). */
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 40% 100%; background-repeat: no-repeat; transition: opacity 0.1s 0.2s; }

@media (prefers-reduced-motion: reduce) { body.busy .bar::after { animation: none; background: var(--accent); } }
:root[data-theme="eink"] body.busy .bar::after { animation: none; background: #000; }
.brand { flex: none; }
.backbtn { order: 0; } .brand { order: 1; } .tabs { order: 2; } .sync { order: 3; } .modes { order: 4; } #settingsBtn { order: 5; } #undoBtn { order: 6; } #redoBtn { order: 7; } .layoutbtn { order: 8; } .widebtn { order: 9; }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
/* Narrow desktop and tablet: the views get their own row under the name and buttons, so none are cut off. */
@media (min-width: 761px) and (max-width: 1000px) { .bar { flex-wrap: wrap; } .brand { flex: 1 1 auto; } .tabs { order: 20; flex: 1 1 100%; } }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1 1 auto; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.sync { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; flex: none; }
.iconbtn:hover, .iconbtn[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
body.wide .wrap { max-width: none; }
a.iconbtn { display: inline-flex; align-items: center; justify-content: center; }

.modes { flex: none; }

@media (max-width: 760px) { .widebtn, .layoutbtn { display: none; } body.wide .wrap { max-width: 1080px; } }
.backbtn { display: inline-flex; align-items: center; justify-content: center; }
/* Phone: the bar is one row: back, menu, name, a status dot, undo, redo. Views, mode and Settings are in the menu, a panel that opens over the page. */
.menubtn, .menulabel { display: none; }
@media (max-width: 760px) {
  .bar { flex-wrap: nowrap; gap: 6px; padding: 8px 0; }
  .backbtn, .menubtn, #undoBtn, #redoBtn { width: 44px; height: 44px; }
  .menubtn { display: inline-flex; align-items: center; justify-content: center; }
  .brand { font-size: 16px; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .backbtn { order: 0; } .menubtn { order: 1; } .brand { order: 2; } .sync { order: 3; } #undoBtn { order: 5; } #redoBtn { order: 6; }
  /* The saved / saving words are a small dot here (the words stay for screen readers). */
  .sync { flex: none; min-width: 0; font-size: 0; display: inline-flex; align-items: center; }
  .sync:not(:empty)::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .sync[data-state="saving"]::before { background: var(--warn); }
  .menupanel { display: none; }
  body.menuopen .menupanel { display: grid; gap: 8px; position: absolute; top: 100%; left: 0; right: 0; z-index: 30; padding: 10px 0 14px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 14px 24px rgba(0, 0, 0, 0.18); }
  .tabs, .modes, #settingsBtn { display: none; }
  body.menuopen .tabs { display: flex; flex-direction: column; overflow: visible; gap: 2px; }
  body.menuopen .tab { text-align: left; padding: 12px 14px; font-size: 16px; min-height: 44px; }
  body.menuopen .modes { display: block; }
  body.menuopen .modeselect { width: 100%; min-height: 44px; font-size: 16px; }
  body.menuopen #settingsBtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 14px; font-size: 16px; color: var(--ink); }
  body.menuopen .menulabel { display: inline; }
}

/* Phone: a strip under the bar shows the current view and its neighbours, which is also where a sideways swipe goes. */
.pager { display: none; }
@media (max-width: 760px) {
  .pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; padding-top: 4px; font-size: 13px; }
  .pager[hidden] { display: none; }
  .pager .pg-side { border: 0; background: none; color: var(--muted); padding: 8px 4px; min-height: 36px; font-size: 13px; cursor: pointer; }
  .pager .pg-prev { text-align: left; } .pager .pg-next { text-align: right; }
  .pager .pg-now { display: grid; justify-items: center; gap: 3px; font-weight: 600; color: var(--ink); }
  .pager .dots { display: flex; gap: 5px; } .pager .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }

}
:root[data-theme="eink"] .pager .dots i { background: #fff; border: 1px solid #000; } :root[data-theme="eink"] .pager .dots i.on { background: #000; }

/* Phone: comfortable targets (44 px), 16 px fields (iOS zooms the page on anything smaller), room for the sticky-note buttons. */
@media (max-width: 760px) {
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea { font-size: 16px !important; }
  select, input[type="text"], input[type="date"], input[type="time"], input[type="number"] { min-height: 44px; }
  .btn, .btn.sm { min-height: 44px; }
  .btn.sm { padding: 8px 14px; font-size: 14px; }

  .rtbar button, .dialog .rtbar button, .dialog .rtbar .dot, .notes-panel .rtbar button { min-width: 44px; min-height: 44px; }
  .kcard .mvb, .coladd .mvb { width: 44px; height: 44px; font-size: 18px; }

  .coladd .mvb { flex: none; }

  .crit input[type="checkbox"] { width: 26px; height: 26px; margin: 0; }
  .crit li { padding: 8px 4px; align-items: center; }
  .rotq .arrows button { width: 44px; height: 44px; }

  .dialog.wide .rtbar { flex-wrap: nowrap; overflow-x: auto; }

}

main { padding-top: 16px; display: grid; gap: 16px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
/* Page layout: a 12-column flow when panels cannot be arranged (phone, or the grid library did not load). */
.lflow { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.lcell { grid-column: span var(--span, 12); min-width: 0; display: grid; gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .lflow { grid-template-columns: minmax(0, 1fr); } .lcell { grid-column: 1 / -1; } }
/* GridStack: the item insets by its margin; panels fill the content box. Outside edit mode nothing scrolls inside. */
.grid-stack { margin: -8px; }
.grid-stack-item-content { overflow: visible !important; display: grid; gap: 16px; align-content: start; }
body.editing-layout .grid-stack-item-content { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 10px; cursor: move; }
body.editing-layout .grid-stack-item-content > * { pointer-events: none; }
.grid-stack-placeholder > .placeholder-content { border: 2px dashed var(--accent) !important; border-radius: 10px; background: var(--accent-soft) !important; }
.editbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.iconbtn[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.label { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 13.5px; }
.skip { border: 0; font: inherit; position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 8px; }
main:focus { outline: none; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.age-fresh { color: var(--ok); } .age-soon { color: var(--warn); font-weight: 600; } .age-stale { color: var(--bad); font-weight: 600; }
.next { margin: 16px 0 10px; padding: 14px; border-radius: 8px; background: var(--accent-soft); font-size: 17px; font-weight: 500; }

.banner { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.empty { color: var(--muted); padding: 10px 0; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 1; cursor: default; background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }

select.auto { width: auto; max-width: 100%; }

.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(460px, 100%); max-height: 100%; overflow: auto; }
.dialog.wide { width: min(640px, 100%); }

}

.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }

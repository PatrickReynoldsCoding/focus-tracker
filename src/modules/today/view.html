<style>
.focus-name { font-size: clamp(24px, 5vw, 34px); line-height: 1.1; font-weight: 700; margin-bottom: 8px; }
.lastnote { color: var(--muted); padding: 2px 2px 0; }
.lastnote b { font-weight: 600; color: var(--ink); }
.timer { font-family: var(--font-mono); font-size: 30px; font-weight: 500; margin: 14px 0 0; font-variant-numeric: tabular-nums; }
.rot td:first-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; width: 38%; }
.rot tr.todayrow td { background: var(--accent-soft); font-weight: 600; color: var(--ink); }
</style>
<script>
(function () {
  var DAYS = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [7, 'Sun']];
  var timer = null;

  function activeProjects() { return (FT.store.projects || []).filter(function (p) { return p.status === 'active'; }); }

  function render() {
    var t = FT.store.today || {};
    var f = t.focusId ? FT.project(t.focusId) : null;
    if (!f) return '<div class="panel"><p class="empty">No active projects yet. Add one on the Projects tab to get a focus for the day.</p></div>';
    var n = FT.daysSince(f.last_touched), running = !!t.session;
    var lastLog = (FT.store.log || []).filter(function (l) { return l.project_id === f.id; })[0];
    var stale = activeProjects().filter(function (p) { return p.id !== f.id && FT.daysSince(p.last_touched) >= FT.config.staleDays; });
    var jobP = activeProjects().filter(function (p) { return p.category === 'job' && p.id !== f.id; })[0] || (f.category === 'job' ? f : null);
    var banner = stale.length ? '<div class="banner">Not touched for a while: ' + stale.map(function (p) {
      return '<b>' + FT.esc(p.name) + '</b> (' + FT.daysSince(p.last_touched) + ' days)';
    }).join(', ') + '.</div>' : '';
    var rot = DAYS.map(function (d) {
      var isToday = d[0] === t.weekday;
      return '<tr class="' + (isToday ? 'todayrow' : '') + '"><td>' + d[1] + (isToday ? ' (today)' : '') + '</td><td>' + FT.esc((t.labels || {})[d[0]] || '') + '</td></tr>';
    }).join('');
    return banner + '<div class="grid2"><div class="stack"><section class="panel">' +
      '<div class="label">Today\'s focus</div><h2 class="focus-name">' + FT.esc(f.name) + '</h2>' +
      '<div class="meta">' + FT.pill(f.category) + '<span class="' + FT.ageClass(n) + '">Last touched ' + FT.ageLabel(n) + '</span></div>' +
      '<div class="next"><small>Next action</small>' + FT.esc(f.next_action) + '</div>' +
      '<div class="lastnote">' + (lastLog ? '<b>Last time:</b> ' + FT.esc(lastLog.where_stopped) : 'No notes yet for this project.') + '</div>' +
      (running ? '<div class="timer" id="timer">00:00</div>' : '') +
      '<div class="actions">' +
      (running ? '<button class="btn primary" data-act="today.finish">Finish session</button>'
               : '<button class="btn primary" data-act="today.start">Start session</button><button class="btn" data-act="today.swap">Swap focus</button>') +
      '<button class="btn" data-act="today.open" data-id="' + FT.esc(f.id) + '">Open project</button></div></section></div>' +
      '<div class="stack"><section class="panel"><div class="label">Daily minimum: job search</div>' +
      (jobP ? '<p style="margin:0 0 4px"><b>' + FT.esc(jobP.name) + '</b></p><p style="margin:0 0 12px;color:var(--muted)">' + FT.esc(jobP.next_action) + '</p>'
            : '<p style="margin:0 0 12px;color:var(--muted)">No active job search project yet.</p>') +
      '<button class="btn ' + (t.jobDone ? 'done' : '') + '" data-act="today.job">' + (t.jobDone ? 'Done for today' : 'Mark 10 minutes done') + '</button></section>' +
      '<section class="panel"><div class="label">Weekly rotation</div><table class="rot"><tbody>' + rot + '</tbody></table></section></div></div>';
  }

  FT.module({ id: 'today', tab: { title: 'Today', order: 10, render: render } });

  FT.onRender(function () {
    clearInterval(timer);
    var s = FT.store.today && FT.store.today.session;
    if (!s || !document.getElementById('timer')) return;
    function tick() {
      var el = document.getElementById('timer'); if (!el) return;
      var sec = Math.max(0, Math.floor((Date.now() - new Date(s.start).getTime()) / 1000));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      el.textContent = (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }
    tick(); timer = setInterval(tick, 1000);
  });

  FT.action('today.open', function (el) { FT.go('project', { id: el.dataset.id }); });
  FT.action('today.start', function () { FT.rpc('today', 'start', { projectId: FT.store.today.focusId }).catch(function () {}); });
  FT.action('today.swap', function () { FT.rpc('today', 'swap').catch(function () {}); });
  FT.action('today.job', function () { FT.rpc('today', 'toggleJob').catch(function () {}); });
  FT.action('today.finish', function () {
    var t = FT.store.today, p = FT.project(t.session ? t.session.projectId : t.focusId);
    FT.dialog({
      title: 'Finish session',
      subtitle: p ? p.name : '',
      submit: 'Save and park it',
      fields: [
        { id: 'where', label: 'Where did you stop?', type: 'textarea', placeholder: 'One line is enough' },
        { id: 'next', label: 'What is the very next action?', value: p ? p.next_action : '' }
      ],
      onSubmit: function (v) {
        return FT.rpc('today', 'finish', { projectId: p && p.id, where: v.where, next: v.next }, { quiet: true });
      }
    });
  });
})();
</script>

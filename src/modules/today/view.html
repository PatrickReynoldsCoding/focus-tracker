<style>
.focus-name { font-size: clamp(24px, 5vw, 34px); line-height: 1.1; font-weight: 700; margin-bottom: 8px; }
.lastnote { color: var(--muted); padding: 2px 2px 0; }
.lastnote b { font-weight: 600; color: var(--ink); }
.timer { font-family: var(--font-mono); font-size: 30px; font-weight: 500; margin: 14px 0 0; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.timer .state { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); }
.pomo { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.pomo .left { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pomo.over { background: var(--warn-soft); border: 1px solid var(--warn); }
.pomo.paused { border: 1px dashed var(--muted); }
.rot td:first-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; width: 38%; }
.rot tr.todayrow td { background: var(--accent-soft); font-weight: 600; color: var(--ink); }
.rot .tag { font-family: var(--font-mono); font-size: 11px; color: var(--warn); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.rot td.away { color: var(--muted); font-style: italic; }
.reminders { display: grid; gap: 8px; }
.reminder { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.rotedit th, .rotedit td { padding: 6px 6px; border-bottom: 1px solid var(--line); }
.rotedit td:first-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.rotedit select { padding: 6px 8px; }
.away-panel h2 { font-size: 26px; margin-bottom: 6px; }
</style>
<script>
(function () {
  var DAYS = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [7, 'Sun']];
  var PHASE_LABEL = { work: 'Work', break: 'Break' };
  var PHASE_DONE_TEXT = { work: 'Work period done. Time for a break.', break: 'Break over. Back to work.' };
  var NEXT_PHASE_BUTTON = { work: 'Start break', break: 'Start work' };
  var ALERT_TITLE = { work: '⏰ Break time', break: '⏰ Back to work' };
  var REMIND_OPTIONS = [['0', 'No reminder'], ['1', 'Tomorrow'], ['3', 'In 3 days'], ['7', 'Next week']];
  var AWAY = 'away';
  var timer = null, alertedPhaseKey = null, audio = null;
  var showFocusOnAwayDay = null; // the date key on which "Show focus anyway" was clicked

  function activeProjects() { return (FT.store.projects || []).filter(function (p) { return p.status === 'active'; }); }

  /** Same rule as workedMs_ on the server: wall time minus pauses. */
  function workedMs(session, nowMs) {
    var openPauseMs = session.pausedAt ? nowMs - new Date(session.pausedAt).getTime() : 0;
    return Math.max(0, nowMs - new Date(session.start).getTime() - (session.pausedMs || 0) - openPauseMs);
  }

  /** Where the pomodoro is now: { phase, leftMs, over } or null when it is off. */
  function pomodoroNow(session, nowMs) {
    if (!session.pomodoro) return null;
    var phase = session.pomodoro.phase;
    var lengthMs = session.pomodoro.lengthMin * 60000;
    var leftMs = lengthMs - (workedMs(session, nowMs) - session.pomodoro.phaseStartMs);
    return { phase: phase, leftMs: leftMs, over: leftMs <= 0 };
  }

  function clock(ms) {
    var sec = Math.floor(Math.abs(ms) / 1000);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }

  function pomodoroHtml(t) {
    var p = pomodoroNow(t.session, Date.now());
    if (!p) return '';
    // A pause stops the countdown too, so say so instead of showing a clock that stands still.
    if (t.session.pausedAt && !p.over) {
      return '<div class="pomo paused" id="pomo" data-over="0" role="status"><span><b>' + PHASE_LABEL[p.phase] + '</b> ' + clock(p.leftMs) + ' left · <b>Paused</b></span>' +
        '<button class="btn sm primary" data-act="today.resume">Resume</button></div>';
    }
    var body = p.over
      ? '<span>' + PHASE_DONE_TEXT[p.phase] + '</span><button class="btn sm primary" data-act="today.nextPhase">' + NEXT_PHASE_BUTTON[p.phase] + '</button>'
      : '<span><b>' + PHASE_LABEL[p.phase] + '</b> <span class="left" id="pomo-left">' + clock(p.leftMs) + '</span> left</span>' +
        '<button class="btn sm" data-act="today.nextPhase">' + NEXT_PHASE_BUTTON[p.phase] + ' now</button>';
    return '<div class="pomo' + (p.over ? ' over' : '') + '" id="pomo" data-over="' + (p.over ? '1' : '0') + '" role="status">' + body + '</div>';
  }

  function sessionHtml(t) {
    var s = t.session, paused = !!s.pausedAt;
    return '<div class="timer"><span id="timer">' + clock(workedMs(s, Date.now())) + '</span>' + (paused ? '<span class="state">Paused</span>' : '') + '</div>' +
      pomodoroHtml(t) +
      '<div class="actions">' +
      '<button class="btn primary" data-act="today.finish">Finish session</button>' +
      (paused ? '<button class="btn" data-act="today.resume">Resume</button>' : '<button class="btn" data-act="today.pause">Pause</button>') +
      '<button class="btn" data-act="today.pomodoro" aria-pressed="' + (s.pomodoro ? 'true' : 'false') + '">' + (s.pomodoro ? 'Pomodoro off' : 'Pomodoro on') + '</button>' +
      '<button class="btn" data-act="today.pomodoroSettings" title="Pomodoro lengths" aria-label="Pomodoro lengths">' +
      t.pomodoroSettings.work + '/' + t.pomodoroSettings.break + '</button>';
  }

  function minimumHtml(categoryId, project, done) {
    var label = FT.category(categoryId).label;
    return '<section class="panel"><div class="label">Daily minimum: ' + FT.esc(label.toLowerCase()) + '</div>' +
      (project ? '<p style="margin:0 0 4px"><b>' + FT.esc(project.name) + '</b></p><p style="margin:0 0 12px;color:var(--muted)">' + FT.linkify(project.next_action) + '</p>'
               : '<p style="margin:0 0 12px;color:var(--muted)">No active ' + FT.esc(label.toLowerCase()) + ' project yet.</p>') +
      '<button class="btn ' + (done ? 'done' : '') + '" data-act="today.job">' + (done ? 'Done for today' : 'Mark 10 minutes done') + '</button></section>';
  }

  /** Panels other modules add to Today, such as lists: each slot returns [{ id, html, w }]. */
  function extraPanels() {
    return FT.slots('today.panels').reduce(function (all, s) { return all.concat(s.render(FT) || []); }, []);
  }

  function focusHtml(t, f) {
    var n = FT.daysSince(f.last_touched), running = !!t.session;
    var lastLog = (FT.store.log || []).filter(function (l) { return l.project_id === f.id; })[0];
    return '<section class="panel"><div class="label">Today\'s focus</div><h2 class="focus-name">' + FT.esc(f.name) + '</h2>' +
      '<div class="meta">' + FT.pill(f.category) + '<span class="' + FT.ageClass(n) + '">Last touched ' + FT.ageLabel(n) + '</span></div>' +
      '<div class="next"><small>Next action</small>' + FT.linkify(f.next_action) + '</div>' +
      '<div class="lastnote">' + (lastLog ? '<b>Last time:</b> ' + FT.linkify(lastLog.where_stopped) : 'No notes yet for this project.') + '</div>' +
      (running ? sessionHtml(t)
               : '<div class="actions"><button class="btn primary" data-act="today.start">Start session</button><button class="btn" data-act="today.swap">Swap focus</button>') +
      '<button class="btn" data-act="today.open" data-id="' + FT.esc(f.id) + '">Open project</button></div></section>';
  }

  function rotationHtml(t) {
    var week = t.week || {};
    var rows = DAYS.map(function (d) {
      var day = d[0], isToday = day === t.weekday, changed = Object.prototype.hasOwnProperty.call(week, day);
      var plan = changed ? week[day] : (t.usual || {})[day];
      return '<tr class="' + (isToday ? 'todayrow' : '') + '"><td>' + d[1] + (isToday ? ' (today)' : '') + '</td>' +
        '<td class="' + (plan === AWAY ? 'away' : '') + '">' + FT.esc((t.labels || {})[day] || '') + (changed ? '<span class="tag">this week</span>' : '') + '</td></tr>';
    }).join('');
    return '<section class="panel"><div class="tophead"><div class="label">Weekly rotation</div>' +
      '<button class="btn sm" data-act="today.rotation">Edit</button></div><table class="rot"><tbody>' + rows + '</tbody></table></section>';
  }

  function remindersHtml(t) {
    var due = (t.reminders || []).filter(function (r) { return FT.project(r.project_id); });
    if (!due.length) return '';
    return '<div class="reminders">' + due.map(function (r) {
      var p = FT.project(r.project_id), id = FT.esc(r.id);
      return '<div class="banner reminder" role="status"><span><b>Reminder:</b> ' + FT.esc(p.name) + ' (you skipped it on ' + FT.fmtDate(r.created) + ')</span>' +
        '<span class="actions" style="margin:0">' + (t.session ? '' : '<button class="btn sm" data-act="today.focusReminder" data-id="' + id + '">Make it today\'s focus</button>') +
        '<button class="btn sm" data-act="today.dismissReminder" data-id="' + id + '">Dismiss</button></span></div>';
    }).join('') + '</div>';
  }

  function awayHtml(t) {
    return '<section class="panel away-panel"><div class="label">Today</div><h2>Away today</h2>' +
      '<p style="margin:0;color:var(--muted)">You marked ' + DAYS[t.weekday - 1][1] + ' as a day off in the rotation. Enjoy it.</p>' +
      '<div class="actions"><button class="btn" data-act="today.showAnyway">Show my focus anyway</button></div></section>';
  }

  function staleBanner(f) {
    var stale = activeProjects().filter(function (p) { return p.id !== f.id && FT.daysSince(p.last_touched) >= FT.config.staleDays; });
    return stale.length ? '<div class="banner">Not touched for a while: ' + stale.map(function (p) {
      return '<b>' + FT.esc(p.name) + '</b> (' + FT.daysSince(p.last_touched) + ' days)';
    }).join(', ') + '.</div>' : '';
  }

  function render() {
    var t = FT.store.today || {};
    var f = t.focusId ? FT.project(t.focusId) : null;
    var minimum = t.dailyMinimum;
    var minimumProject = f && minimum ? (activeProjects().filter(function (p) { return p.category === minimum && p.id !== f.id; })[0] || (f.category === minimum ? f : null)) : null;
    var resting = t.away && !t.session && showFocusOnAwayDay !== t.day;
    var focus = resting ? awayHtml(t)
      : f ? focusHtml(t, f)
      : '<section class="panel"><p class="empty">No active projects yet. Add one on the Projects tab to get a focus for the day.</p></section>';
    return remindersHtml(t) + (f && !resting ? staleBanner(f) : '') + FT.layout('today', [
      { id: 'focus', title: 'Today\'s focus', html: focus, w: 7 },
      { id: 'minimum', title: 'Daily minimum', html: f && minimum ? minimumHtml(minimum, minimumProject, t.jobDone) : '', w: 5 },
      { id: 'rotation', title: 'Weekly rotation', html: f ? rotationHtml(t) : '', w: 5 }
    ].concat(extraPanels()));
  }

  // ---------- alerts ----------
  // Browsers often block notifications inside Apps Script pages, so a finished period is announced with a sound and the tab title.

  /** Browsers only allow sound after a click, so the audio context is made during one. */
  function unlockAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }

  function chime() {
    if (!audio) return;
    try {
      if (audio.resume) audio.resume();
      [0, 0.25, 0.5].forEach(function (offset) {
        var osc = audio.createOscillator(), gain = audio.createGain(), at = audio.currentTime + offset;
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, at);
        gain.gain.exponentialRampToValueAtTime(0.001, at + 0.2);
        osc.connect(gain); gain.connect(audio.destination);
        osc.start(at); osc.stop(at + 0.2);
      });
    } catch (e) {}
  }

  function baseTitle() { return FT.config.appName || 'Focus Tracker'; }

  /** While a period is over, the tab title blinks between the alert and the app name. */
  function showAlertTitle(p) {
    var alertText = ALERT_TITLE[p.phase] + ' · ' + baseTitle();
    document.title = document.title === alertText ? baseTitle() : alertText;
  }

  function alertOnce(session, p) {
    var key = p.phase + ':' + session.pomodoro.phaseStartMs;
    if (alertedPhaseKey === key) return;
    alertedPhaseKey = key;
    chime();
  }

  // ---------- ticking clock ----------
  // Ticks on every page while a session runs, so a finished period is announced even from a project page.
  function tick() {
    var t = FT.store.today, s = t && t.session;
    if (!s) { document.title = baseTitle(); return; }
    var nowMs = Date.now();
    var timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = clock(workedMs(s, nowMs));
    var p = pomodoroNow(s, nowMs);
    if (!p) { document.title = baseTitle(); return; }
    var pomoEl = document.getElementById('pomo');
    if (pomoEl && (pomoEl.dataset.over === '1') !== p.over) { FT.render(); return; }
    if (!p.over) {
      var leftEl = document.getElementById('pomo-left');
      if (leftEl) leftEl.textContent = clock(p.leftMs);
      document.title = baseTitle();
      return;
    }
    alertOnce(s, p);
    showAlertTitle(p);
  }

  FT.module({ id: 'today', tab: { title: 'Today', order: 10, render: render } });

  FT.onRender(function () {
    clearInterval(timer);
    tick();
    if (FT.store.today && FT.store.today.session) timer = setInterval(tick, 1000);
  });

  // ---------- actions ----------
  function call(fn, args) { unlockAudio(); FT.rpc('today', fn, args).catch(function () {}); }

  FT.action('today.open', function (el) { FT.go('project', { id: el.dataset.id }); });
  FT.action('today.start', function () { call('start', { projectId: FT.store.today.focusId }); });
  FT.action('today.showAnyway', function () { showFocusOnAwayDay = FT.store.today.day; FT.render(); });
  FT.action('today.focusReminder', function (el) { call('focusReminder', { id: el.dataset.id }); });
  FT.action('today.dismissReminder', function (el) { call('dismissReminder', { id: el.dataset.id }); });

  /** Pick the project to switch to (most neglected first, as Today ranks them) and maybe a reminder about this one. */
  FT.action('today.swap', function () {
    var t = FT.store.today, current = FT.project(t.focusId);
    var options = (t.ranked || []).filter(function (id) { return id !== t.focusId; }).map(FT.project).filter(Boolean).map(function (p) {
      return { value: p.id, label: p.name + ' (' + FT.category(p.category).label + ', ' + FT.ageLabel(FT.daysSince(p.last_touched)) + ')' };
    });
    if (!options.length) { FT.toast('There is no other active project to switch to.'); return; }
    FT.dialog({
      title: 'Swap focus',
      subtitle: current ? 'Skipping ' + current.name + ' for today. A skip never counts as work, so it will come back.' : '',
      submit: 'Swap',
      fields: [
        { id: 'to', label: 'Switch to', type: 'select', options: options, value: options[0].value },
        { id: 'remind', label: current ? 'Remind me about ' + current.name : 'Reminder', type: 'select', value: '0',
          options: REMIND_OPTIONS.map(function (o) { return { value: o[0], label: o[1] }; }) }
      ],
      onSubmit: function (v) { unlockAudio(); return FT.rpc('today', 'swap', { toId: v.to, remindDays: Number(v.remind) }, { quiet: true }); }
    });
  });

  // ---------- rotation editor ----------
  function planOptions(selected, firstLabel, firstValue) {
    var options = [[firstValue, firstLabel]];
    if (firstValue !== '') options.push(['', 'Any category']);
    options = options.concat(FT.categories().map(function (c) { return [c.id, c.label]; })).concat([[AWAY, 'Away (day off)']]);
    return options.map(function (o) {
      return '<option value="' + FT.esc(o[0]) + '"' + (o[0] === selected ? ' selected' : '') + '>' + FT.esc(o[1]) + '</option>';
    }).join('');
  }

  function rotationTableHtml(t) {
    var week = t.week || {};
    return '<table class="rotedit"><thead><tr><th>Day</th><th>Usually</th><th>This week</th></tr></thead><tbody>' + DAYS.map(function (d) {
      var day = d[0], usual = (t.usual || {})[day], changed = Object.prototype.hasOwnProperty.call(week, day);
      return '<tr><td>' + d[1] + '</td>' +
        '<td><select id="rot-usual-' + day + '" aria-label="' + d[1] + ' usually">' + planOptions(usual === null ? '' : usual, 'Any category', '') + '</select></td>' +
        '<td><select id="rot-week-' + day + '" aria-label="' + d[1] + ' this week">' + planOptions(changed ? (week[day] === null ? '' : week[day]) : 'same', 'Same as usual', 'same') + '</select></td></tr>';
    }).join('') + '</tbody></table>';
  }

  FT.action('today.rotation', function () {
    var t = FT.store.today;
    FT.dialog({
      title: 'Weekly rotation',
      subtitle: 'The lead category gets a head start each day. "This week" changes end on Sunday night.',
      wide: true,
      body: rotationTableHtml(t),
      fields: [{ id: 'minimum', label: 'Daily minimum panel', type: 'select', value: t.dailyMinimum || '',
        options: [{ value: '', label: 'None' }].concat(FT.categories().map(function (c) { return { value: c.id, label: c.label }; })) }],
      onSubmit: function (v) {
        var usual = {}, week = {};
        DAYS.forEach(function (d) {
          usual[d[0]] = document.getElementById('rot-usual-' + d[0]).value;
          var thisWeek = document.getElementById('rot-week-' + d[0]).value;
          if (thisWeek !== 'same') week[d[0]] = thisWeek;
        });
        return FT.rpc('today', 'saveRotation', { usual: usual, week: week, dailyMinimum: v.minimum }, { quiet: true });
      }
    });
  });
  FT.action('today.job', function () { call('toggleJob'); });
  FT.action('today.pause', function () { call('pause'); });
  FT.action('today.resume', function () { call('resume'); });
  FT.action('today.pomodoro', function () { call('pomodoro', { on: !FT.store.today.session.pomodoro }); });
  FT.action('today.nextPhase', function () { call('nextPhase'); });
  FT.action('today.pomodoroSettings', function () {
    var settings = FT.store.today.pomodoroSettings;
    FT.dialog({
      title: 'Pomodoro lengths',
      submit: 'Save',
      fields: [
        { id: 'work', label: 'Work (minutes)', value: String(settings.work) },
        { id: 'break', label: 'Break (minutes)', value: String(settings.break) }
      ],
      hint: 'A new length applies from the next period you start.',
      onSubmit: function (v) { return FT.rpc('today', 'pomodoroSettings', { work: v.work, break: v.break }, { quiet: true }); }
    });
  });
  FT.action('today.finish', function () {
    var t = FT.store.today, p = FT.project(t.session ? t.session.projectId : t.focusId);
    FT.dialog({
      title: 'Finish session',
      subtitle: p ? p.name : '',
      submit: 'Save and park it',
      fields: [
        { id: 'where', label: 'Where did you stop?', type: 'textarea', placeholder: 'One line is enough' },
        { id: 'next', label: 'What is the very next action?', value: p ? p.next_action : '' }
      ],
      onSubmit: function (v) {
        return FT.rpc('today', 'finish', { projectId: p && p.id, where: v.where, next: v.next }, { quiet: true });
      }
    });
  });
})();
</script>

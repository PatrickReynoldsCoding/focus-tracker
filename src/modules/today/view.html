<script>
(function () {
  var DAYS = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [7, 'Sun']];
  var PHASE_LABEL = { work: 'Work', break: 'Break' };
  var PHASE_DONE_TEXT = { work: 'Work period done. Time for a break.', break: 'Break over. Back to work.' };
  var NEXT_PHASE_BUTTON = { work: 'Start break', break: 'Start work' };
  var ALERT_TITLE = { work: '⏰ Break time', break: '⏰ Back to work' };
  var REMIND_OPTIONS = [['0', 'No reminder'], ['1', 'Tomorrow'], ['3', 'In 3 days'], ['7', 'Next week']];
  var AWAY = 'away';
  var LENGTH_CHOICES_MIN = [25, 50, 90];
  var DEFAULT_LENGTH_MIN = 25;
  var MAX_LENGTH_MIN = 600;
  var NO_LIMIT = 'none', CUSTOM_LENGTH = 'custom';
  var KEEP_GOING_CHOICES_MIN = [10, 25];
  var PLAN_ALERT_TITLE = '⏰ Time is up';
  // Today settings' Quick add on a phone: a pill in one tap, offered only when its panels exist. "Plan my week" is a
  // button in the Weekly rotation panel, not a panel of its own, so Week holds the rotation and Not touched.
  var PILL_TEMPLATES = [
    { name: 'Routine', icon: '☀️', panels: ['habits', 'todos'] },
    { name: 'Shopping', icon: '🛒', panels: [{ kind: 'list', like: 'shop|grocer' }, 'todos'] },
    { name: 'Thinking', icon: '📝', panels: ['notes', { kind: 'list' }] },
    { name: 'Week', icon: '🎯', panels: ['rotation', 'stale'] }
  ];
  var timer = null, alertedKey = null, audio = null, audioRequested = false;
  var chosenLengthMin; // the length picked in the Start session box; until one is picked, the server's remembered one
  var showFocusOnAwayDay = null; // the date key on which "Show focus anyway" was clicked

  function activeProjects() { return (FT.store.projects || []).filter(function (p) { return p.status === 'active'; }); }
  /** Whether project p shows its next action (Settings and its Project settings; the projects module decides). */
  function nextActionShown(p) { return !!FT.nextActionShown && FT.nextActionShown(p); }

  /** Same rule as workedMs_ on the server: wall time minus pauses. */
  function workedMs(session, nowMs) {
    var openPauseMs = session.pausedAt ? nowMs - new Date(session.pausedAt).getTime() : 0;
    return Math.max(0, nowMs - new Date(session.start).getTime() - (session.pausedMs || 0) - openPauseMs);
  }

  /** Where the pomodoro is now: { phase, leftMs, over } or null when it is off. */
  function pomodoroNow(session, nowMs) {
    if (!session.pomodoro) return null;
    var phase = session.pomodoro.phase;
    var lengthMs = session.pomodoro.lengthMin * 60000;
    var leftMs = lengthMs - (workedMs(session, nowMs) - session.pomodoro.phaseStartMs);
    return { phase: phase, leftMs: leftMs, over: leftMs <= 0 };
  }

  /** Where the planned length is now: { leftMs, over } or null when the session has no limit (or was saved before lengths existed). */
  function planNow(session, nowMs) {
    if (!session.plannedMin) return null;
    var leftMs = session.plannedMin * 60000 - workedMs(session, nowMs);
    return { leftMs: leftMs, over: leftMs <= 0 };
  }

  /** The length the next session starts with: minutes, or null for no limit. */
  function chosenLength(t) {
    if (chosenLengthMin !== undefined) return chosenLengthMin;
    return t.focusLength === undefined ? DEFAULT_LENGTH_MIN : t.focusLength;
  }

  function lengthLabel(minutes) { return minutes ? minutes + ' min' : 'No limit'; }

  /** The length picker beside Start session: 25, 50 and 90 minutes, a custom length once picked, No limit and Custom…. */
  function lengthPickerHtml(t) {
    var chosen = chosenLength(t);
    var minutes = LENGTH_CHOICES_MIN.concat(chosen && LENGTH_CHOICES_MIN.indexOf(chosen) === -1 ? [chosen] : []).sort(function (a, b) { return a - b; });
    var options = minutes.map(function (m) { return [String(m), lengthLabel(m)]; }).concat([[NO_LIMIT, 'No limit'], [CUSTOM_LENGTH, 'Custom…']]);
    var selected = chosen ? String(chosen) : NO_LIMIT;
    return '<label class="lengthpick">for <select class="auto" data-change="today.length" aria-label="Session length">' + options.map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === selected ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select></label>';
  }

  function clock(ms) {
    var sec = Math.floor(Math.abs(ms) / 1000);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }

  function pomodoroHtml(t) {
    var p = pomodoroNow(t.session, Date.now());
    if (!p) return '';
    // A pause stops the countdown too, so say so instead of showing a clock that stands still.
    if (t.session.pausedAt && !p.over) {
      return '<div class="pomo paused" id="pomo" data-over="0" role="status"><span><b>' + PHASE_LABEL[p.phase] + '</b> ' + clock(p.leftMs) + ' left · <b>Paused</b></span>' +
        '<button class="btn sm primary" data-act="today.resume">Resume</button></div>';
    }
    var body = p.over
      ? '<span>' + PHASE_DONE_TEXT[p.phase] + '</span><button class="btn sm primary" data-act="today.nextPhase">' + NEXT_PHASE_BUTTON[p.phase] + '</button>'
      : '<span><b>' + PHASE_LABEL[p.phase] + '</b> <span class="left" id="pomo-left">' + clock(p.leftMs) + '</span> left</span>' +
        '<button class="btn sm" data-act="today.nextPhase">' + NEXT_PHASE_BUTTON[p.phase] + ' now</button>';
    return '<div class="pomo' + (p.over ? ' over' : '') + '" id="pomo" data-over="' + (p.over ? '1' : '0') + '" role="status">' + body + '</div>';
  }

  /** The planned length: time left, or once it is up, Finish or Keep going (a few more minutes, or no limit). */
  function planHtml(t) {
    var s = t.session, plan = planNow(s, Date.now());
    if (!plan) return '';
    if (plan.over) {
      return '<div class="pomo over" id="plan" data-over="1" role="status"><span><b>Time is up.</b> You planned ' + s.plannedMin + ' minutes.</span>' +
        '<span class="keepgoing"><button class="btn sm primary" data-act="today.finish">Finish</button><span>Keep going:</span>' +
        KEEP_GOING_CHOICES_MIN.map(function (m) { return '<button class="btn sm" data-act="today.keepGoing" data-min="' + m + '">+' + m + ' min</button>'; }).join('') +
        '<button class="btn sm" data-act="today.keepGoing" data-min="">No limit</button></span></div>';
    }
    return '<div class="pomo" id="plan" data-over="0" role="status"><span><b>Planned ' + s.plannedMin + ' min</b> <span class="left" id="plan-left">' + clock(plan.leftMs) + '</span> left' +
      (s.pausedAt ? ' · <b>Paused</b>' : '') + '</span></div>';
  }

  function sessionHtml(t) {
    var s = t.session, paused = !!s.pausedAt;
    return '<div class="timer" role="timer" aria-label="Session time"><span id="timer">' + clock(workedMs(s, Date.now())) + '</span>' + (paused ? '<span class="state">Paused</span>' : '') + '</div>' +
      planHtml(t) + pomodoroHtml(t) +
      '<div class="actions">' +
      '<button class="btn primary" data-act="today.finish">Finish session</button>' +
      (paused ? '<button class="btn" data-act="today.resume">Resume</button>' : '<button class="btn" data-act="today.pause">Pause</button>') +
      '<button class="btn" data-act="today.pomodoro">' + (s.pomodoro ? 'Pomodoro: on' : 'Pomodoro: off') + '</button>' +
      '<button class="btn" data-act="today.pomodoroSettings" title="Change the pomodoro lengths" aria-label="Pomodoro lengths: ' + t.pomodoroSettings.work + ' minutes work, ' + t.pomodoroSettings.break + ' minutes break. Change">' +
      t.pomodoroSettings.work + ' / ' + t.pomodoroSettings.break + ' min</button>' +
      (cornerTimerHidden() ? '<button class="btn" data-act="today.timerShow" title="Show the small timer in a corner of every page">Show timer</button>' : '');
  }

  /** Panels other modules add to Today, such as the small tasks and lists: each slot returns [{ id, html, w }]. */
  function extraPanels() {
    return FT.slots('today.panels').reduce(function (all, s) { return all.concat(s.render(FT) || []); }, []);
  }

  /** Panels only a phone's pill shows: the lists and whiteboards that are not on Today (slot today.pillPanels). */
  function pillOnlyPanels() {
    return FT.slots('today.pillPanels').reduce(function (all, s) { return all.concat(s.render(FT) || []); }, []);
  }

  function focusHtml(t, f) {
    var n = FT.daysSince(f.last_touched), running = !!t.session;
    var lastLog = (FT.store.log || []).filter(function (l) { return l.project_id === f.id; })[0];
    return '<section class="panel"><div class="label">Today\'s focus</div><h2 class="focus-name">' + FT.esc(f.name) + '</h2>' +
      '<div class="meta">' + FT.pill(f.category) + '<span class="' + FT.ageClass(n) + '">Last touched ' + FT.ageLabel(n) + '</span></div>' +
      (nextActionShown(f) ? '<div class="next"><small>Next action</small>' + FT.linkify(f.next_action) + '</div>' : '') +
      '<div class="lastnote">' + (lastLog ? '<b>Last time:</b> ' + FT.linkify(lastLog.where_stopped) : 'No notes yet for this project.') + '</div>' +
      (running ? sessionHtml(t)
               : '<div class="actions"><button class="btn primary" data-act="today.start">Start session</button>' + lengthPickerHtml(t) + '<button class="btn" data-act="today.swap">Swap focus</button>') +
      '<button class="btn" data-act="today.open" data-id="' + FT.esc(f.id) + '">Open project</button></div></section>';
  }

  function rotationHtml(t) {
    var week = t.week || {};
    var rows = DAYS.map(function (d) {
      var day = d[0], isToday = day === t.weekday, changed = Object.prototype.hasOwnProperty.call(week, day);
      var plan = changed ? week[day] : (t.usual || {})[day];
      return '<tr class="' + (isToday ? 'todayrow' : '') + '"><td>' + d[1] + (isToday ? ' (today)' : '') + '</td>' +
        '<td class="' + (plan === AWAY ? 'away' : '') + '">' + FT.esc((t.labels || {})[day] || '') + (changed ? '<span class="tag">this week</span>' : '') + '</td></tr>';
    }).join('');
    var plan = FT.slots('today.planWeek').length ? '<button class="btn sm" data-act="habits.planWeek">Plan my week</button>' : '';
    return '<section class="panel"><div class="tophead"><div class="label">Weekly rotation</div>' +
      '<span class="actions" style="margin:0">' + plan + '<button class="btn sm" data-act="today.rotation">Edit</button></span></div><table class="rot"><tbody>' + rows + '</tbody></table></section>';
  }

  function remindersHtml(t) {
    var due = (t.reminders || []).filter(function (r) { return FT.project(r.project_id); });
    if (!due.length) return '';
    return '<div class="reminders">' + due.map(function (r) {
      var p = FT.project(r.project_id), id = FT.esc(r.id);
      return '<div class="banner reminder" role="status"><span><b>Reminder:</b> ' + FT.esc(p.name) + ' (you skipped it on ' + FT.fmtDate(r.created) + ')</span>' +
        '<span class="actions" style="margin:0">' + (t.session ? '' : '<button class="btn sm" data-act="today.focusReminder" data-id="' + id + '">Make it today\'s focus</button>') +
        '<button class="btn sm" data-act="today.dismissReminder" data-id="' + id + '">Dismiss</button></span></div>';
    }).join('') + '</div>';
  }

  function awayHtml(t) {
    return '<section class="panel away-panel"><div class="label">Today</div><h2>Away today</h2>' +
      '<p style="margin:0;color:var(--muted)">You marked ' + DAYS[t.weekday - 1][1] + ' as a day off in the rotation. Enjoy it.</p>' +
      '<div class="actions"><button class="btn" data-act="today.showAnyway">Show my focus anyway</button></div></section>';
  }

  function staleProjects(f) {
    return activeProjects().filter(function (p) { return p.id !== f.id && FT.daysSince(p.last_touched) >= FT.config.staleDays; });
  }

  function staleBanner(stale) {
    return stale.length ? '<div class="banner stalebanner"><b data-panel-title>Not touched for a while:</b> ' + stale.map(function (p) {
      return '<b>' + FT.esc(p.name) + '</b> (' + FT.daysSince(p.last_touched) + ' days)';
    }).join(', ') + '.<span class="popspot"></span></div>' : '';
  }

  /**
   * The phone's pinned focus: the timer, the project, its next action, the planned time left (or Finish and Keep going once
   * it is up) and the pomodoro, then Start with its length, or Finish with Pause or Resume.
   */
  function focusCompactHtml(t, f) {
    var s = t.session, paused = !!(s && s.pausedAt);
    var timer = s ? '<span class="fc-timer" id="timer" role="timer" aria-label="Session time">' + clock(workedMs(s, Date.now())) + '</span>' + (paused ? '<span class="state">Paused</span>' : '') : '';
    var buttons = s
      ? '<button class="btn primary" data-act="today.finish">Finish session</button>' + (paused ? '<button class="btn" data-act="today.resume">Resume</button>' : '<button class="btn" data-act="today.pause">Pause</button>')
      : '<button class="btn primary" data-act="today.start">Start session</button>' + lengthPickerHtml(t);
    return '<section class="panel fcompact"><div class="fc-top"><span class="label">Today\'s focus</span>' + timer + '</div>' +
      '<h2 class="fc-name">' + FT.esc(f.name) + '</h2>' +
      (nextActionShown(f) ? '<div class="fc-next"><small>Next</small> ' + FT.linkify(f.next_action) + '</div>' : '') +
      (s ? planHtml(t) + pomodoroHtml(t) : '') +
      '<div class="actions">' + buttons + '</div></section>';
  }

  function render() {
    var t = FT.store.today || {};
    var f = t.focusId ? FT.project(t.focusId) : null;
    var resting = t.away && !t.session && showFocusOnAwayDay !== t.day;
    var working = f && !resting, stale = working ? staleProjects(f) : [];
    var focus = resting ? awayHtml(t)
      : f ? focusHtml(t, f)
      : '<section class="panel"><p class="empty">No active projects yet. Add one to get a focus for the day.</p><button class="btn primary" data-act="core.tab" data-view="projects">Go to Projects</button></section>';
    // A panel marked beside: true (the small tasks) sits next to the focus by default; the rest go after the rotation.
    var extra = extraPanels();
    var reminders = FT.pills && FT.pills.settingsOpen('today') ? '' : remindersHtml(t);
    return reminders + FT.layout('today', [
      { id: 'stale', title: 'Not touched for a while', short: 'Not touched', count: stale.length, description: 'Active projects you have not worked on for a few days. Shows only when there are some.',
        html: staleBanner(stale), w: 12, top: true },
      { id: 'focus', title: 'Today\'s focus', description: 'The project picked for today, its next action and the session timer.', html: focus, compact: working ? focusCompactHtml(t, f) : '', w: 7 }]
      .concat(extra.filter(function (p) { return p.beside; }))
      .concat([{ id: 'rotation', title: 'Weekly rotation', short: 'Rotation', description: 'Which category leads on each day of the week.', html: f ? rotationHtml(t) : '', w: extra.some(function (p) { return p.beside; }) ? 7 : 5 }])
      .concat(extra.filter(function (p) { return !p.beside; })), { pager: { pinned: 'focus', offPage: pillOnlyPanels, templates: PILL_TEMPLATES } });
  }

  // ---------- alerts ----------
  // A finished period is announced with a sound and the tab title. The sounds are made with Web Audio, so there are no files to load.
  // Browser notifications do not work here: Apps Script pages sit in a Google iframe, where Chrome denies the permission.

  var CHICKEN_CLUCKS = [[0, 0.09, 520, 320], [0.15, 0.09, 520, 320], [0.3, 0.09, 520, 320], [0.55, 0.4, 900, 380]]; // [offset s, length s, from Hz, to Hz]
  var WHISTLE_NOTES_HZ = [440, 554, 659];
  var WHISTLE_SECONDS = 1.4;
  // Keyed by the period that just ended: work ending starts a break (chicken), a break ending starts work (steam whistle).
  var PERIOD_END_SOUND = { work: playChicken, break: playWhistle };
  var AUDIO_AFTER_CLICK_MS = 500;

  /** Browsers only allow sound after a click, so the audio context is made during one. Making it can block the page for
   *  200 ms or more, so a click only asks for it once the click has been drawn; a later click resumes it if it started suspended. */
  function unlockAudio() {
    if (audio) { if (audio.state === 'suspended' && audio.resume) audio.resume(); return; }
    if (!audioRequested) { audioRequested = true; setTimeout(makeAudioNow, AUDIO_AFTER_CLICK_MS); }
  }

  /** For a sound that plays straight away, such as the test buttons. */
  function makeAudioNow() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; audioRequested = false; }
  }

  /** Fades a gain node in fast, holds it, then fades it out so the sound has no clicks. */
  function shapeVolume(gain, startAt, peak, holdSeconds, fadeOutSeconds) {
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.linearRampToValueAtTime(peak, startAt + 0.02);
    gain.gain.setValueAtTime(peak, startAt + holdSeconds);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + holdSeconds + fadeOutSeconds);
  }

  /** One cluck: a nasal sawtooth that glides down in pitch. */
  function playCluck(startAt, lengthSeconds, fromHz, toHz) {
    var osc = audio.createOscillator(), filter = audio.createBiquadFilter(), gain = audio.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(fromHz, startAt);
    osc.frequency.exponentialRampToValueAtTime(toHz, startAt + lengthSeconds);
    filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 2;
    shapeVolume(gain, startAt, 0.35, lengthSeconds * 0.4, lengthSeconds * 0.6);
    osc.connect(filter); filter.connect(gain); gain.connect(audio.destination);
    osc.start(startAt); osc.stop(startAt + lengthSeconds + 0.05);
  }

  function playChicken(startAt) {
    CHICKEN_CLUCKS.forEach(function (cluck) { playCluck(startAt + cluck[0], cluck[1], cluck[2], cluck[3]); });
  }

  /** A steam whistle: a few triangle tones that start a little flat, plus a breath of noise. */
  function playWhistle(startAt) {
    var master = audio.createGain();
    shapeVolume(master, startAt, 0.14, WHISTLE_SECONDS - 0.4, 0.4);
    master.connect(audio.destination);
    WHISTLE_NOTES_HZ.forEach(function (hz) {
      var osc = audio.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(hz * 0.94, startAt);
      osc.frequency.exponentialRampToValueAtTime(hz, startAt + 0.15);
      osc.connect(master);
      osc.start(startAt); osc.stop(startAt + WHISTLE_SECONDS + 0.05);
    });
    var noiseBuffer = audio.createBuffer(1, Math.floor(audio.sampleRate * WHISTLE_SECONDS), audio.sampleRate);
    var samples = noiseBuffer.getChannelData(0);
    for (var i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    var noise = audio.createBufferSource(), noiseFilter = audio.createBiquadFilter(), noiseGain = audio.createGain();
    noise.buffer = noiseBuffer;
    noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 2500;
    noiseGain.gain.value = 0.25;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);
    noise.start(startAt);
  }

  /** Returns false when the sound could not play (no click yet), so the caller can try again. */
  function playSound(sound) {
    if (document.documentElement.dataset.theme === 'eink') return true; // e-ink: no sound
    if (!audio) return false;
    try {
      if (audio.resume) audio.resume();
      sound(audio.currentTime);
      return true;
    } catch (e) { return false; }
  }

  // Any click or key press on any tab unlocks the sound, not only the buttons on Today.
  ['pointerdown', 'keydown'].forEach(function (eventName) { document.addEventListener(eventName, unlockAudio, true); });

  function baseTitle() { return FT.config.appName || 'Focus Tracker'; }

  /** While a period or the planned time is over, the tab title blinks between the alert and the app name. */
  function blinkTitle(alertTitle) {
    var alertText = alertTitle + ' · ' + baseTitle();
    document.title = document.title === alertText ? baseTitle() : alertText;
  }

  /** Play the sound once for the end named by key (a pomodoro period, or the planned length). */
  function alertOnce(key, sound) {
    if (alertedKey !== key && playSound(sound)) alertedKey = key;
  }

  /** True when a box drawn as running is now over, or the other way round, so the page must be drawn again. */
  function overChanged(boxId, now) {
    var box = document.getElementById(boxId);
    return !!box && !!now && (box.dataset.over === '1') !== now.over;
  }

  function showText(elementId, text) {
    var el = document.getElementById(elementId);
    if (el) el.textContent = text;
  }

  // ---------- ticking clock ----------
  // Ticks on every page while a session runs, so a finished period or the planned time is announced even from a project page.
  // The planned time ending comes first: its sound is the chicken (work is over), and its title wins over a pomodoro's.
  function tick() {
    var t = FT.store.today, s = t && t.session;
    var nowMs = Date.now();
    showCornerTimer(s, nowMs);
    if (!s) { document.title = baseTitle(); return; }
    showText('timer', clock(workedMs(s, nowMs)));
    var plan = planNow(s, nowMs), p = pomodoroNow(s, nowMs);
    if (overChanged('plan', plan) || overChanged('pomo', p)) { FT.render(); return; }
    if (plan && !plan.over) showText('plan-left', clock(plan.leftMs));
    if (p && !p.over) showText('pomo-left', clock(p.leftMs));
    if (plan && plan.over) {
      alertOnce('plan:' + s.plannedMin, playChicken);
      blinkTitle(PLAN_ALERT_TITLE);
    } else if (p && p.over) {
      alertOnce(p.phase + ':' + s.pomodoro.phaseStartMs, PERIOD_END_SOUND[p.phase]);
      blinkTitle(ALERT_TITLE[p.phase]);
    } else {
      document.title = baseTitle();
    }
  }

  // ---------- corner timer ----------
  // A small timer in a corner of every page while a session runs. Drag it (mouse or finger) and it snaps to the nearest
  // corner; click it to open the focus project; ✕ hides it. Its corner and whether it is hidden are kept on this device.
  var TIMER_CORNER_KEY = 'ft.timer.corner', TIMER_HIDDEN_KEY = 'ft.timer.hidden';
  var CORNERS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
  var DEFAULT_CORNER = 'bottom-left'; // sticky notes have the bottom right
  var DRAG_START_PX = 6; // a smaller move is still a click
  var cornerTimer = null, cornerDrag = null, cornerJustDragged = false;

  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function lsRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

  function cornerTimerHidden() { return lsGet(TIMER_HIDDEN_KEY) === '1'; }
  function savedCorner() { var corner = lsGet(TIMER_CORNER_KEY); return CORNERS.indexOf(corner) !== -1 ? corner : DEFAULT_CORNER; }

  function setCornerTimerHidden(hidden) {
    if (hidden) lsSet(TIMER_HIDDEN_KEY, '1'); else lsRemove(TIMER_HIDDEN_KEY);
    FT.render();
  }

  /** Made once, outside the page (#app is redrawn), and kept up to date by tick(). */
  function cornerTimerElement() {
    if (cornerTimer) return cornerTimer;
    cornerTimer = document.createElement('div');
    cornerTimer.className = 'cornertimer';
    cornerTimer.id = 'cornerTimer';
    cornerTimer.hidden = true;
    cornerTimer.dataset.corner = savedCorner();
    cornerTimer.innerHTML = '<button type="button" class="ct-open" data-act="today.timerOpen"><span class="ct-name"></span><span class="ct-clock"></span><span class="ct-sub"></span></button>' +
      '<button type="button" class="ct-hide" data-act="today.timerHide" aria-label="Hide the timer" title="Hide the timer (Show timer in the session panel or Settings brings it back)">✕</button>';
    cornerTimer.addEventListener('pointerdown', startCornerDrag);
    document.body.appendChild(cornerTimer);
    return cornerTimer;
  }

  /** What the corner timer says: the planned time left, else the pomodoro, else the time worked; the line under it adds the rest. */
  function cornerTimerText(s, nowMs) {
    var plan = planNow(s, nowMs), p = pomodoroNow(s, nowMs);
    var pomodoroText = p ? PHASE_LABEL[p.phase] + ' ' + (p.over ? 'over' : clock(p.leftMs)) : '';
    var main = plan ? (plan.over ? 'Time is up' : clock(plan.leftMs))
      : p ? (p.over ? PHASE_LABEL[p.phase] + ' over' : clock(p.leftMs))
      : clock(workedMs(s, nowMs));
    var sub = plan ? (plan.over ? 'of ' : 'left of ') + s.plannedMin + ' min' + (p ? ' · ' + pomodoroText : '')
      : p ? PHASE_LABEL[p.phase] + ' left'
      : 'worked';
    return { main: main, sub: (s.pausedAt ? 'Paused · ' : '') + sub, over: plan ? plan.over : !!(p && p.over) };
  }

  function showCornerTimer(s, nowMs) {
    var show = FT.ready && !!s && !cornerTimerHidden();
    if (!show && !cornerTimer) return;
    var box = cornerTimerElement();
    box.hidden = !show;
    if (!show) return;
    var project = FT.project(s.projectId), name = project ? project.name : 'Session';
    var text = cornerTimerText(s, nowMs);
    box.querySelector('.ct-name').textContent = name;
    box.querySelector('.ct-clock').textContent = text.main;
    box.querySelector('.ct-sub').textContent = text.sub;
    box.querySelector('.ct-open').setAttribute('aria-label', 'Session on ' + name + ': ' + text.main + ', ' + text.sub + '. Open the project');
    box.classList.toggle('over', text.over);
  }

  function startCornerDrag(e) {
    if (e.button > 0 || e.target.closest('.ct-hide')) return;
    var rect = cornerTimer.getBoundingClientRect();
    cornerDrag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top, moved: false };
    document.addEventListener('pointermove', moveCornerDrag);
    document.addEventListener('pointerup', endCornerDrag);
    document.addEventListener('pointercancel', endCornerDrag);
  }

  function keepInside(position, size, room) { return Math.max(0, Math.min(room - size, position)); }

  function moveCornerDrag(e) {
    if (!cornerDrag || e.pointerId !== cornerDrag.pointerId) return;
    var movedPx = Math.max(Math.abs(e.clientX - cornerDrag.startX), Math.abs(e.clientY - cornerDrag.startY));
    if (!cornerDrag.moved && movedPx < DRAG_START_PX) return;
    cornerDrag.moved = true;
    e.preventDefault();
    cornerTimer.classList.add('dragging');
    cornerTimer.style.left = keepInside(e.clientX - cornerDrag.offsetX, cornerTimer.offsetWidth, window.innerWidth) + 'px';
    cornerTimer.style.top = keepInside(e.clientY - cornerDrag.offsetY, cornerTimer.offsetHeight, window.innerHeight) + 'px';
    cornerTimer.style.right = 'auto';
    cornerTimer.style.bottom = 'auto';
  }

  /** The corner nearest to where the timer's middle was dropped. */
  function nearestCorner(rect) {
    var middleX = rect.left + rect.width / 2, middleY = rect.top + rect.height / 2;
    return (middleY < window.innerHeight / 2 ? 'top' : 'bottom') + '-' + (middleX < window.innerWidth / 2 ? 'left' : 'right');
  }

  function endCornerDrag(e) {
    if (!cornerDrag || e.pointerId !== cornerDrag.pointerId) return;
    var moved = cornerDrag.moved;
    cornerDrag = null;
    document.removeEventListener('pointermove', moveCornerDrag);
    document.removeEventListener('pointerup', endCornerDrag);
    document.removeEventListener('pointercancel', endCornerDrag);
    if (!moved) return;
    var corner = nearestCorner(cornerTimer.getBoundingClientRect());
    cornerTimer.classList.remove('dragging');
    ['left', 'top', 'right', 'bottom'].forEach(function (side) { cornerTimer.style[side] = ''; });
    cornerTimer.dataset.corner = corner;
    lsSet(TIMER_CORNER_KEY, corner);
    // The click that ends a drag must not open the project.
    cornerJustDragged = true;
    setTimeout(function () { cornerJustDragged = false; }, 0);
  }

  FT.action('today.timerOpen', function () {
    var s = FT.store.today && FT.store.today.session;
    if (cornerJustDragged || !s) return;
    FT.go('project', { id: s.projectId });
  });
  FT.action('today.timerHide', function () {
    setCornerTimerHidden(true);
    FT.toast('Timer hidden. Show timer in the session panel or Settings brings it back.');
  });
  FT.action('today.timerShow', function () { setCornerTimerHidden(false); });

  FT.settings.add({ id: 'timer', order: 25, html: function () {
    var hidden = cornerTimerHidden();
    return '<label>Corner timer during a session (this device)</label><div class="choice two" role="radiogroup" aria-label="Corner timer">' +
      [['show', 'Show', !hidden], ['hide', 'Hide', hidden]].map(function (o) {
        return '<label><input type="radio" name="dlg-cornertimer" value="' + o[0] + '"' + (o[2] ? ' checked' : '') + '>' + o[1] + '</label>';
      }).join('') + '</div>';
  }, onOpen: function (root) {
    Array.prototype.forEach.call(root.querySelectorAll('input[name="dlg-cornertimer"]'), function (radio) {
      radio.addEventListener('change', function () { setCornerTimerHidden(radio.value === 'hide'); });
    });
  } });

  /** The page to open on while a session runs: the focus project (shell.html asks when the app opens). */
  FT.sessionPage = function () {
    var s = FT.store.today && FT.store.today.session;
    return s ? { view: 'project', projectId: s.projectId } : null;
  };

  /**
   * The top of today's focus project page: the running session with its pomodoro, or a button to start one.
   * Other projects' pages show nothing here. The same ticking clock updates it.
   */
  function projectSessionHtml(p) {
    var t = FT.store.today || {};
    if (!t.focusId || t.focusId !== p.id) return '';
    if (!t.session) {
      return '<section class="panel focusbar"><span><span class="label" style="margin:0">Today\'s focus</span> This is today\'s focus project.</span>' +
        '<span class="actions" style="margin:0"><button class="btn primary" data-act="today.start">Start session</button>' + lengthPickerHtml(t) + '</span></section>';
    }
    return '<section class="panel"><div class="label">Session</div>' + sessionHtml(t) + '</div></section>';
  }

  FT.module({
    id: 'today',
    tab: { title: 'Today', order: 10, render: render },
    slots: { 'project.page': [{ id: 'session', title: 'Session', description: 'On today\'s focus project: the running session, or Start session.', order: -5, span: 'full', render: projectSessionHtml }] }
  });

  /**
   * Plan my week (habits module) changes the lead for one day of this week (week 0) or next week (1). plan: a category
   * id, 'away', '' for any, or 'usual'. Shown at once; this week's day also changes the rotation panel.
   */
  FT.today = {
    planLead: function (week, day, plan) {
      var t = FT.store.today, key = week === 0 ? 'week' : 'next';
      var changes = t[key] = t[key] || {}, had = Object.prototype.hasOwnProperty.call(changes, day), before = changes[day];
      var labelBefore = (t.labels || {})[day];
      callNow('planDay', { week: week === 0 ? t.weekKey : t.nextWeekKey, day: day, plan: plan }, function () {
        if (plan === 'usual') delete changes[day]; else changes[day] = plan === '' ? null : plan;
        if (week === 0 && t.labels) {
          var p = plan === 'usual' ? (t.usual || {})[day] : changes[day];
          t.labels[day] = p === AWAY ? 'Away' : p ? FT.category(p).label : 'Any category';
        }
        return function () { if (had) changes[day] = before; else delete changes[day]; if (t.labels) t.labels[day] = labelBefore; };
      });
    }
  };

  FT.onRender(function () {
    clearInterval(timer);
    tick();
    if (FT.store.today && FT.store.today.session) timer = setInterval(tick, 1000);
  });

  // ---------- actions ----------
  function call(fn, args) { unlockAudio(); FT.rpc('today', fn, args).catch(function () {}); }

  FT.action('today.open', function (el) { FT.go('project', { id: el.dataset.id }); });
  /** Run a session call and show its effect on screen at once (apply() changes the store and returns the way back). */
  function callNow(fn, args, apply) {
    unlockAudio();
    FT.optimistic(apply, function () { return FT.rpc('today', fn, args); }).catch(function () {});
  }

  FT.action('today.start', function () {
    var t = FT.store.today;
    if (t.session || !t.focusId) return;
    var plannedMin = chosenLength(t), lengthBefore = t.focusLength;
    callNow('start', { projectId: t.focusId, plannedMin: plannedMin }, function () {
      t.session = { projectId: t.focusId, start: new Date().toISOString(), pausedMs: 0, pausedAt: '', pomodoro: null, plannedMin: plannedMin };
      t.focusLength = plannedMin;
      return function () { t.session = null; t.focusLength = lengthBefore; };
    });
  });

  /** Custom… asks for the minutes. The box is drawn again first, so Cancel leaves the length as it was. */
  FT.on('change', 'today.length', function (el) {
    if (el.value !== CUSTOM_LENGTH) { chosenLengthMin = el.value === NO_LIMIT ? null : Number(el.value); FT.render(); return; }
    var current = chosenLength(FT.store.today);
    FT.render();
    FT.dialog({
      title: 'Session length',
      submit: 'Use this length',
      fields: [{ id: 'minutes', label: 'Minutes (1 to ' + MAX_LENGTH_MIN + ')', value: current ? String(current) : '' }],
      onSubmit: function (v) {
        var minutes = Number(v.minutes);
        if (!v.minutes || Math.floor(minutes) !== minutes || minutes < 1 || minutes > MAX_LENGTH_MIN) throw new Error('Type a whole number of minutes from 1 to ' + MAX_LENGTH_MIN + '.');
        chosenLengthMin = minutes;
        FT.render();
      }
    });
  });

  /** Same rule as keepGoing on the server: more minutes from now (or from the planned end if later), or no limit. */
  FT.action('today.keepGoing', function (el) {
    var s = FT.store.today.session;
    if (!s) return;
    var extraMin = el.dataset.min ? Number(el.dataset.min) : null, plannedBefore = s.plannedMin;
    callNow('keepGoing', { minutes: extraMin }, function () {
      var workedMin = Math.ceil(workedMs(s, Date.now()) / 60000);
      s.plannedMin = extraMin === null ? null : Math.max(s.plannedMin || 0, workedMin) + extraMin;
      return function () { s.plannedMin = plannedBefore; };
    });
  });
  FT.action('today.showAnyway', function () { showFocusOnAwayDay = FT.store.today.day; FT.render(); });
  FT.action('today.focusReminder', function (el) { call('focusReminder', { id: el.dataset.id }); });
  FT.action('today.dismissReminder', function (el) { call('dismissReminder', { id: el.dataset.id }); });

  /** Pick the project to switch to (most neglected first, as Today ranks them) and maybe a reminder about this one. */
  FT.action('today.swap', function () {
    var t = FT.store.today, current = FT.project(t.focusId);
    var options = (t.ranked || []).filter(function (id) { return id !== t.focusId; }).map(FT.project).filter(Boolean).map(function (p) {
      return { value: p.id, label: p.name + ' (' + FT.category(p.category).label + ', ' + FT.ageLabel(FT.daysSince(p.last_touched)) + ')' };
    });
    if (!options.length) { FT.toast('There is no other active project to switch to.'); return; }
    FT.dialog({
      title: 'Swap focus',
      subtitle: current ? 'Skipping ' + current.name + ' for today. A skip never counts as work, so it will come back.' : '',
      submit: 'Swap',
      fields: [
        { id: 'to', label: 'Switch to', type: 'select', options: options, value: options[0].value },
        { id: 'remind', label: current ? 'Remind me about ' + current.name : 'Reminder', type: 'select', value: '0',
          options: REMIND_OPTIONS.map(function (o) { return { value: o[0], label: o[1] }; }) }
      ],
      onSubmit: function (v) { unlockAudio(); return FT.rpc('today', 'swap', { toId: v.to, remindDays: Number(v.remind) }, { quiet: true }); }
    });
  });

  // ---------- rotation editor ----------
  function planOptions(selected, firstLabel, firstValue) {
    var options = [[firstValue, firstLabel]];
    if (firstValue !== '') options.push(['', 'Any category']);
    options = options.concat(FT.categories().map(function (c) { return [c.id, c.label]; })).concat([[AWAY, 'Away (day off)']]);
    return options.map(function (o) {
      return '<option value="' + FT.esc(o[0]) + '"' + (o[0] === selected ? ' selected' : '') + '>' + FT.esc(o[1]) + '</option>';
    }).join('');
  }

  function rotationTableHtml(t) {
    var week = t.week || {};
    return '<table class="rotedit"><thead><tr><th>Day</th><th>Usually</th><th>This week</th></tr></thead><tbody>' + DAYS.map(function (d) {
      var day = d[0], usual = (t.usual || {})[day], changed = Object.prototype.hasOwnProperty.call(week, day);
      return '<tr><td>' + d[1] + '</td>' +
        '<td><select id="rot-usual-' + day + '" aria-label="' + d[1] + ' usually">' + planOptions(usual === null ? '' : usual, 'Any category', '') + '</select></td>' +
        '<td><select id="rot-week-' + day + '" aria-label="' + d[1] + ' this week">' + planOptions(changed ? (week[day] === null ? '' : week[day]) : 'same', 'Same as usual', 'same') + '</select></td></tr>';
    }).join('') + '</tbody></table>';
  }

  FT.action('today.rotation', function () {
    var t = FT.store.today;
    FT.dialog({
      title: 'Weekly rotation',
      subtitle: 'The lead category gets a head start each day. "This week" changes end on Sunday night.',
      wide: true,
      body: rotationTableHtml(t),
      onSubmit: function () {
        var usual = {}, week = {};
        DAYS.forEach(function (d) {
          usual[d[0]] = document.getElementById('rot-usual-' + d[0]).value;
          var thisWeek = document.getElementById('rot-week-' + d[0]).value;
          if (thisWeek !== 'same') week[d[0]] = thisWeek;
        });
        return FT.rpc('today', 'saveRotation', { usual: usual, week: week }, { quiet: true });
      }
    });
  });
  FT.action('today.pause', function () {
    var s = FT.store.today.session;
    if (!s || s.pausedAt) return;
    callNow('pause', undefined, function () { s.pausedAt = new Date().toISOString(); return function () { s.pausedAt = ''; }; });
  });
  FT.action('today.resume', function () {
    var s = FT.store.today.session;
    if (!s || !s.pausedAt) return;
    var paused = s.pausedAt, before = s.pausedMs || 0;
    callNow('resume', undefined, function () {
      s.pausedMs = before + (Date.now() - new Date(paused).getTime()); s.pausedAt = '';
      return function () { s.pausedMs = before; s.pausedAt = paused; };
    });
  });
  FT.action('today.pomodoro', function () { call('pomodoro', { on: !FT.store.today.session.pomodoro }); });
  FT.action('today.nextPhase', function () { call('nextPhase'); });
  FT.action('today.pomodoroSettings', function () {
    var settings = FT.store.today.pomodoroSettings;
    FT.dialog({
      title: 'Pomodoro lengths',
      submit: 'Save',
      fields: [
        { id: 'work', label: 'Work (minutes)', value: String(settings.work) },
        { id: 'break', label: 'Break (minutes)', value: String(settings.break) }
      ],
      hint: 'A new length applies from the next period you start.',
      after: '<label>Sounds</label><div class="settingrow"><span style="color:var(--muted)">Plays when a period ends. Try them here.</span>' +
        '<button class="btn" type="button" id="dlg-test-chicken">Chicken (break starts)</button>' +
        '<button class="btn" type="button" id="dlg-test-whistle">Steam whistle (work starts)</button></div>',
      onOpen: function () {
        document.getElementById('dlg-test-chicken').addEventListener('click', function () { makeAudioNow(); playSound(playChicken); });
        document.getElementById('dlg-test-whistle').addEventListener('click', function () { makeAudioNow(); playSound(playWhistle); });
      },
      onSubmit: function (v) { return FT.rpc('today', 'pomodoroSettings', { work: v.work, break: v.break }, { quiet: true }); }
    });
  });
  /** Throw the running session away after a clear question: nothing is logged and the project is left as it was. */
  function confirmDiscard(p) {
    FT.dialog({
      title: 'Delete this session?',
      subtitle: p ? p.name : '',
      body: '<p>Nothing is logged, its minutes do not count and the next action stays as it is. You cannot undo this.</p>',
      submit: 'Delete session',
      danger: true,
      onSubmit: function () {
        var t = FT.store.today, before = t.session;
        callNow('discard', { start: before && before.start }, function () { t.session = null; return function () { t.session = before; }; });
        FT.toast('Session deleted. Nothing was logged.');
      }
    });
  }

  FT.action('today.finish', function () {
    var t = FT.store.today, p = FT.project(t.session ? t.session.projectId : t.focusId);
    FT.dialog({
      title: 'Finish session',
      subtitle: p ? p.name : '',
      submit: 'Save and park it',
      fields: [
        { id: 'where', label: 'Where did you stop?', type: 'textarea', placeholder: 'One line is enough' }
      ].concat(p && nextActionShown(p) ? [{ id: 'next', label: 'What is the very next action?', value: p.next_action, maxlength: 300 }] : []),
      after: t.session ? '<div class="discardrow"><span>Not worth keeping?</span><button class="btn sm danger" type="button" id="dlg-discard">Delete this session</button></div>' : '',
      onOpen: function () {
        var discard = document.getElementById('dlg-discard');
        if (discard) discard.addEventListener('click', function () { confirmDiscard(p); });
      },
      onSubmit: function (v) {
        return FT.rpc('today', 'finish', { projectId: p && p.id, where: v.where, next: v.next }, { quiet: true });
      }
    });
  });
})();
</script>

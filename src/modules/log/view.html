<style>
/* Phone: each log line is a card (project and date, where I stopped, next action, time and Edit) instead of a table wider than the screen. */
@media (max-width: 760px) {
  .scroll table.ltable { min-width: 0; }
  .ltable, .ltable thead, .ltable tbody { display: block; }
  .ltable thead { display: none; }
  .ltable tbody tr.logrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "project date" "stopped stopped" "next next" "time edit"; gap: 4px 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .ltable tbody tr.logrow td { display: block; padding: 0; border: 0; min-width: 0; text-align: left; overflow-wrap: anywhere; }
  .ltable tbody td:nth-child(1) { grid-area: date; text-align: right; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .ltable tbody td:nth-child(2) { grid-area: project; font-size: 16px; }
  .ltable tbody td:nth-child(3) { grid-area: stopped; }
  .ltable tbody td:nth-child(4) { grid-area: next; color: var(--muted); }
  .ltable tbody td:nth-child(4):not(:empty)::before { content: "Next: "; font-weight: 600; }
  .ltable tbody td:nth-child(5) { grid-area: time; font-size: 13px; color: var(--muted); }
  .ltable tbody td.lact { grid-area: edit; text-align: right; }
}
</style>
<script>
(function () {
  var filter = 'all';

  function render() {
    var projects = FT.store.projects || [];
    var opts = '<option value="all">All projects</option>' + projects.map(function (p) {
      return '<option value="' + FT.esc(p.id) + '"' + (p.id === filter ? ' selected' : '') + '>' + FT.esc(p.name) + '</option>';
    }).join('');
    var rows = (FT.store.log || []).filter(function (l) { return filter === 'all' || l.project_id === filter; }).map(function (l) {
      var p = FT.project(l.project_id);
      return '<tr class="logrow"><td class="num">' + FT.fmtDate(l.date) + '</td><td><b>' + FT.esc(p ? p.name : l.project_id ? 'Deleted project' : 'Sync conflict') + '</b></td><td>' + FT.linkify(l.where_stopped) + '</td><td>' + FT.linkify(l.next_action) + '</td><td class="num">' + (l.minutes ? l.minutes + ' min' : '') + '</td><td class="lact"><button class="btn sm" data-act="log.edit" data-id="' + FT.esc(l.id) + '">Edit</button></td></tr>';
    }).join('');
    return '<section class="panel"><div class="label">Session log</div>' +
      '<label for="log-filter" class="label" style="display:block">Filter<select id="log-filter" class="auto" style="display:block;margin-top:6px" data-change="log.filter">' + opts + '</select></label>' +
      '<div class="scroll"><table class="ltable"><thead><tr><th>Date</th><th>Project</th><th>Where I stopped</th><th>Next action</th><th>Time</th><th></th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="6" class="empty">Nothing logged yet. Finish a session on the Today tab to add a line.</td></tr>') + '</tbody></table></div></section>';
  }

  FT.action('log.edit', function (el) {
    var l = (FT.store.log || []).filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!l) return;
    var p = FT.project(l.project_id), day = l.date.slice(0, 10);
    FT.dialog({
      title: 'Edit log line',
      subtitle: p ? p.name : l.project_id ? 'Deleted project' : 'Sync conflict',
      fields: [
        { id: 'date', label: 'Date (YYYY-MM-DD)', value: day },
        { id: 'where', label: 'Where I stopped', type: 'textarea', value: l.where_stopped },
        { id: 'next', label: 'Next action', value: l.next_action }
      ],
      onSubmit: function (v) {
        if (!v.where) throw new Error('Say where you stopped.');
        if (v.date !== day && (!/^\d{4}-\d{2}-\d{2}$/.test(v.date) || new Date(v.date + 'T00:00:00Z').toISOString().slice(0, 10) !== v.date)) throw new Error('The date must look like 2026-10-28.');
        var args = { id: l.id, where: v.where.slice(0, 300), next: v.next.slice(0, 300) };
        l.where_stopped = args.where;
        if (v.date !== day) { args.date = v.date; l.date = v.date + l.date.slice(10); }
        // Same rule as the server: the project's next action follows its newest line
        var newest = FT.store.log.filter(function (x) { return x.project_id === l.project_id; }).sort(function (x, y) { return x.date < y.date ? 1 : -1; })[0];
        l.next_action = args.next;
        if (p && newest.id === l.id && args.next) p.next_action = args.next;
        FT.store.log.sort(function (x, y) { return x.date < y.date ? 1 : -1; });
        FT.render();
        FT.rpc('log', 'update', args, { render: false }).catch(FT.saveFailed);
      }
    });
  });

  // The log is the Logs sub-tab of Insights (modules/insights). Without that module it is not shown.
  FT.module({ id: 'log', slots: { 'insights.sub': [{ id: 'logs', title: 'Logs', order: 40, render: render }] } });
  FT.on('change', 'log.filter', function (el) { filter = el.value; FT.render(); });
})();
</script>

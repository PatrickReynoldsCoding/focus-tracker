<style>
.notes-top { display: block; }
.notes-done { display: none; }
.notes-edit { min-height: 220px; max-height: 60vh; font-size: 15.5px; }
.notes-panel .rtbar { margin-bottom: 8px; }
.notes-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
/* Phone: tapping the notes opens them edge to edge. The top row is the formatting bar (undo, redo, text styles) and Done; the rest is the note. */
@media (max-width: 760px) {
  .notes-panel.full { position: fixed; top: 0; left: 0; right: 0; height: var(--vvh, 100dvh); z-index: 50; margin: 0; padding: 0; border: 0; border-radius: 0; display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
  .notes-panel.full > .label, .notes-panel.full .notes-foot { display: none; }
  .notes-panel.full .notes-top { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 10px 8px; border-bottom: 1px solid var(--line); }
  .notes-panel.full .notes-top .rtbar { flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; margin: 0; }
  .notes-panel.full .notes-top .rtbar button { min-width: 40px; height: 40px; flex: none; }
  .notes-panel.full .notes-done { display: inline-flex; flex: none; }
  .notes-panel.full .notes-edit { flex: 1; min-height: 0; max-height: none; border: 0; border-radius: 0; outline: 0; padding: 12px 18px 18px; font-size: 17px; line-height: 1.6; }
}
</style>
<script>
(function () {
  var cache = {};        // projectId -> markdown text, once loaded
  var loaded = {};       // projectId -> the file version (its `updated`) the text in cache builds on; '' when there was no file
  var edited = {};       // projectId -> when the text was last changed here
  var modeOf = {};       // projectId -> the mode the notes belong to, so a save after a mode switch still goes to the right sheet
  var timers = {};       // projectId -> debounce timer
  var dirty = {};        // projectId -> true while there are unsaved edits
  var saving = {};       // projectId -> true while a save is on its way (the next one waits for its version)
  var failures = {};     // projectId -> failed saves in a row, for the retry delay
  var loads = {};        // projectId -> number of the newest load, so an older reply is ignored
  var fullOpen = false;  // the phone's full screen editor is open
  var fullEntry = false; // ...and it added a browser history entry, so the phone's back button closes it
  var narrow = window.matchMedia('(max-width: 760px)');
  var RETRY_MS = [2000, 5000, 15000, 30000, 60000];

  // The toolbar edits what the markdown file can hold: bold, italic, headings, lists and quotes.
  var TOOLS = [
    ['undo', null, '↶', 'Undo'], ['redo', null, '↷', 'Redo'],
    ['bold', null, '<b>B</b>', 'Bold'], ['italic', null, '<i>I</i>', 'Italic'],
    ['formatBlock', 'h1', 'H1', 'Heading 1 (' + FT.headingKeyName(1) + ')'], ['formatBlock', 'h2', 'H2', 'Heading 2 (' + FT.headingKeyName(2) + ')'],
    ['formatBlock', 'h3', 'H3', 'Heading 3 (' + FT.headingKeyName(3) + ')'], ['formatBlock', 'p', 'Text', 'Normal text (' + FT.headingKeyName(0) + ')'],
    ['insertUnorderedList', null, '• List', 'Bullet list'], ['insertOrderedList', null, '1. List', 'Numbered list'],
    ['formatBlock', 'blockquote', '❝', 'Quote']
  ];

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  function noteRow(projectId) {
    return (FT.store.notes || []).filter(function (n) { return n.project_id === projectId; })[0] || null;
  }

  // ---------- drafts: what was typed is kept on this device until the server has it, so closing the page loses nothing ----------
  function draftKey(projectId) { return 'ft.draft.notes.' + (modeOf[projectId] || FT.state.mode) + '.' + projectId; }
  function keepDraft(projectId) {
    try { localStorage.setItem(draftKey(projectId), JSON.stringify({ text: cache[projectId], base: loaded[projectId], at: edited[projectId] })); } catch (e) {}
  }
  function readDraft(projectId) {
    try { return JSON.parse(localStorage.getItem(draftKey(projectId)) || 'null'); } catch (e) { return null; }
  }
  function dropDraft(projectId) { try { localStorage.removeItem(draftKey(projectId)); } catch (e) {} }

  function toolbarHtml() {
    return '<div class="rtbar" id="nt-bar" role="toolbar" aria-label="Text formatting">' + TOOLS.map(function (t) {
      return '<button type="button" data-cmd="' + t[0] + '"' + (t[1] ? ' data-val="' + t[1] + '"' : '') + ' title="' + t[3] + '" aria-label="' + t[3] + '">' + t[2] + '</button>';
    }).join('') + '</div>';
  }

  function panel(p) {
    var row = noteRow(p.id);
    var ready = has(cache, p.id) || !row;
    return '<section class="panel notes-panel' + (fullOpen && narrow.matches ? ' full' : '') + '" id="nt-panel"><div class="label">Notes</div>' +
      '<div class="notes-top">' + toolbarHtml() + '<button class="btn primary notes-done" type="button" data-act="notes.done">Done</button></div>' +
      '<div class="rtedit notes-edit" id="nt-text" contenteditable="' + (ready ? 'true' : 'false') + '" role="textbox" aria-multiline="true" aria-label="Notes" data-placeholder="' + (ready ? 'Ideas, decisions, links. Saved as a markdown file in Drive.' : 'Loading…') + '">' + FT.mdToHtml(cache[p.id] || '') + '</div>' +
      '<div class="notes-foot"><span id="nt-status"></span><a id="nt-link" href="' + FT.esc(row ? row.url : '') + '" target="_blank" rel="noopener noreferrer"' + (row ? '' : ' hidden') + '>Open file in Drive</a></div></section>';
  }

  function status(projectId, text) {
    var el = document.getElementById('nt-status');
    if (el && FT.state.projectId === projectId) el.textContent = text;
  }

  /** Put the cached text in the editor, if that project's notes are on screen and nothing is being typed there. */
  function show(projectId) {
    var el = document.getElementById('nt-text');
    if (!el || FT.state.projectId !== projectId) return;
    el.innerHTML = FT.mdToHtml(cache[projectId] || ''); el.setAttribute('contenteditable', 'true');
    el.dataset.placeholder = 'Ideas, decisions, links. Saved as a markdown file in Drive.';
  }

  /** The version this browser now holds, kept on the notes row too (the offline queue checks against it). */
  function holdVersion(projectId, r) {
    loaded[projectId] = r.updated || '';
    var row = noteRow(projectId);
    if (row) row.updated = r.updated;
    else if (r.url) {
      FT.store.notes = (FT.store.notes || []).concat([{ project_id: projectId, url: r.url, updated: r.updated }]);
      var link = document.getElementById('nt-link');
      if (link && FT.state.projectId === projectId) { link.href = r.url; link.hidden = false; }
    }
  }

  function retryLater(projectId) {
    clearTimeout(timers[projectId]);
    timers[projectId] = setTimeout(function () { save(projectId); }, RETRY_MS[Math.min(failures[projectId] - 1, RETRY_MS.length - 1)]);
  }

  /**
   * Send the notes. One save per project at a time: each carries the version it builds on (_base), so a page left open on
   * another device cannot write old notes over newer ones (the server keeps both, see notes/server.js). A failed save
   * says so and tries again; the draft stays on the device until the server has the text.
   */
  function save(projectId) {
    clearTimeout(timers[projectId]);
    if (!dirty[projectId] || saving[projectId]) return;
    var text = cache[projectId] || '';
    dirty[projectId] = false; saving[projectId] = true;
    status(projectId, 'Saving…');
    var args = { projectId: projectId, text: text, _base: has(loaded, projectId) ? loaded[projectId] : '', _editedAt: edited[projectId] || new Date().toISOString() };
    FT.rpc('notes', 'save', args, { render: false, quiet: true, mode: modeOf[projectId] })
      .then(function (r) {
        saving[projectId] = false; failures[projectId] = 0;
        if (!r) { status(projectId, 'Saved on this device'); if (dirty[projectId]) save(projectId); return; } // waiting offline, sent later
        holdVersion(projectId, r);
        if (r.conflict) {
          FT.toast('These notes were also changed on another device. Both are kept: ' + (r.conflict.kept === 'server' ? 'the newer text is shown, yours' : 'yours is shown, the other text') +
            ' is saved as ' + r.conflict.copyName + ' in the Notes folder.', 'error');
          if (r.conflict.kept === 'server' && !dirty[projectId]) { cache[projectId] = r.text || ''; show(projectId); }
        }
        if (dirty[projectId]) { save(projectId); return; }
        if (readDraft(projectId) && readDraft(projectId).text === text) dropDraft(projectId);
        status(projectId, 'Saved');
      }, function (e) {
        saving[projectId] = false; dirty[projectId] = true;
        failures[projectId] = (failures[projectId] || 0) + 1;
        status(projectId, 'Not saved: ' + e.message);
        if (failures[projectId] === 1 || failures[projectId] % 3 === 0) {
          FT.toast('Notes not saved: ' + e.message + ' Trying again; the text is kept on this device.', 'error', { label: 'Retry now', run: function () { save(projectId); } });
        }
        retryLater(projectId);
      });
  }

  /** Save every project's notes now, for example when the page is hidden or closing. */
  function saveAll() { Object.keys(dirty).forEach(function (id) { if (dirty[id]) save(id); }); }
  FT.onLeave(saveAll);

  // A change that waited offline was sent later: the version it produced is the base for the next save.
  document.addEventListener('ft:saved', function (e) {
    var d = e.detail || {};
    if (d.key !== 'notes.save' || !d.version) return;
    var id = d.args.projectId;
    loaded[id] = d.version;
    if (!dirty[id] && !saving[id] && cache[id] === d.args.text) { dropDraft(id); status(id, 'Saved'); }
  });

  /**
   * Load a project's notes. Also when they changed on the server since this page loaded them (fresh data from another
   * device), unless something is being typed. A draft left on this device by a page that closed before saving is put back and saved.
   */
  function load(projectId) {
    var seq = loads[projectId] = (loads[projectId] || 0) + 1;
    modeOf[projectId] = modeOf[projectId] || FT.state.mode;
    FT.rpc('notes', 'get', { projectId: projectId }, { render: false, quiet: true, parallel: true }).then(function (r) {
      if (seq !== loads[projectId] || dirty[projectId] || saving[projectId]) return; // a newer load, or typing: keep what is on screen
      cache[projectId] = r.text || '';
      loaded[projectId] = r.updated || '';
      var draft = readDraft(projectId);
      if (draft && draft.text !== cache[projectId]) {
        cache[projectId] = draft.text; loaded[projectId] = draft.base || ''; edited[projectId] = draft.at; dirty[projectId] = true;
      } else if (draft) dropDraft(projectId);
      show(projectId);
      if (dirty[projectId]) save(projectId);
    }).catch(function (e) { FT.toast('Could not load notes: ' + e.message, 'error'); });
  }

  FT.module({
    id: 'notes',
    slots: { 'project.page': [{ id: 'notes', title: 'Notes', order: 20, span: 'half', render: panel }] },
    onProject: function (projectId) {
      var row = noteRow(projectId);
      var stale = has(cache, projectId) && row && row.updated !== loaded[projectId];
      if (!has(cache, projectId) || (stale && !dirty[projectId] && !saving[projectId])) load(projectId);
    }
  });

  function editor() { return document.getElementById('nt-text'); }

  // The editor is rebuilt when the page redraws, so the markdown shortcuts are attached after every draw.
  FT.onRender(function () {
    var el = editor();
    if (!el) { fullOpen = false; if (fullEntry) { fullEntry = false; FT.popHistory(); } }
    if (el && !el.dataset.md) { el.dataset.md = '1'; FT.richShortcuts(el); FT.headingKeys(el); }
    if (el && fullOpen && narrow.matches) fitToScreen();
  });

  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'nt-text') return;
    var id = FT.state.projectId;
    modeOf[id] = modeOf[id] || FT.state.mode;
    cache[id] = FT.htmlToMd(e.target); dirty[id] = true; edited[id] = new Date().toISOString();
    keepDraft(id); status(id, 'Editing…');
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function () { save(id); }, 1200);
  });
  document.addEventListener('focusout', function (e) {
    if (e.target && e.target.id === 'nt-text') save(FT.state.projectId);
  });
  // Pasted text goes in as plain text, so it cannot bring in styles the markdown file cannot hold.
  document.addEventListener('paste', function (e) {
    if (!e.target || e.target.id !== 'nt-text') return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // Toolbar buttons keep the text selection, like the card editor's.
  document.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('#nt-bar button')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#nt-bar button');
    if (!btn) return;
    editor().focus();
    document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    editor().dispatchEvent(new Event('input', { bubbles: true }));
  });

  // Phone: tapping into the notes opens them full screen.
  function fitToScreen() {
    var p = document.getElementById('nt-panel'), vv = window.visualViewport;
    if (p) p.style.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitToScreen); window.visualViewport.addEventListener('scroll', fitToScreen); }
  document.addEventListener('focusin', function (e) {
    var p = document.getElementById('nt-panel');
    if (e.target && e.target.id === 'nt-text' && narrow.matches && p && !fullOpen) {
      fullOpen = true; p.classList.add('full'); fitToScreen(); window.scrollTo(0, 0);
      fullEntry = FT.pushHistory();
    }
  });
  function closeFull() {
    fullOpen = false;
    var p = document.getElementById('nt-panel');
    if (p) p.classList.remove('full');
    if (editor()) editor().blur();
    save(FT.state.projectId);
  }
  FT.action('notes.done', function () {
    closeFull();
    if (fullEntry) { fullEntry = false; FT.popHistory(); }
  });
  // The phone's back button closes the full screen editor instead of leaving the page.
  FT.onBack(function () {
    if (!fullOpen) return false;
    fullEntry = false;
    closeFull();
    return true;
  });
})();
</script>

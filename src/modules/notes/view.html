<style>
.notes-top { display: block; }
.notes-done { display: none; }
.notes-edit { min-height: 220px; max-height: 60vh; font-size: 15.5px; }
.notes-panel .rtbar { margin-bottom: 8px; }
.notes-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.notes-foot .nt-right { display: flex; gap: 12px; align-items: center; }
.nt-copy { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
.notes-panel .rtbar .sep { width: 1px; background: var(--line); margin: 2px; }
.notes-panel .rtbar .dot.hi i { border-radius: 3px; }
.notes-edit h1 { font-size: 1.75em; } .notes-edit h2 { font-size: 1.4em; } .notes-edit h3 { font-size: 1.15em; }
/* The bar under the editor sets its height (drag, or arrow keys); the height is kept in this browser. */
.notes-edit.sized { height: var(--nt-h); min-height: 120px; max-height: none; }
.nt-grip { height: 16px; margin-top: 2px; cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.nt-grip::before { content: ""; width: 56px; height: 5px; border-radius: 3px; background: var(--line); }
.nt-grip:hover::before, .nt-grip:focus-visible::before, .nt-grip.dragging::before { background: var(--accent); }
.nt-grip:focus-visible { outline: 2px solid var(--accent); }
/* Phone: tapping the notes opens them edge to edge. The top row is the formatting bar (undo, redo, text styles) and Done; the rest is the note. */
@media (max-width: 760px) {
  .notes-panel.full { position: fixed; top: 0; left: 0; right: 0; height: var(--vvh, 100dvh); z-index: 50; margin: 0; padding: 0; border: 0; border-radius: 0; display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
  .notes-panel.full > .label, .notes-panel.full .notes-foot, .notes-panel.full .nt-grip { display: none; }
  .notes-panel.full .notes-top { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 10px 8px; border-bottom: 1px solid var(--line); }
  .notes-panel.full .notes-top .rtbar { flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; margin: 0; }
  .notes-panel.full .notes-top .rtbar button { min-width: 40px; height: 40px; flex: none; }
  .notes-panel.full .notes-done { display: inline-flex; flex: none; }
  .notes-panel.full .notes-edit { flex: 1; height: auto; min-height: 0; max-height: none; border: 0; border-radius: 0; outline: 0; padding: 12px 18px 18px; font-size: 17px; line-height: 1.6; }
}
.notes-panel .rtbar .nt-paper { height: 30px; padding: 0 6px; font-size: 13px; width: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
/*
 * Paper themes (picked per device, ft.notes.paper). Every text row is exactly one rule tall: the rule is 1.75em of the
 * editor's own font size, line-height is the unitless 1.75, blocks have no margins, and headings are 1 or 2 rules tall.
 * So the lines follow the text when the font size changes (phone) and scroll with it (background-attachment: local).

:root {
  --nt-ink: #1b2a4a; --nt-legal: #fdf5a6; --nt-white: #fffefb; --nt-blue: #9ec3e4; --nt-red: #e07272; --nt-grid: #c9dbe8;
  --nt-binding: #7d2b2b; --nt-shadow: 0 1px 2px rgba(40, 30, 0, 0.18), 0 8px 16px -10px rgba(40, 30, 0, 0.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="eink"]) { --nt-legal: #e6dc8f; --nt-white: #e4e3dc; --nt-blue: #7fa5c6; --nt-grid: #b2c3cf; --nt-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
}
:root[data-theme="dark"] { --nt-legal: #e6dc8f; --nt-white: #e4e3dc; --nt-blue: #7fa5c6; --nt-grid: #b2c3cf; --nt-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.notes-edit.paper {
  --nt-rule: 1.75em; --nt-line: var(--nt-blue);
  --nt-rules: linear-gradient(to bottom, transparent calc(100% - 1px), var(--nt-line) calc(100% - 1px)) 0 0 / 100% var(--nt-rule) repeat local content-box;
  color: var(--nt-ink); caret-color: var(--nt-ink); background: var(--nt-rules), local var(--nt-white); box-shadow: var(--nt-shadow); border-color: transparent;
}
.notes-panel .notes-edit.paper { line-height: 1.75; }
.notes-panel .notes-edit.paper p, .notes-panel .notes-edit.paper div, .notes-panel .notes-edit.paper ul, .notes-panel .notes-edit.paper ol,
.notes-panel .notes-edit.paper blockquote, .notes-panel .notes-edit.paper h1, .notes-panel .notes-edit.paper h2, .notes-panel .notes-edit.paper h3 { margin: 0; }
.notes-panel .notes-edit.paper h1 { font-size: 1.75em; line-height: 2; }
.notes-panel .notes-edit.paper h2 { font-size: 1.4em; line-height: 1.25; }
.notes-panel .notes-edit.paper h3 { font-size: 1.15em; line-height: 1.5217; }
.notes-panel .notes-edit.paper blockquote { color: inherit; opacity: 0.8; border-left-color: currentColor; }
.notes-panel .notes-edit.paper a { color: #1a4fa0; }
.notes-panel .notes-edit.paper:empty::before { color: rgba(27, 42, 74, 0.62); }
.notes-panel .notes-edit.paper-legal {
  font-family: "Patrick Hand", "Bradley Hand", "Segoe Print", "Comic Neue", var(--font-body); font-size: 17px; padding-left: 3.6em;
  border-top: 14px solid var(--nt-binding); border-radius: 2px 2px 4px 4px;
  background: linear-gradient(to right, transparent 2.6em, var(--nt-red) 2.6em, var(--nt-red) calc(2.6em + 1px), transparent calc(2.6em + 1px), transparent 2.85em, var(--nt-red) 2.85em, var(--nt-red) calc(2.85em + 1px), transparent calc(2.85em + 1px)) 0 0 / 100% 100% no-repeat local border-box,
    var(--nt-rules), local var(--nt-legal);
}
.notes-panel .notes-edit.paper-graph { --nt-line: var(--nt-grid);
  background: linear-gradient(to right, transparent calc(100% - 1px), var(--nt-grid) calc(100% - 1px)) 0 0 / var(--nt-rule) var(--nt-rule) repeat local content-box, var(--nt-rules), local var(--nt-white); }
.notes-panel .notes-edit.paper-card { border-radius: 3px;
  --nt-card-head: linear-gradient(var(--nt-red), var(--nt-red)) 0 calc(2 * var(--nt-rule) - 2px) / 100% 2px no-repeat local content-box,
    linear-gradient(var(--nt-white), var(--nt-white)) 0 -24px / 100% calc(2 * var(--nt-rule) + 22px) no-repeat local content-box;
  background: var(--nt-card-head), var(--nt-rules), local var(--nt-white); }
@media (max-width: 760px) {
  .notes-panel.full .notes-edit.paper-legal { font-size: 19px; padding-left: 3.6em; }
}
/* E-ink: black on white, thin black lines (graph paper: a dot at each crossing), no colour, no shadow, the usual font. */
:root[data-theme="eink"] .notes-edit.paper { --nt-ink: #000; --nt-line: #000; --nt-grid: #000; --nt-red: #000; --nt-binding: #000; }
:root[data-theme="eink"] .notes-panel .notes-edit.paper { background: var(--nt-rules), local #fff !important; color: #000 !important; font-family: var(--font-body); }
:root[data-theme="eink"] .notes-panel .notes-edit.paper-graph { background: radial-gradient(circle at calc(100% - 1px) calc(100% - 1px), #000 1.2px, transparent 1.7px) 0 0 / var(--nt-rule) var(--nt-rule) repeat local content-box, local #fff !important; }
:root[data-theme="eink"] .notes-panel .notes-edit.paper-card { --nt-white: #fff; background: var(--nt-card-head), var(--nt-rules), local #fff !important; }
:root[data-theme="eink"] .notes-panel .notes-edit.paper-legal { background: linear-gradient(to right, transparent 2.6em, #000 2.6em, #000 calc(2.6em + 1px), transparent calc(2.6em + 1px)) 0 0 / 100% 100% no-repeat local border-box, var(--nt-rules), local #fff !important; }
:root[data-theme="eink"] .notes-panel .notes-edit.paper a { color: #000; }
:root[data-theme="eink"] .notes-panel .notes-edit.paper:empty::before { color: #333; }

<script>
/**
 * Notes editors. Every map below is keyed by the notes key: a project's id, or the list id of a note of the Notes tab
 * (a row of the Lists tab with kind 'note'; notes/server.js). Several notes can be on screen at once (the Notes tab,
 * Today, a project page with a linked note): each editor and its toolbar, status, link and grip carry the key in their
 * element ids, and handlers find the editor from the element that was used.
 */
(function () {
  var cache = {};        // key -> the notes as markdown (for drafts and comparing), once loaded
  var formatted = {};    // key -> the editor's HTML: what is saved into the notes Doc
  var loaded = {};       // key -> the Doc version (its modifiedTime) the text builds on; '' when there was no Doc
  var edited = {};       // key -> when the text was last changed here
  var modeOf = {};       // key -> the mode the notes belong to, so a save after a mode switch still goes to the right sheet
  var timers = {};       // key -> debounce timer
  var dirty = {};        // key -> true while there are unsaved edits
  var saving = {};       // key -> true while a save is on its way (the next one waits for its version)
  var failures = {};     // key -> failed saves in a row, for the retry delay
  var loads = {};        // key -> number of the newest load, so an older reply is ignored
  var noteKeys = {};     // key -> true for a note of the Notes tab (the server is sent listId, not projectId)
  var fullKey = null;    // the notes open edge to edge on a phone
  var fullEntry = false; // ...and it added a browser history entry, so the phone's back button closes it
  var narrow = window.matchMedia('(max-width: 760px)');
  var RETRY_MS = [2000, 5000, 15000, 30000, 60000];
  var onScreen = [];     // the keys of the notes on screen, to notice leaving them
  var HEIGHT_KEY = 'ft.notes.height';
  var PAPER_KEY = 'ft.notes.paper';
  var SAVED_KEY = 'ft.notes.saved.'; // + mode + '.' + key: another window of this browser saved these notes
  // Paper themes, picked per device: [id, label]. '' is plain.
  var PAPERS = [['', 'Plain'], ['legal', 'Legal pad'], ['graph', 'Graph paper'], ['card', 'Index card']];
  var HANDWRITING_FONT_URL = 'https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap';
  var tabId = thisTabId();
  var PLACEHOLDER = 'Ideas, decisions, links. Saved as a Google Doc.';
  var EDITORS = '#app .notes-edit, #popRoot .notes-edit';
  var PROJECT_NOTES_PANEL = 'pnote-'; // + project id: a project's notes as a panel of Today or the Notes tab

  // Everything the toolbar makes is kept in the notes Doc (notes/server.js converts both ways).
  var TOOLS = [
    ['undo', null, '↶', 'Undo'], ['redo', null, '↷', 'Redo'],
    ['bold', null, '<b>B</b>', 'Bold'], ['italic', null, '<i>I</i>', 'Italic'],
    ['underline', null, '<u>U</u>', 'Underline'], ['strikeThrough', null, '<s>S</s>', 'Strikethrough'],
    ['formatBlock', 'h1', 'H1', 'Heading 1 (' + FT.headingKeyName(1) + ')'], ['formatBlock', 'h2', 'H2', 'Heading 2 (' + FT.headingKeyName(2) + ')'],
    ['formatBlock', 'h3', 'H3', 'Heading 3 (' + FT.headingKeyName(3) + ')'], ['formatBlock', 'p', 'Text', 'Normal text (' + FT.headingKeyName(0) + ')'],
    ['insertUnorderedList', null, '• List', 'Bullet list'], ['insertOrderedList', null, '1. List', 'Numbered list'],
    ['formatBlock', 'blockquote', '❝', 'Quote']
  ];
  // execCommand needs real colours, not CSS variables. These read well on light and dark backgrounds.
  var TEXT_COLORS = [['#d64545', 'Red'], ['#e07b00', 'Orange'], ['#2b9a5b', 'Green'], ['#2f7fd6', 'Blue'], ['#8b5cd6', 'Purple'], ['#808080', 'Grey']];
  var HIGHLIGHTS = [['#fff176', 'Yellow'], ['#a5e8b8', 'Green'], ['#a8d4ff', 'Blue'], ['#ffb3b3', 'Pink']];

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  function noteRow(key) {
    return (FT.store.notes || []).filter(function (n) { return n.project_id === key || n.list_id === key; })[0] || null;
  }

  function isNote(key) {
    var row = noteRow(key);
    return !!noteKeys[key] || !!(row && row.list_id === key);
  }

  /** What the server is told the notes belong to: a note (listId) or a project (projectId). */
  function argsFor(key) {
    return isNote(key) ? { listId: key } : { projectId: key };
  }

  /** This browser tab's id, kept for the tab's life (also across a reload), so two windows never write over each other's drafts. */
  function thisTabId() {
    var fresh = Math.random().toString(36).slice(2, 10);
    try {
      var id = sessionStorage.getItem('ft.tab');
      if (!id) { id = fresh; sessionStorage.setItem('ft.tab', id); }
      return id;
    } catch (e) { return fresh; }
  }

  // ---------- the elements of one key's notes on screen ----------
  function editorsOnScreen() { return Array.prototype.slice.call(document.querySelectorAll(EDITORS)); }
  function editorsFor(key) { return editorsOnScreen().filter(function (el) { return el.dataset.project === key; }); }
  function panelsFor(key) { return editorsFor(key).map(function (el) { return el.closest('.notes-panel'); }).filter(Boolean); }
  function partsFor(key, selector) {
    return panelsFor(key).reduce(function (all, panel) { return all.concat(Array.prototype.slice.call(panel.querySelectorAll(selector))); }, []);
  }
  /** The editor that goes with a toolbar button, grip or link inside a notes panel. */
  function editorBeside(el) {
    var panel = el.closest && el.closest('.notes-panel');
    return panel ? panel.querySelector('.notes-edit') : null;
  }
  function isEditor(el) { return !!el && !!el.classList && el.classList.contains('notes-edit'); }

  // ---------- drafts: what was typed is kept on this device until the server has it, so closing the page loses nothing ----------
  // One entry per window ({ tabs: { <tab id>: { text, html, base, at } } }), so two windows with the same notes open (Today
  // and a project page, or a pop-out) each keep their own unsaved text. An older single draft is read as one entry.
  function draftKey(key) { return 'ft.draft.notes.' + (modeOf[key] || FT.state.mode) + '.' + key; }
  function draftsOf(key) {
    try {
      var stored = JSON.parse(localStorage.getItem(draftKey(key)) || 'null');
      if (!stored) return {};
      return stored.tabs || { older: stored };
    } catch (e) { return {}; }
  }
  function writeDrafts(key, drafts) {
    try {
      if (Object.keys(drafts).length) localStorage.setItem(draftKey(key), JSON.stringify({ tabs: drafts }));
      else localStorage.removeItem(draftKey(key));
    } catch (e) {}
  }
  function keepDraft(key) {
    var drafts = draftsOf(key);
    drafts[tabId] = { text: cache[key], html: formatted[key], base: loaded[key], at: edited[key] };
    writeDrafts(key, drafts);
  }
  function readDraft(key) { return draftsOf(key)[tabId] || null; }
  function dropDraft(key, tab) {
    var drafts = draftsOf(key);
    delete drafts[tab || tabId];
    writeDrafts(key, drafts);
  }
  /** The draft to put back on loading: this window's, else the newest another window left (it may have closed before saving). */
  function draftToRestore(key) {
    var drafts = draftsOf(key);
    if (drafts[tabId]) return { tab: tabId, draft: drafts[tabId] };
    var newest = Object.keys(drafts).sort(function (a, b) { return String(drafts[b].at || '') < String(drafts[a].at || '') ? -1 : 1; })[0];
    return newest ? { tab: newest, draft: drafts[newest] } : null;
  }

  function colourButton(command, colour, title, extraClass) {
    return '<button type="button" class="dot' + extraClass + '" data-cmd="' + command + '" data-val="' + colour + '" title="' + title + '" aria-label="' + title + '"><i style="--dot:' + colour + '"></i></button>';
  }

  function toolbarHtml(key) {
    var separator = '<span class="sep"></span>';
    return '<div class="rtbar nt-bar" id="nt-bar-' + FT.esc(key) + '" role="toolbar" aria-label="Text formatting">' + TOOLS.map(function (t) {
      return '<button type="button" data-cmd="' + t[0] + '"' + (t[1] ? ' data-val="' + t[1] + '"' : '') + ' title="' + t[3] + '" aria-label="' + t[3] + '">' + t[2] + '</button>';
    }).join('') + separator +
      TEXT_COLORS.map(function (colour) { return colourButton('foreColor', colour[0], colour[1] + ' text', ''); }).join('') + separator +
      HIGHLIGHTS.map(function (colour) { return colourButton('hiliteColor', colour[0], colour[1] + ' highlight', ' hi'); }).join('') + separator +
      '<button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">Clear</button>' + separator + paperPickerHtml(key) + '</div>';
  }

  // ---------- paper themes ----------
  function savedPaper() {
    var paper = '';
    try { paper = localStorage.getItem(PAPER_KEY) || ''; } catch (e) {}
    return PAPERS.some(function (p) { return p[0] === paper; }) ? paper : '';
  }
  function paperClass(paper) { return paper ? ' paper paper-' + paper : ''; }
  function paperPickerHtml(key) {
    var current = savedPaper();
    return '<select class="nt-paper" id="nt-paper-' + FT.esc(key) + '" data-change="notes.paper" aria-label="Paper" title="Paper">' + PAPERS.map(function (p) {
      return '<option value="' + p[0] + '"' + (p[0] === current ? ' selected' : '') + '>' + p[1] + '</option>';
    }).join('') + '</select>';
  }
  /** The legal pad's handwriting font loads only when that paper is used. Until it arrives, and if it never does, the fallbacks in the CSS show. */
  function loadHandwritingFont() {
    if (document.getElementById('nt-hand-font')) return;
    var link = document.createElement('link');
    link.id = 'nt-hand-font'; link.rel = 'stylesheet'; link.href = HANDWRITING_FONT_URL;
    document.head.appendChild(link);
  }
  /** The paper is per device: every notes editor on screen takes it, and every picker shows it. */
  function applyPaper(paper) {
    if (paper === 'legal') loadHandwritingFont();
    editorsOnScreen().forEach(function (ed) {
      PAPERS.forEach(function (p) { if (p[0]) ed.classList.remove('paper-' + p[0]); });
      ed.classList.toggle('paper', !!paper);
      if (paper) ed.classList.add('paper-' + paper);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.nt-paper'), function (picker) { picker.value = paper; });
  }
  FT.on('change', 'notes.paper', function (el) {
    var paper = el.value;
    try { if (paper) localStorage.setItem(PAPER_KEY, paper); else localStorage.removeItem(PAPER_KEY); } catch (e) {}
    applyPaper(paper);
  });

  /** What the editor shows for a key: the notes' HTML from the Doc (or a draft), else the markdown. */
  function editorHtml(key) {
    return formatted[key] || FT.mdToHtml(cache[key] || '');
  }

  function savedHeight() { try { return localStorage.getItem(HEIGHT_KEY) || ''; } catch (e) { return ''; } }

  /**
   * One notes editor with its toolbar, resize bar and footer, for a project's notes (key: its id) or a note of the Notes
   * tab (key: its list id, opts.note). opts.name: the editor's spoken name. data-one-copy tells pop-out windows
   * (ui/popout.html) that only one copy of these notes may be on screen.
   */
  function blockHtml(key, opts) {
    opts = opts || {};
    if (opts.note) noteKeys[key] = true;
    var row = noteRow(key), ready = has(cache, key) || !row, height = savedHeight(), escapedKey = FT.esc(key);
    return '<div class="notes-panel' + (fullKey === key && narrow.matches ? ' full' : '') + '" id="nt-panel-' + escapedKey + '" data-project="' + escapedKey + '"' + (opts.note ? ' data-note="1"' : '') + ' data-one-copy="note:' + escapedKey + '">' +
      '<div class="notes-top">' + toolbarHtml(key) + '<button class="btn primary notes-done" type="button" data-act="notes.done" data-project="' + escapedKey + '">Done</button></div>' +
      '<div class="rtedit notes-edit' + (height ? ' sized' : '') + paperClass(savedPaper()) + '" id="nt-text-' + escapedKey + '" data-project="' + escapedKey + '" contenteditable="' + (ready ? 'true' : 'false') + '" role="textbox" aria-multiline="true" aria-label="' + FT.esc(opts.name || 'Notes') + '"' +
      (height ? ' style="--nt-h:' + FT.esc(height) + '"' : '') + ' data-placeholder="' + (ready ? PLACEHOLDER : 'Loading…') + '">' + editorHtml(key) + '</div>' +
      '<div class="nt-grip" id="nt-grip-' + escapedKey + '" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to make the notes taller or shorter" aria-label="Resize notes. Drag, or press the up and down arrow keys."></div>' +
      '<div class="notes-foot"><span class="nt-status" id="nt-status-' + escapedKey + '"></span><span class="nt-right">' +
      '<button type="button" class="nt-copy" data-act="notes.copy" data-project="' + escapedKey + '">Copy as markdown</button>' +
      '<a class="nt-link" id="nt-link-' + escapedKey + '" href="' + FT.esc(row && row.doc ? row.doc : '') + '" target="_blank" rel="noopener noreferrer"' + (row && row.doc ? '' : ' hidden') + '>Open in Docs</a></span></div></div>';
  }

  /** The Notes panel on a project's page. */
  function projectPageHtml(project) {
    return '<section class="panel notes-host"><div class="label">Notes</div>' + blockHtml(project.id, { name: 'Notes' }) + '</section>';
  }

  // ---------- a project's notes as a panel of Today (on Today, or in a pill) and of the Notes tab ----------
  function projectsWithNotes() {
    return (FT.store.notes || []).filter(function (n) { return n.project_id && n.doc; }).map(function (n) {
      var project = FT.project(n.project_id);
      return project && project.status !== 'archived' ? { row: n, project: project } : null;
    }).filter(Boolean).sort(function (a, b) { return a.project.name.localeCompare(b.project.name); });
  }

  function projectNotesPanelHtml(project) {
    return '<section class="panel notes-host"><div class="tophead"><div class="label">' + FT.esc(project.name) + ' notes</div>' +
      '<button class="btn sm" data-act="notes.openProject" data-id="' + FT.esc(project.id) + '">Open project</button></div>' +
      blockHtml(project.id, { name: project.name + ' notes' }) + '</section>';
  }

  function projectNotesPanel(entry) {
    var project = entry.project;
    return { id: PROJECT_NOTES_PANEL + project.id, kind: 'note', title: project.name + ' notes', short: project.name,
      description: 'The project\'s notes, the same Google Doc as on its page.', w: 7, html: projectNotesPanelHtml(project) };
  }

  /** Today: the projects' notes marked for it. A pill: any project's notes. Add feature: those not on Today yet. */
  function projectNotesOnToday() { return projectsWithNotes().filter(function (e) { return e.row.show_today; }).map(projectNotesPanel); }
  function projectNotesForPills() { return projectsWithNotes().filter(function (e) { return !e.row.show_today; }).map(projectNotesPanel); }
  function addableProjectNotes() {
    return projectsWithNotes().filter(function (e) { return !e.row.show_today; }).map(function (e) {
      return { id: PROJECT_NOTES_PANEL + e.project.id, panel: PROJECT_NOTES_PANEL + e.project.id, title: e.project.name + ' notes',
        description: 'The project\'s notes, shown on Today as their own panel.', add: function () { showOnToday(e.row, true); } };
    });
  }
  /** The Notes tab, with project notes shown: one panel per project that has notes. */
  function projectNotesForTab() {
    return projectsWithNotes().map(function (e) { return Object.assign(projectNotesPanel(e), { w: 6 }); });
  }

  function showOnToday(row, on) {
    var before = row.show_today;
    FT.optimistic(function () { row.show_today = on ? 'yes' : ''; return function () { row.show_today = before; }; },
      function () { return FT.rpc('notes', 'setShowToday', { projectId: row.project_id, on: on }, { render: false }); }).catch(function () {});
  }
  FT.action('notes.openProject', function (el) { FT.go('project', { id: el.dataset.id }); });

  /** The Doc exists: keep its address on the notes row and the project, and show "Open in Docs". */
  function setDocLink(key, url) {
    var row = noteRow(key);
    if (row) row.doc = url;
    var project = isNote(key) ? null : FT.project(key);
    if (project) project.notes = url;
    partsFor(key, '.nt-link').forEach(function (link) { link.href = url; link.hidden = false; });
  }

  function status(key, text) {
    partsFor(key, '.nt-status').forEach(function (el) { el.textContent = text; });
  }

  /** Put the cached text in the editors of these notes, if they are on screen. */
  function show(key) {
    editorsFor(key).forEach(function (el) {
      el.innerHTML = editorHtml(key); el.setAttribute('contenteditable', 'true');
      el.dataset.placeholder = PLACEHOLDER;
    });
  }

  /** The version this browser now holds, kept on the notes row too (the offline queue checks against it). */
  function holdVersion(key, r) {
    loaded[key] = r.updated || '';
    var row = noteRow(key);
    if (row) row.updated = r.updated;
    else if (r.url) {
      var note = isNote(key);
      FT.store.notes = (FT.store.notes || []).concat([{ project_id: note ? '' : key, list_id: note ? key : '', url: r.url, updated: r.updated, doc: r.url, show_today: '' }]);
    }
    if (r.url) setDocLink(key, r.url);
  }

  /** Markdown for editor HTML (drafts and comparisons work on it, and Copy as markdown gives it). */
  function markdownOf(html) {
    var box = document.createElement('div');
    box.innerHTML = html || '';
    return FT.htmlToMd(box);
  }

  /** Notes from the Doc (a load, or the newer text a conflict kept) become what this page holds. */
  function takeDocNotes(key, html) {
    formatted[key] = html || '';
    cache[key] = markdownOf(html);
  }

  function retryLater(key) {
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () { save(key); }, RETRY_MS[Math.min(failures[key] - 1, RETRY_MS.length - 1)]);
  }

  /**
   * Send the notes. One save per key at a time: each carries the version it builds on (_base), so a page left open on
   * another device cannot write old notes over newer ones (the server keeps both, see notes/server.js). A failed save
   * says so and tries again; the draft stays on the device until the server has the text.
   */
  function save(key) {
    clearTimeout(timers[key]);
    if (!key || !dirty[key] || saving[key]) return;
    var text = cache[key] || '';
    dirty[key] = false; saving[key] = true;
    status(key, 'Saving…');
    var args = Object.assign(argsFor(key), { text: text, html: formatted[key] || FT.mdToHtml(text), _base: has(loaded, key) ? loaded[key] : '', _editedAt: edited[key] || new Date().toISOString() });
    FT.rpc('notes', 'save', args, { render: false, quiet: true, mode: modeOf[key] })
      .then(function (r) {
        saving[key] = false; failures[key] = 0;
        if (!r) { status(key, 'Saved on this device'); if (dirty[key]) save(key); return; } // waiting offline, sent later
        holdVersion(key, r);
        if (r.conflict) {
          FT.toast('These notes were also changed elsewhere (another device or Google Docs). Both are kept: ' + (r.conflict.kept === 'server' ? 'the newer text is shown, yours' : 'yours is shown, the other text') +
            ' is saved as the Doc "' + r.conflict.copyName + '" in the Notes folder.', 'error');
          if (r.conflict.kept === 'server' && !dirty[key]) { takeDocNotes(key, r.html); show(key); }
        }
        if (dirty[key]) { save(key); return; }
        if (readDraft(key) && readDraft(key).text === text) dropDraft(key);
        tellOtherWindows(key, r.updated);
        status(key, 'Saved');
      }, function (e) {
        saving[key] = false; dirty[key] = true;
        failures[key] = (failures[key] || 0) + 1;
        status(key, 'Not saved: ' + e.message);
        if (failures[key] === 1 || failures[key] % 3 === 0) {
          FT.toast('Notes not saved: ' + e.message + ' Trying again; the text is kept on this device.', 'error', { label: 'Retry now', run: function () { save(key); } });
        }
        retryLater(key);
      });
  }

  /** Other windows of this browser with the same notes open load them again (storage event), instead of meeting a conflict later. */
  function tellOtherWindows(key, version) {
    try { localStorage.setItem(SAVED_KEY + (modeOf[key] || FT.state.mode) + '.' + key, JSON.stringify({ updated: version, tab: tabId })); } catch (e) {}
  }
  window.addEventListener('storage', function (e) {
    var prefix = SAVED_KEY + FT.state.mode + '.';
    if (!e.key || e.key.indexOf(prefix) !== 0 || !e.newValue) return;
    var key = e.key.slice(prefix.length), info;
    try { info = JSON.parse(e.newValue); } catch (err) { return; }
    if (!info || info.tab === tabId || !has(cache, key) || info.updated === loaded[key]) return;
    if (dirty[key] || saving[key]) return; // typing here too: the save meets the other text on the server and both are kept
    load(key);
  });

  /** Save every key's notes now, for example when the page is hidden or closing. */
  function saveAll() {
    Object.keys(dirty).forEach(function (key) { if (dirty[key]) save(key); });
  }
  FT.onLeave(saveAll);

  // A change that waited offline was sent later: the version it produced is the base for the next save.
  document.addEventListener('ft:saved', function (e) {
    var d = e.detail || {};
    if (d.key !== 'notes.save' || !d.version) return;
    var key = d.args.listId || d.args.projectId;
    loaded[key] = d.version;
    if (!dirty[key] && !saving[key] && cache[key] === d.args.text) { dropDraft(key); status(key, 'Saved'); }
  });

  /**
   * Load notes from their Doc, also when this page already has them: an edit made in Google Docs or on another device
   * shows up (the server answers { same: true } without reading the Doc when nothing changed). Nothing replaces what
   * is being typed. A draft left on this device by a page that closed before saving is put back and saved.
   */
  function load(key) {
    var seq = loads[key] = (loads[key] || 0) + 1;
    var hadNotes = has(cache, key), before = cache[key];
    modeOf[key] = modeOf[key] || FT.state.mode;
    var args = argsFor(key);
    if (hadNotes && loaded[key]) args.known = loaded[key];
    FT.rpc('notes', 'get', args, { render: false, quiet: true, parallel: true, mode: modeOf[key] }).then(function (r) {
      if (seq !== loads[key] || dirty[key] || saving[key]) return; // a newer load, or typing: keep what is on screen
      if (r.same) return;
      takeDocNotes(key, r.html);
      holdVersion(key, r);
      var restore = draftToRestore(key), draft = restore && restore.draft;
      if (draft && draft.text !== cache[key]) {
        cache[key] = draft.text; formatted[key] = draft.html || ''; loaded[key] = draft.base || ''; edited[key] = draft.at; dirty[key] = true;
        if (restore.tab !== tabId) { dropDraft(key, restore.tab); keepDraft(key); } // this window saves it now
      } else if (draft) dropDraft(key, restore.tab);
      show(key);
      if (dirty[key]) save(key);
      else if (hadNotes && cache[key] !== before) status(key, 'Updated from the Google Doc');
    }).catch(function (e) { FT.toast('Could not load notes: ' + e.message, 'error'); });
  }

  /** Notes come on screen (a project page, a note of the Notes tab, a panel on Today): load them from the Doc, unless typing. */
  function opened(key) {
    modeOf[key] = modeOf[key] || FT.state.mode;
    if (!dirty[key] && !saving[key]) load(key);
  }

  FT.module({
    id: 'notes',
    slots: {
      'project.page': [{ id: 'notes', title: 'Notes', description: 'Free notes, kept as the project\'s Google Doc.', order: 20, span: 'half', render: projectPageHtml }],
      'today.panels': [{ order: 30, render: projectNotesOnToday }],
      'today.pillPanels': [{ order: 30, render: projectNotesForPills }],
      'addable.today': [{ order: 30, render: addableProjectNotes }],
      'lists.tab': [{ order: 10, render: projectNotesForTab }]
    },
    onProject: opened
  });

  /** For the lists module: a note of the Notes tab drawn inside its panel. */
  FT.notes = { blockHtml: function (listId, name) { return blockHtml(listId, { note: true, name: name }); } };

  // Editors are rebuilt when the page redraws, so the markdown shortcuts are attached after every draw.
  FT.onRender(function () {
    var keys = [];
    editorsOnScreen().forEach(function (el) {
      var key = el.dataset.project;
      if (keys.indexOf(key) === -1) keys.push(key);
      var panel = el.closest('.notes-panel');
      if (panel && panel.dataset.note) noteKeys[key] = true;
      if (el.classList.contains('paper-legal')) loadHandwritingFont();
      if (!el.dataset.md) { el.dataset.md = '1'; FT.richShortcuts(el); FT.headingKeys(el); }
    });
    // Leaving notes finishes editing them: they are saved now. New ones on screen load (a project page loads its own notes).
    onScreen.forEach(function (key) { if (keys.indexOf(key) === -1) save(key); });
    keys.forEach(function (key) {
      if (onScreen.indexOf(key) === -1 && !(FT.state.view === 'project' && key === FT.state.projectId)) opened(key);
    });
    onScreen = keys;
    if (fullKey && keys.indexOf(fullKey) === -1) { fullKey = null; if (fullEntry) { fullEntry = false; FT.popHistory(); } }
    if (fullKey && narrow.matches) fitToScreen();
  });

  document.addEventListener('input', function (e) {
    if (!isEditor(e.target)) return;
    var key = e.target.dataset.project;
    modeOf[key] = modeOf[key] || FT.state.mode;
    cache[key] = FT.htmlToMd(e.target); formatted[key] = e.target.innerHTML; dirty[key] = true; edited[key] = new Date().toISOString();
    keepDraft(key); status(key, 'Editing…');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () { save(key); }, 1200);
  });
  document.addEventListener('focusout', function (e) {
    if (isEditor(e.target)) save(e.target.dataset.project);
  });
  // Pasted text goes in as plain text, so it cannot bring in another page's styles.
  document.addEventListener('paste', function (e) {
    if (!isEditor(e.target)) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // Toolbar buttons keep the text selection, like the card editor's.
  document.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('.nt-bar button')) e.preventDefault(); });
  /** The block the cursor is in, if it is one the toolbar makes, or a list item (where headings do not belong). */
  function blockAtCursor(ed) {
    var sel = window.getSelection(), node = sel && sel.anchorNode;
    while (node && node !== ed) {
      if (node.nodeType === 1 && /^(H[1-6]|BLOCKQUOTE|LI)$/.test(node.tagName)) return node.tagName.toLowerCase();
      node = node.parentNode;
    }
    return '';
  }

  /** formatBlock's value for a heading or quote button: the same button again turns the line back into normal text. null: not in a list. */
  function blockFormatFor(ed, wanted) {
    var current = blockAtCursor(ed);
    if (current === 'li' && wanted !== 'p') return null;
    return '<' + (current === wanted ? 'p' : wanted) + '>'; // Chrome takes "h2" too, Safari and Firefox need the brackets
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.nt-bar button');
    var ed = btn && editorBeside(btn);
    if (!ed) return;
    var command = btn.dataset.cmd, value = btn.dataset.val || null;
    ed.focus();
    if (command === 'formatBlock') {
      value = blockFormatFor(ed, value);
      if (!value) { FT.toast('Headings and quotes do not work inside a list. Put the cursor on a normal line.'); return; }
    }
    try { document.execCommand('styleWithCSS', false, command === 'hiliteColor'); } catch (err) {}
    document.execCommand(command, false, value);
    ed.dispatchEvent(new Event('input', { bubbles: true }));
  });
  // Links open with Cmd or Ctrl + click, so a plain click still places the cursor to edit the text.
  document.addEventListener('click', function (e) {
    var link = e.target.closest && e.target.closest('.notes-edit a[href]');
    if (link && (e.metaKey || e.ctrlKey)) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
  });
  // An empty editor would take the first line as bare text, which a heading cannot format. Start it with a line block.
  document.addEventListener('focusin', function (e) {
    var ed = e.target;
    if (!isEditor(ed) || ed.getAttribute('contenteditable') !== 'true') return;
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (err) {}
    if (ed.firstChild) return;
    ed.innerHTML = '<p><br></p>';
    var range = document.createRange();
    range.setStart(ed.firstChild, 0); range.collapse(true);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  });

  // ---------- copy as markdown ----------
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    // The Apps Script frame may refuse the clipboard API; a hidden textarea and the old copy command still work.
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text; area.setAttribute('readonly', ''); area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(area); area.select();
      var copied = false;
      try { copied = document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(area);
      if (copied) resolve(); else reject(new Error('copy blocked'));
    });
  }

  FT.action('notes.copy', function (el) {
    var ed = editorBeside(el);
    if (!ed) return;
    copyText(FT.htmlToMd(ed)).then(function () { FT.toast('Notes copied as markdown'); })
      .catch(function () { FT.toast('Could not copy. Select the text and copy it by hand.', 'error'); });
  });

  // ---------- resize: the bar under an editor sets its height, and the height is kept in this browser ----------
  var MIN_HEIGHT = 120, MAX_HEIGHT = 3000, KEY_STEP = 40;
  var drag = null; // { startY, startHeight, grip, editor } while a bar is being dragged

  function setHeight(ed, px) {
    if (!ed) return;
    var height = Math.round(Math.min(Math.max(px, MIN_HEIGHT), MAX_HEIGHT)) + 'px';
    ed.classList.add('sized');
    ed.style.setProperty('--nt-h', height);
    try { localStorage.setItem(HEIGHT_KEY, height); } catch (e) {}
  }

  document.addEventListener('pointerdown', function (e) {
    var grip = e.target.closest && e.target.closest('.nt-grip'), ed = grip && editorBeside(grip);
    if (!ed) return;
    drag = { startY: e.clientY, startHeight: ed.offsetHeight, grip: grip, editor: ed };
    grip.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) { if (drag) setHeight(drag.editor, drag.startHeight + e.clientY - drag.startY); });
  function endDrag() { if (drag) { drag.grip.classList.remove('dragging'); drag = null; } }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', function (e) {
    if (!e.target || !e.target.classList || !e.target.classList.contains('nt-grip') || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var ed = editorBeside(e.target);
    if (ed) setHeight(ed, ed.offsetHeight + (e.key === 'ArrowDown' ? KEY_STEP : -KEY_STEP));
  });

  // Phone: tapping into notes opens them full screen.
  function fitToScreen() {
    var p = document.querySelector('.notes-panel.full'), vv = window.visualViewport;
    if (p) p.style.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitToScreen); window.visualViewport.addEventListener('scroll', fitToScreen); }
  document.addEventListener('focusin', function (e) {
    if (!isEditor(e.target) || !narrow.matches || fullKey) return;
    var p = e.target.closest('.notes-panel');
    if (!p) return;
    fullKey = e.target.dataset.project; p.classList.add('full'); fitToScreen(); window.scrollTo(0, 0);
    fullEntry = FT.pushHistory();
  });
  function closeFull() {
    var key = fullKey;
    fullKey = null;
    Array.prototype.forEach.call(document.querySelectorAll('.notes-panel.full'), function (p) { p.classList.remove('full'); });
    editorsFor(key).forEach(function (ed) { ed.blur(); });
    save(key);
  }
  FT.action('notes.done', function () {
    closeFull();
    if (fullEntry) { fullEntry = false; FT.popHistory(); }
  });
  // The phone's back button closes the full screen editor instead of leaving the page.
  FT.onBack(function () {
    if (!fullKey) return false;
    fullEntry = false;
    closeFull();
    return true;
  });
})();
</script>

<style>
.lists { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.listhead { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.listhead .listname { flex: 1 1 160px; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 5px 8px; background: transparent; border-color: transparent; }
.listhead .listname:hover, .listhead .listname:focus { background: var(--surface); border-color: var(--line); }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); cursor: pointer; margin-top: 14px; }
.toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.listpanel .board.vertical { gap: 8px; }
.listpanel .col { min-height: 0; }
/* A list's colour tints its panel and groups, on the Lists tab and on Today. */
/* A list's colour: a solid bar along the top, a clear tint on the panel and a stronger one on its groups. */
.listpanel.tinted { background: color-mix(in srgb, var(--list-c) 14%, var(--surface)); border-color: var(--list-c); border-top: 6px solid var(--list-c); }
.listpanel.tinted .col { background: color-mix(in srgb, var(--list-c) 24%, var(--surface)); }
.listpanel.tinted .label { color: color-mix(in srgb, var(--list-c) 70%, var(--ink)); font-weight: 600; }
.listgear { flex: none; }
.listpreview { margin-top: 6px; padding: 14px; pointer-events: none; }
.listpreview .kcard { margin-bottom: 6px; }
</style>
<script>
(function () {
  var COLORS = [['', 'No colour'], ['1', 'Teal'], ['2', 'Amber'], ['3', 'Blue'], ['4', 'Red'], ['5', 'Purple'], ['6', 'Green'], ['7', 'Grey'], ['8', 'Orange']];

  function lists() { return FT.store.lists || []; }

  /** Opening tag of a list's panel, tinted with its colour. */
  function panelOpen(l) {
    return l.color ? '<section class="panel listpanel tinted" style="--list-c: var(--cat-' + FT.esc(l.color) + ')">' : '<section class="panel listpanel">';
  }

  function gearButton(l) {
    return '<button class="btn sm listgear" data-act="lists.settings" data-id="' + FT.esc(l.id) + '" aria-label="Settings for ' + FT.esc(l.name) + '">⚙ Settings</button>';
  }

  function listPanel(l) {
    var id = FT.esc(l.id);
    return panelOpen(l) + '<div class="listhead">' +
      '<input type="text" class="listname" value="' + FT.esc(l.name) + '" aria-label="List name" data-change="lists.rename" data-id="' + id + '">' +
      gearButton(l) +
      '<button class="rm" data-act="lists.remove" data-id="' + id + '" aria-label="Delete list ' + FT.esc(l.name) + '">Delete</button></div>' +
      FT.kanban.boardHtml(l.id, { vertical: true, word: 'group' }) + '</section>';
  }

  function tabHtml() {
    var all = lists();
    var head = '<section class="panel"><div class="tophead"><div class="label">Lists</div><button class="btn sm primary" data-act="lists.add">+ New list</button></div>' +
      (all.length ? '<p class="empty" style="padding:0">Lists are for things that are not projects: reading, ideas, things to keep in mind. Use ⚙ Settings to colour a list or show it on the Today tab.</p>'
                  : '<p class="empty">No lists yet. Make one for reading, ideas or things to keep in mind.</p>') + '</section>';
    return FT.layout('lists', [{ id: 'head', title: 'Lists intro', html: head, w: 12 }].concat(all.map(function (l) {
      return { id: 'list-' + l.id, title: l.name, html: listPanel(l), w: 6 };
    })));
  }

  /** On Today, each list shows as its own panel, without the list controls. */
  function todayPanels() {
    return lists().filter(function (l) { return l.show_today; }).map(function (l) {
      return {
        id: 'list-' + l.id, title: l.name, w: 6,
        html: panelOpen(l) + '<div class="tophead"><div class="label">' + FT.esc(l.name) + '</div>' + gearButton(l) + '</div>' +
          FT.kanban.boardHtml(l.id, { vertical: true, word: 'group' }) + '</section>'
      };
    });
  }

  FT.module({
    id: 'lists',
    tab: { title: 'Lists', order: 25, render: tabHtml },
    slots: { 'today.panels': [{ order: 10, render: todayPanels }] }
  });

  FT.action('lists.open', function () { FT.go('lists'); });

  FT.action('lists.add', function () {
    FT.dialog({
      title: 'New list',
      submit: 'Create list',
      fields: [{ id: 'name', label: 'Name', placeholder: 'e.g. Read and watch' }],
      onSubmit: function (v) { return FT.rpc('lists', 'create', { name: v.name }, { quiet: true }); }
    });
  });

  FT.on('change', 'lists.rename', function (el) {
    var name = el.value.trim();
    if (!name) { FT.render(); return; }
    FT.rpc('lists', 'rename', { id: el.dataset.id, name: name }, { render: false }).catch(function () { FT.reload(); });
  });

  // ---------- list settings: name, colour (with a live preview) and Show on Today ----------
  function swatchesHtml(current) {
    return '<label>Colour</label><div class="swatches" role="radiogroup" aria-label="List colour">' + COLORS.map(function (c) {
      return '<label title="' + c[1] + '"><input type="radio" name="dlg-listcolor" value="' + c[0] + '"' + ((current || '') === c[0] ? ' checked' : '') + ' aria-label="' + c[1] + '">' +
        '<span class="' + (c[0] ? '' : 'none') + '"' + (c[0] ? ' style="--c: var(--cat-' + c[0] + ')"' : '') + '></span></label>';
    }).join('') + '</div>';
  }

  /** A small copy of the list as it will look, with its real first items. */
  function previewHtml(l) {
    var k = FT.store.kanban || { columns: [], tasks: [] };
    var group = k.columns.filter(function (c) { return c.project_id === l.id; }).sort(function (a, b) { return a.order - b.order; })[0];
    var items = group ? k.tasks.filter(function (t) { return t.column_id === group.id; }).sort(function (a, b) { return a.order - b.order; }).slice(0, 2) : [];
    if (!items.length) items = [{ title: 'An item' }, { title: 'Another item' }];
    return '<label>Preview</label><section class="panel listpanel listpreview" id="dlg-listpreview" aria-hidden="true">' +
      '<div class="label" id="dlg-previewname">' + FT.esc(l.name) + '</div><div class="col"><div class="colhead"><span class="colname">' + FT.esc(group ? group.name : 'Items') + '</span></div>' +
      items.map(function (t) { return '<div class="kcard"><span class="kt">' + FT.esc(t.title) + '</span></div>'; }).join('') + '</div></section>';
  }

  function showPreview(color) {
    var preview = document.getElementById('dlg-listpreview');
    if (!preview) return;
    preview.classList.toggle('tinted', !!color);
    if (color) preview.style.setProperty('--list-c', 'var(--cat-' + color + ')'); else preview.style.removeProperty('--list-c');
  }

  FT.action('lists.settings', function (el) {
    var l = lists().filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!l) return;
    FT.dialog({
      title: 'List settings',
      wide: true,
      fields: [{ id: 'listname', label: 'Name', value: l.name }],
      after: swatchesHtml(l.color) + previewHtml(l) +
        '<label class="toggle"><input type="checkbox" id="dlg-showtoday"' + (l.show_today ? ' checked' : '') + '> Show this list on Today</label>',
      onOpen: function () {
        showPreview(l.color || '');
        Array.prototype.forEach.call(document.querySelectorAll('input[name="dlg-listcolor"]'), function (radio) {
          radio.addEventListener('change', function () { showPreview(radio.value); });
        });
        document.getElementById('dlg-listname').addEventListener('input', function (e) {
          document.getElementById('dlg-previewname').textContent = e.target.value;
        });
      },
      onSubmit: function (v) {
        if (!v.listname) throw new Error('A list needs a name.');
        var picked = document.querySelector('input[name="dlg-listcolor"]:checked');
        var color = picked ? picked.value : '', showToday = document.getElementById('dlg-showtoday').checked;
        var changes = [];
        if (v.listname !== l.name) changes.push(['rename', { id: l.id, name: v.listname }]);
        if (color !== (l.color || '')) changes.push(['setColor', { id: l.id, color: color }]);
        if (showToday !== !!l.show_today) changes.push(['showToday', { id: l.id, on: showToday }]);
        // Shown at once, saved in the background.
        l.name = v.listname.slice(0, 80); l.color = color; l.show_today = showToday ? 'yes' : '';
        FT.render();
        changes.forEach(function (c) { FT.rpc('lists', c[0], c[1], { render: false }).catch(FT.saveFailed); });
      }
    });
  });

  FT.action('lists.remove', function (el) {
    var l = lists().filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!l) return;
    FT.dialog({
      title: 'Delete list',
      body: '<p>Delete "' + FT.esc(l.name) + '" and everything in it? You can undo this.</p>',
      submit: 'Delete list', danger: true,
      onSubmit: function () { return FT.rpc('lists', 'remove', { id: l.id }, { quiet: true }).then(function () { FT.deleted('List'); }); }
    });
  });
})();
</script>

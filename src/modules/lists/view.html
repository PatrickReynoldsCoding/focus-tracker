<script>
/**
 * The Notes tab (module id 'lists', page key 'lists'), like Google Keep: every row of the Lists tab in its order as a

 * (FT.todos.bodyHtml) or the notes editor (FT.notes.blockHtml), with the name, colour, On Today, ⚙ Settings and Delete.
 * Cards are dragged into a new order (a long press on a phone), saved as the lists' `order` (lists.move).
 * Any of them can be shown on Today (show_today), put in a phone's pill, or linked to a project, whose page then shows it.
 * FT.lists.create makes one on screen at once and saves it behind (+ New here, and Today settings' pill sheet).

  // What each kind is called, and the first group a new one gets (as lists/server.js and FIRST_TODO_GROUP_ make them).

    todo: { noun: 'to-do list', title: 'To-do list', firstGroup: 'General', panelKind: 'todo' },

  var ON_TODAY = 'today';

  function lists() { return FT.store.lists || []; }
  function kindOf(l) { return KINDS[l.kind || ''] ? l.kind || '' : LIST; }
  function kindWords(l) { return KINDS[kindOf(l)]; }
  function byId(id) { return lists().filter(function (x) { return x.id === id; })[0]; }

  var PANEL_CLASS_BY_KIND = { '': ' plainlist', todo: ' todos-panel', note: ' notelist-panel' };

  /** Opening tag of a list's panel, tinted with its colour. */
  function panelOpen(l) {
    var classes = 'panel listpanel' + PANEL_CLASS_BY_KIND[kindOf(l)];
    return l.color ? '<section class="' + classes + ' tinted" style="--list-c: var(--cat-' + FT.esc(l.color) + ')">' : '<section class="' + classes + '">';
  }

  /** What a panel holds below its head, by kind. where: 'today' on Today and in pills; 'tab' or 'project' elsewhere. */
  function bodyHtml(l, where) {
    var kind = kindOf(l);
    // A module this mode loads has a slice in the store.
    if (kind === TODO) return FT.todos && FT.store.todos ? FT.todos.bodyHtml(l, where) : missingHtml('To-dos');
    if (kind === NOTE) return FT.notes && FT.store.notes ? FT.notes.blockHtml(l.id, l.name) : missingHtml('Notes');
    return FT.kanban.boardHtml(l.id, { vertical: true, word: 'group' });
  }

  function missingHtml(feature) {
    return '<p class="empty">The ' + feature + ' feature is not installed in this mode.</p>';
  }

  // ---------- one item at a time (Today) ----------
  // Per list: the shuffled order of its item ids, where we are in it, and when that item came up.
  // Kept in memory, so a redraw keeps the same item; a new shuffle starts once every item has been shown.
  var rotations = {};

  function itemsOf(l) {
    var k = FT.store.kanban || { columns: [], tasks: [] };
    return k.tasks.filter(function (t) { return t.owner === l.id; });
  }

  function shuffle(ids) {
    var out = ids.slice();
    for (var i = out.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = out[i]; out[i] = out[j]; out[j] = t; }
    return out;
  }

  /** The list's rotation, brought up to date with its items (added items join, removed ones leave). */
  function rotationOf(l) {
    var ids = itemsOf(l).map(function (t) { return t.id; });
    var r = rotations[l.id];
    if (!r) r = rotations[l.id] = { order: shuffle(ids), at: 0, since: Date.now() };
    var current = r.order[r.at];
    r.order = r.order.filter(function (id) { return ids.indexOf(id) !== -1; })
      .concat(shuffle(ids.filter(function (id) { return r.order.indexOf(id) === -1; })));
    var still = r.order.indexOf(current);
    r.at = still !== -1 ? still : Math.min(r.at, Math.max(r.order.length - 1, 0));
    return r;
  }

  function secondsOf(l) { return l.seconds >= 5 ? l.seconds : DEFAULT_SECONDS; }

  function quoteBodyHtml(l, r) {
    var task = (FT.store.kanban.tasks || []).filter(function (t) { return t.id === r.order[r.at]; })[0];
    if (!task) return '<p class="empty" style="padding:0">No items yet. Add some on the Notes tab.</p>';
    return '<blockquote role="button" tabindex="0" data-act="kanban.open-card" data-id="' + FT.esc(task.id) + '" title="Open this item"><span class="rq">' + FT.linkify(task.title) + '</span></blockquote>' +
      (task.note_html ? '<div class="rotdesc">' + task.note_html + '</div>' : '');
  }

  function quotePanelHtml(l) {
    var r = rotationOf(l), count = r.order.length;
    var style = l.color ? ' style="--rot-c: var(--cat-' + FT.esc(l.color) + ')"' : '';
    return '<section class="panel rotq" data-owner="' + FT.esc(l.id) + '" data-word="group" data-rotate="' + FT.esc(l.id) + '"' + style + '>' +
      '<div class="rothead"><div class="label">✦ ' + FT.esc(l.name) + '</div><span><span class="pos" data-pos>' + (count ? (r.at + 1) + ' / ' + count : '') + '</span> ' + gearButton(l) + '</span></div>' +
      '<div class="rotbody" data-rotbody>' + quoteBodyHtml(l, r) + '</div>' +
      (count > 1 ? '<span class="arrows"><button data-act="lists.rotate" data-id="' + FT.esc(l.id) + '" data-d="-1" aria-label="Previous item">‹</button>' +
        '<button data-act="lists.rotate" data-id="' + FT.esc(l.id) + '" data-d="1" aria-label="Next item">›</button></span>' : '') + '</section>';
  }

  /** Move a list's quote card on by d items, fading the text, without redrawing the rest of the page. */
  function rotate(l, d) {
    var r = rotationOf(l), count = r.order.length;
    if (count < 2) return;
    r.at += d;
    if (r.at >= count) { r.order = shuffle(r.order); r.at = 0; }
    if (r.at < 0) r.at = count - 1;
    r.since = Date.now();
    var panel = document.querySelector('[data-rotate="' + l.id + '"]');
    if (!panel) return;
    var body = panel.querySelector('[data-rotbody]');
    body.classList.add('out');
    setTimeout(function () {
      body.innerHTML = quoteBodyHtml(l, r);
      panel.querySelector('[data-pos]').textContent = (r.at + 1) + ' / ' + count;
      body.classList.remove('out');
      FT.fitPanel(panel);
    }, 300);
  }

  setInterval(function () {
    if (FT.state.dragging || document.querySelector('.dialog') || document.documentElement.dataset.theme === 'eink') return; // e-ink: no self-changing screen; use ‹ ›
    Array.prototype.forEach.call(document.querySelectorAll('#app [data-rotate], #popRoot [data-rotate]'), function (panel) {
      var l = byId(panel.dataset.rotate);
      if (l && Date.now() - rotationOf(l).since >= secondsOf(l) * 1000) rotate(l, 1);
    });
  }, 1000);

  function gearButton(l) {
    return '<button class="btn sm listgear" data-act="lists.settings" data-id="' + FT.esc(l.id) + '" aria-label="Settings for ' + FT.esc(l.name) + '">⚙ Settings</button>';
  }

  /** "Project notes" on the Notes tab: on unless turned off, per mode. */
  function projectNotesShown() {
    var view = (FT.store.layout || {})[VIEW_KEY] || {};
    return view.projectNotes !== PROJECT_NOTES_OFF;
  }

  // ---------- the Notes tab: a grid of cards ----------
  var PROJECT_NOTES = 'pnote';
  var narrow = window.matchMedia('(max-width: 760px)');
  var CARD_LINES_ON_A_PHONE = 4, CARD_LINES = 6;
  var CARD_MIN_WIDTH = 220, CARD_GAP = 12, MOST_COLUMNS = 6, COLUMNS_ON_A_PHONE = 2, COLUMNS_WHEN_THE_WIDTH_IS_UNKNOWN = 4;
  var KIND_LABELS = { '': '☰ List', todo: '☑ To-do list', note: '✎ Note', pnote: '◧ Project notes' };
  var FILTERS = [['all', 'All'], ['note', 'Notes'], ['list', 'Lists'], ['todo', 'To-do lists'], ['today', 'On Today']];
  var KINDS_BY_FILTER = { note: [NOTE, PROJECT_NOTES], list: [LIST], todo: [TODO] };
  var NEW_MENU = [[NOTE, '✎', 'Note', 'A Google Doc of its own'], [LIST, '☰', 'List', 'Items in groups'], [TODO, '☑', 'To-do list', 'Tick off, with days']];
  var NEW_NAMES = { note: 'New note', '': 'New list', todo: 'New to-do list' };
  var CONTENT_CLASS_BY_KIND = { '': 'nx-list', todo: 'nx-todo', note: 'nx-note', pnote: 'nx-note' };
  var SEARCH_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>';
  var notesTab = { query: '', filter: 'all', menuOpen: false };

  function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }

  /** A row of the Lists tab as a card. */
  function rowCard(l) {
    return { id: l.id, key: l.id, kind: kindOf(l), title: l.name, row: l, onToday: !!l.show_today, color: l.color || '', project: l.project_id ? FT.project(l.project_id) : null };
  }

  /** Every card the tab can show, in order: the rows of the Lists tab by `order`, then the projects' notes when shown. */
  function allCards() {
    var rows = lists().slice().sort(byOrder).map(rowCard);
    var projectNotes = projectNotesShown() ? FT.slots('lists.tab').reduce(function (cards, s) { return cards.concat(s.render(FT) || []); }, []) : [];
    return rows.concat(projectNotes);
  }

  function cardById(id) { return allCards().filter(function (card) { return card.id === id; })[0] || null; }

  function inFilter(card, filter) {
    if (filter === 'today') return card.onToday;
    return !KINDS_BY_FILTER[filter] || KINDS_BY_FILTER[filter].indexOf(card.kind) !== -1;
  }

  function isNotes(card) { return card.kind === NOTE || card.kind === PROJECT_NOTES; }
  function notePreviewOf(card) { return FT.notes && FT.store.notes ? FT.notes.previewOf(card.key) : { text: '' }; }
  function todosOf(listId) { return ((FT.store.todos || {}).items || []).filter(function (t) { return t.list_id === listId; }); }

  /** What the search looks in: the name, the project, a list's items, a to-do list's to-dos, the notes text this page has. */
  function searchedText(card) {
    var words = [card.title, card.project ? card.project.name : ''];
    var entries = card.kind === LIST ? itemsOf(card.row) : card.kind === TODO ? todosOf(card.id) : [];
    entries.forEach(function (entry) { words.push(entry.title, entry.note || ''); });
    if (isNotes(card)) words.push(notePreviewOf(card).text || '');
    return words.join('\n').toLowerCase();
  }

  function isShown(card) {
    var query = notesTab.query.trim().toLowerCase();
    return inFilter(card, notesTab.filter) && (!query || searchedText(card).indexOf(query) !== -1);
  }

  /** Cards are dragged into a new order only while all of them show. */
  function canReorder() { return notesTab.filter === 'all' && !notesTab.query.trim(); }

  function tintStyle(color) { return color ? ' style="--card-c: var(--cat-' + FT.esc(color) + ')"' : ''; }

  function cardLines() { return narrow.matches ? CARD_LINES_ON_A_PHONE : CARD_LINES; }

  /** Up to the card's lines from each group in turn (group names when there are several), then "+N more" and "N done". */
  function groupedPreviewHtml(groups, total, doneToday, emptyWords, lineHtml) {
    var room = cardLines(), shown = 0, named = groups.length > 1, html = '';
    groups.forEach(function (group) {
      var lines = group.lines.slice(0, room - shown);
      if (!lines.length) return;
      html += (named ? '<div class="nx-group">' + FT.esc(group.name) + '</div>' : '') + '<ul class="nx-items">' + lines.map(lineHtml).join('') + '</ul>';
      shown += lines.length;
    });
    var counts = [];
    if (total > shown) counts.push('+' + (total - shown) + ' more');
    if (doneToday) counts.push(doneToday + ' done');
    return (html || '<p class="nx-more">' + emptyWords + '</p>') + (counts.length ? '<p class="nx-more">' + counts.join(' · ') + '</p>' : '');
  }

  function itemLineHtml(title) {
    return '<li><span class="nx-dot" aria-hidden="true"></span><span class="nx-line">' + FT.esc(title) + '</span></li>';
  }

  /** A to-do on a card: its tick box sends the same tick as the to-do list's panel (todos.tick). */
  function todoLineHtml(todo) {
    return '<li><label class="nx-tick" title="Tick off"><input type="checkbox" data-change="todos.tick" data-id="' + FT.esc(todo.id) + '" aria-label="Done: ' + FT.esc(todo.title) + '"></label>' +
      '<span class="nx-line">' + (todo.day ? '<span class="nx-day">' + FT.esc(todo.day) + '</span>' : '') + FT.esc(todo.title) + '</span></li>';
  }

  function listPreviewHtml(l) {
    var groups = ((FT.store.kanban || {}).columns || []).filter(function (c) { return c.owner === l.id; }).sort(byOrder), items = itemsOf(l);
    var lines = groups.map(function (group) {
      return { name: group.name, lines: items.filter(function (t) { return t.column_id === group.id; }).sort(byOrder).map(function (t) { return t.title; }) };
    });
    return groupedPreviewHtml(lines, items.length, 0, 'Empty list', itemLineHtml);
  }

  function todoPreviewHtml(l) {
    if (!FT.todos || !FT.store.todos) return missingHtml('To-dos');
    var preview = FT.todos.cardPreview(l);
    var groups = preview.groups.map(function (group) { return { name: group.name, lines: group.todos }; });
    return groupedPreviewHtml(groups, preview.open, preview.doneToday, preview.doneToday ? 'All done' : 'Nothing to do', todoLineHtml);
  }

  /** The first lines of notes; quiet grey lines while nobody has them yet (the page asks for them, askForWaitingPreviews). */
  function notePreviewHtml(preview) {
    if (preview.waiting) return '<div class="nx-skel" role="img" aria-label="Loading the first lines"><i></i><i></i><i></i></div>';
    return preview.text ? '<p class="nx-text">' + FT.esc(preview.text) + '</p>' : '<p class="nx-more">Empty note</p>';
  }

  function cardFootHtml(card) {
    return '<div class="nx-cfoot"><span class="nx-kind">' + KIND_LABELS[card.kind] + '</span>' +
      (card.project ? '<span class="nx-badge proj">' + FT.esc(card.project.name) + '</span>' : '') +
      (card.onToday ? '<span class="nx-badge">On Today</span>' : '') + '</div>';
  }

  /** A small card: the name, the first lines, its kind, project and "On Today". A click anywhere on it opens it. */
  function cardHtml(card) {
    var preview = isNotes(card) ? notePreviewOf(card) : null;
    var body = preview ? notePreviewHtml(preview) : card.kind === TODO ? todoPreviewHtml(card.row) : listPreviewHtml(card.row);
    return '<article class="nx-card' + (card.color ? ' tinted' : '') + '" data-act="lists.openCard" data-id="' + FT.esc(card.id) + '"' +
      (card.row ? ' data-list="' + FT.esc(card.id) + '"' : '') + (preview && preview.waiting ? ' data-wait="' + FT.esc(card.key) + '"' : '') + tintStyle(card.color) + '>' +
      '<h3 class="nx-ctitle"><button type="button" class="nx-open">' + FT.esc(card.title) + '</button></h3>' + body + cardFootHtml(card) + '</article>';
  }

  /** As many columns as fit cards at least CARD_MIN_WIDTH wide (two on a phone). */
  function columnCount() {
    if (narrow.matches) return COLUMNS_ON_A_PHONE;
    var width = (document.getElementById('app') || {}).clientWidth || 0;
    if (!width) return COLUMNS_WHEN_THE_WIDTH_IS_UNKNOWN;
    return Math.max(1, Math.min(MOST_COLUMNS, Math.floor((width + CARD_GAP) / (CARD_MIN_WIDTH + CARD_GAP))));
  }

  /** The cards dealt into the columns in turn: the first row holds the first cards, and the order reads across. */
  function resultsHtml(cards) {
    if (!cards.length) return '<p class="nx-none">Nothing here yet. + New makes a note, a list or a to-do list.</p>';
    var shown = cards.filter(isShown);
    if (!shown.length) return '<p class="nx-none">Nothing matches. Try another word or filter.</p>';
    var columns = columnCount(), cardsByColumn = [];
    for (var column = 0; column < columns; column++) cardsByColumn.push('');
    shown.forEach(function (card, place) { cardsByColumn[place % columns] += cardHtml(card); });
    return '<div class="nx-grid" id="nx-grid" data-columns="' + columns + '" style="--nx-columns: ' + columns + '">' +
      cardsByColumn.map(function (html) { return '<div class="nx-col">' + html + '</div>'; }).join('') + '</div>';
  }

  function newMenuHtml(extraClass) {
    return '<div class="nx-menu' + extraClass + '" role="menu" aria-label="New">' + NEW_MENU.map(function (entry) {
      return '<button type="button" role="menuitem" data-act="lists.new" data-kind="' + entry[0] + '"><span class="nx-mic" aria-hidden="true">' + entry[1] + '</span>' +
        '<span>' + entry[2] + '<small>' + entry[3] + '</small></span></button>';
    }).join('') + '</div>';
  }

  function chipsHtml(cards) {
    return '<div class="nx-chips" role="group" aria-label="Show">' + FILTERS.map(function (f) {
      var count = cards.filter(function (card) { return inFilter(card, f[0]); }).length;
      return '<button type="button" class="nx-chip" data-act="lists.filter" data-filter="' + f[0] + '" aria-pressed="' + (notesTab.filter === f[0]) + '">' + f[1] + ' <span class="n">' + count + '</span></button>';
    }).join('') + '</div>';
  }

  /** Search and + New (on a phone, + New is the round button in the corner), then the chips and the Project notes switch. */
  function toolsHtml(cards) {
    var menuOpen = notesTab.menuOpen;
    return '<div class="nx-tools"><label class="nx-search">' + SEARCH_ICON +
      '<input type="search" id="nx-q" data-input="lists.search" value="' + FT.esc(notesTab.query) + '" placeholder="Search notes, lists and to-dos" aria-label="Search notes, lists and to-dos" autocomplete="off"></label>' +
      '<span class="nx-newwrap"><button type="button" class="btn primary nx-new" data-act="lists.newMenu" aria-haspopup="menu" aria-expanded="' + menuOpen + '">+ New ▾</button>' +
      (menuOpen ? newMenuHtml('') : '') + '</span></div>' +
      '<div class="nx-tools">' + chipsHtml(cards) +
      '<label class="nx-toggle"><input type="checkbox" data-change="lists.projectNotes"' + (projectNotesShown() ? ' checked' : '') + '> Project notes</label></div>';
  }

  function fabHtml() {
    return '<button type="button" class="nx-fab" data-act="lists.newMenu" aria-label="New note, list or to-do list" aria-haspopup="menu" aria-expanded="' + notesTab.menuOpen + '">+</button>' +
      (notesTab.menuOpen ? newMenuHtml(' nx-fabmenu') : '');
  }

  // ---------- the pop-up: the open card ----------
  // id: the open card's id (a list's id, or 'pnote-' + a project's id); historyEntry: opening it added a browser history
  // entry (the phone's back button closes it); entering: the first draw since it opened; selectName: put the cursor in
  // the name (a new one); bodyScroll: how far its body is scrolled, kept while the page redraws.
  var popup = closedPopup();
  function closedPopup() { return { id: null, historyEntry: false, entering: false, selectName: false, bodyScroll: 0 }; }

  function nameHtml(card) {
    if (card.kind === PROJECT_NOTES) return '<h2 class="nx-name" id="nx-name" title="Project notes are named after their project">' + FT.esc(card.title) + '</h2>';
    return '<input type="text" class="nx-name" id="nx-name" value="' + FT.esc(card.title) + '" maxlength="80" aria-label="' + kindWords(card.row).title + ' name" data-change="lists.rename" data-id="' + FT.esc(card.id) + '">';
  }

  function popupMetaHtml(card) {
    var project = card.project, link = '';
    if (project && card.kind === PROJECT_NOTES) link = '<span class="nx-badge proj">Project: ' + FT.esc(project.name) + '</span>';
    else if (project) link = '<button type="button" class="nx-badge proj" data-act="lists.openProject" data-id="' + FT.esc(project.id) + '" title="Also shown on this project\'s page. Open it">' + FT.esc(project.name) + '</button>';
    var oneAtATime = card.kind === LIST && card.row.display === 'one' && card.row.show_today ? '<span class="modebadge" title="Shown one item at a time on Today">One at a time on Today</span>' : '';
    return '<div class="nx-meta"><span class="nx-kind">' + KIND_LABELS[card.kind] + '</span>' + link + oneAtATime + '</div>';
  }

  /** The real editor, as on Today: notes another window already shows get its placeholder instead (one copy on screen). */
  function popupContentHtml(card) {
    var html = card.kind === PROJECT_NOTES ? card.bodyHtml() : bodyHtml(card.row, 'tab');
    var elsewhere = FT.popout ? FT.popout.otherCopyHtml(html) : '';
    return '<div class="nx-content ' + CONTENT_CLASS_BY_KIND[card.kind] + '">' + (elsewhere || html) + '</div>';
  }

  function coloursHtml(card) {
    var current = card.color || '';
    var swatches = COLORS.map(function (c) {
      return '<button type="button" class="nx-swatch' + (c[0] ? '' : ' none') + '" data-act="lists.colour" data-id="' + FT.esc(card.id) + '" data-color="' + c[0] + '" aria-pressed="' + (current === c[0]) + '"' +
        ' aria-label="' + c[1] + '" title="' + c[1] + '"' + (c[0] ? ' style="--c: var(--cat-' + c[0] + ')"' : '') + '></button>';
    }).join('');
    return '<button type="button" class="nx-colourbtn" data-act="lists.colours" aria-expanded="false" aria-label="Colour" title="Colour"' + (current ? ' style="--c: var(--cat-' + current + ')"' : '') + '><span></span></button>' +
      '<div class="nx-swatches" role="group" aria-label="Colour">' + swatches + '</div>';
  }

  function popupFootHtml(card) {
    var id = FT.esc(card.id), isProjectNotes = card.kind === PROJECT_NOTES;
    return (isProjectNotes ? '' : coloursHtml(card)) + '<span class="nx-grow"></span>' +
      '<label class="nx-toggle"><input type="checkbox" data-change="lists.onToday" data-id="' + id + '"' + (card.onToday ? ' checked' : '') + '> On Today</label>' +
      (isProjectNotes ? '<button type="button" class="btn sm" data-act="lists.openProject" data-id="' + FT.esc(card.project.id) + '">Go to project</button>'
        : '<button type="button" class="btn sm" data-act="lists.settings" data-id="' + id + '" aria-label="Settings for ' + FT.esc(card.title) + '" title="Name, linked project, colour, Today">⚙<span class="nx-wordy"> Settings</span></button>' +
          '<button type="button" class="btn sm nx-delete" data-act="lists.remove" data-id="' + id + '" aria-label="Delete ' + FT.esc(card.title) + '">Delete</button>');
  }

  function popupHtml(card) {
    return '<div class="nx-scrim" data-act="lists.scrim" data-noswipe>' +
      '<div class="nx-sheet' + (card.color ? ' tinted' : '') + (popup.entering ? ' nx-enter' : '') + '" id="nx-sheet" role="dialog" aria-modal="true" aria-label="' + FT.esc(card.title) + '" tabindex="-1"' + tintStyle(card.color) + '>' +
      '<div class="nx-head">' + nameHtml(card) + '<button type="button" class="iconbtn nx-x" data-act="lists.close" aria-label="Close" title="Close (Esc)">✕</button></div>' +
      '<div class="nx-body" id="nx-body">' + popupMetaHtml(card) + popupContentHtml(card) + '</div>' +
      '<div class="nx-foot">' + popupFootHtml(card) + '</div></div></div>';
  }

  /** The tab: the tools and the cards, and the open card over them (which makes the rest inert). */
  function tabHtml() {
    var cards = allCards(), open = popup.id ? cards.filter(function (card) { return card.id === popup.id; })[0] : null;
    return '<div class="nx-page"' + (open ? ' inert' : '') + '>' + toolsHtml(cards) + '<div id="nx-results">' + resultsHtml(cards) + '</div>' + fabHtml() + '</div>' +
      (open ? popupHtml(open) : '');
  }

  /** The list as a panel on another page (Today, a project), without the name field and Delete. */
  function compactPanel(l, where) {
    var plan = kindOf(l) === TODO && where === ON_TODAY && FT.todos ? FT.todos.planButtonHtml() : '';
    return panelOpen(l) + '<div class="tophead"><div class="label">' + FT.esc(l.name) + '</div><span class="actions" style="margin:0">' + plan + gearButton(l) + '</span></div>' +
      bodyHtml(l, where) + '</section>';
  }

  var TODAY_DESCRIPTIONS = { '': 'A list from the Notes tab.', todo: 'A to-do list from the Notes tab: tick off, add for today, tomorrow or anytime.', note: 'A note from the Notes tab, kept as a Google Doc.' };

  /** A list as a panel on Today (or in a pill). A to-do list sits beside the focus by default, as the To-dos panel did. */
  function todayPanel(l) {
    var kind = kindOf(l), panel = { id: 'list-' + l.id, kind: KINDS[kind].panelKind, title: l.name, description: TODAY_DESCRIPTIONS[kind], w: 6, html: compactPanel(l, ON_TODAY) };
    if (kind === LIST && l.display === 'one') return Object.assign(panel, { description: 'One item of this list at a time.', w: 5, html: quotePanelHtml(l) });
    if (kind === TODO) return Object.assign(panel, { w: 5, beside: true, count: FT.todos ? FT.todos.openCount(l) || '' : '' });
    if (kind === NOTE) return Object.assign(panel, { w: 7 });
    return panel;
  }

  /** On Today, each list marked for it shows as its own panel. */
  function todayPanels() {
    return lists().filter(function (l) { return l.show_today; }).map(todayPanel);
  }

  /** A phone's pill can hold any list, also one not on Today. */
  function pillPanels() {
    return lists().filter(function (l) { return !l.show_today; }).map(todayPanel);
  }

  /** On a project's page, the lists linked to it: one panel each, with a stable id so its place can be saved. */
  function projectPanels(p) {
    return lists().filter(function (l) { return l.project_id === p.id; }).map(function (l) {
      return { id: 'list-' + l.id, title: l.name, description: 'A ' + kindWords(l).noun + ' linked to this project.', w: 6, html: compactPanel(l, 'project') };
    });
  }

  /** Change one field of a list on screen at once and save it behind (Edit layout's Add feature); put back if refused. */
  function setList(l, fields, fn, args) {
    var before = {};
    Object.keys(fields).forEach(function (k) { before[k] = l[k]; });
    FT.optimistic(function () {
      Object.keys(fields).forEach(function (k) { l[k] = fields[k]; });
      return function () { Object.keys(before).forEach(function (k) { l[k] = before[k]; }); };
    }, function () { return FT.rpc('lists', fn, args, { render: false }); }).catch(function () {});
  }

  /** Add feature on Today: every list, to-do list and note not shown there. */
  function addableToday() {
    return lists().filter(function (l) { return !l.show_today; }).map(function (l) {
      var p = l.project_id && FT.project(l.project_id);
      return { id: 'list-' + l.id, panel: 'list-' + l.id, title: l.name, description: kindWords(l).title + (p ? ' on ' + p.name : '') + ', shown on Today as its own panel.',
        add: function () { setList(l, { show_today: 'yes' }, 'showToday', { id: l.id, on: true }); } };
    });
  }

  /** Add feature on a project page: lists not linked to any project. */
  function addableProject(FT, project) {
    if (!project) return [];
    return lists().filter(function (l) { return !l.project_id || !FT.project(l.project_id); }).map(function (l) {
      return { id: 'list-' + l.id, panel: 'list-' + l.id, title: l.name, description: kindWords(l).title + ' not linked to a project yet. Adding links it to ' + project.name + '.',
        add: function () { setList(l, { project_id: project.id, project: project.name }, 'setProject', { id: l.id, projectId: project.id }); } };
    });
  }

  FT.module({
    id: 'lists',
    tab: { title: 'Notes', order: 25, render: tabHtml },
    slots: {
      'today.panels': [{ order: 10, render: todayPanels }], 'today.pillPanels': [{ order: 10, render: pillPanels }], 'project.page': [{ order: 30, render: projectPanels }],
      'addable.today': [{ order: 10, render: addableToday }], 'addable.project': [{ order: 10, render: addableProject }]
    }
  });

  /**
   * Make a list (kind ''), a to-do list ('todo') or a note ('note'): it shows at once with an id made here (and a list's
   * first group too), and is saved behind. Returns the new row.
   */
  function create(name, kind) {
    var words = KINDS[kind] || KINDS[LIST];
    var l = {
      id: FT.newId(), name: String(name).trim().slice(0, 80), kind: kind, project: '', project_id: '', show_today: '', display: '', seconds: 0, color: '',
      order: lists().reduce(function (m, x) { return Math.max(m, x.order || 0); }, 0) + 1, created: new Date().toISOString()
    };
    var groupId = words.firstGroup ? FT.newId() : '';
    FT.store.lists = lists().concat([l]);
    if (groupId) {
      FT.store.kanban = FT.store.kanban || { columns: [], tasks: [] };
      FT.store.kanban.columns.push({ id: groupId, owner: l.id, list_id: l.id, project_id: '', name: words.firstGroup, order: 1 });
    }
    FT.render();
    var args = { id: l.id, name: l.name, kind: kind };
    if (groupId) args.groupId = groupId;
    FT.rpc('lists', 'create', args, { render: false }).catch(FT.saveFailed);
    return l;
  }
  FT.lists = { create: create, KINDS: KINDS };

  /** A project's page: from a linked list's badge or "Go to project" in the pop-up, which it leaves. */
  FT.action('lists.openProject', function (el) {
    popup = closedPopup();
    FT.go('project', { id: el.dataset.id });
  });
  FT.action('lists.rotate', function (el) {
    var l = byId(el.dataset.id);
    if (l) rotate(l, Number(el.dataset.d));
  });

  // ---------- the Notes tab's controls ----------
  FT.on('input', 'lists.search', function (el) {
    notesTab.query = el.value;
    drawResults();
  });
  FT.action('lists.filter', function (el) {
    notesTab.filter = el.dataset.filter;
    FT.render();
  });
  FT.action('lists.newMenu', function () {
    notesTab.menuOpen = !notesTab.menuOpen;
    FT.render();
    var first = notesTab.menuOpen && document.querySelector('#app .nx-menu button');
    if (first && !narrow.matches) first.focus();
  });
  // A tap outside the + New menu closes it.
  document.addEventListener('click', function (e) {
    if (!notesTab.menuOpen || (e.target.closest && e.target.closest('.nx-newwrap, .nx-fab, .nx-menu'))) return;
    notesTab.menuOpen = false;
    FT.render();
  });

  /** + New: the note, list or to-do list shows at once (saved behind) and opens, its name ready to type over. */
  FT.action('lists.new', function (el) {
    var kind = KINDS[el.dataset.kind || ''] ? el.dataset.kind || '' : LIST;
    notesTab.menuOpen = false;
    notesTab.filter = 'all';
    notesTab.query = '';
    var made = create(NEW_NAMES[kind], kind);
    openPopup(made.id, true);
  });

  FT.action('lists.openCard', function (el, e) {
    if (e && e.target.closest && e.target.closest('label, input')) return; // a to-do's tick box on the card
    if (Date.now() - lastCardDragEnd < 400) return; // the click that ends a drag
    openPopup(el.dataset.id, false);
  });
  FT.action('lists.close', function () { closePopup(true); });
  FT.action('lists.scrim', function (el, e) { if (e && e.target === el) closePopup(true); });

  FT.on('change', 'lists.onToday', function (el) {
    var card = cardById(el.dataset.id), on = el.checked;
    if (!card) return;
    if (card.kind === PROJECT_NOTES) card.setOnToday(on);
    else setList(card.row, { show_today: on ? 'yes' : '' }, 'showToday', { id: card.id, on: on });
  });

  FT.action('lists.colour', function (el) {
    var l = byId(el.dataset.id), color = el.dataset.color || '';
    if (!l || (l.color || '') === color) return;
    setList(l, { color: color }, 'setColor', { id: l.id, color: color });
  });
  /** A phone shows the colours over the footer only when asked. */
  FT.action('lists.colours', function (el) {
    var picking = el.closest('.nx-foot').classList.toggle('picking');
    el.setAttribute('aria-expanded', picking ? 'true' : 'false');
  });

  function openPopup(id, isNew) {
    notesTab.menuOpen = false;
    popup = { id: id, historyEntry: narrow.matches && FT.pushHistory(), entering: true, selectName: isNew, bodyScroll: 0 };
    FT.render();
  }

  /** Close the open card. dropEntry: also drop its browser history entry (not when the back button closed it). */
  function closePopup(dropEntry) {
    if (!popup.id) return;
    var sheet = document.getElementById('nx-sheet'), active = document.activeElement;
    if (sheet && active && sheet.contains(active) && active.blur) active.blur(); // a name or note being typed is saved first
    var cardId = popup.id, entry = popup.historyEntry;
    popup = closedPopup();
    if (entry && dropEntry) FT.popHistory();
    FT.render();
    var opener = document.querySelector('#nx-results .nx-card[data-id="' + cardId + '"] .nx-open');
    if (opener) { try { opener.focus({ preventScroll: true }); } catch (err) {} }
  }

  // Esc closes the + New menu, else the open card. It listens before the page does, to see whether a dialog over the
  // card is open (Esc closes that dialog only).
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || FT.state.view !== 'lists' || document.getElementById('dialogRoot').innerHTML) return;
    if (notesTab.menuOpen) { notesTab.menuOpen = false; FT.render(); return; }
    if (popup.id) closePopup(true);
  }, true);
  // The phone's back button closes the open card (the notes editor's full screen first, when it is open).
  FT.onBack(function () {
    if (!popup.id || document.querySelector('.notes-panel.full')) return false;
    popup.historyEntry = false;
    closePopup(false);
    return true;
  });
  document.addEventListener('scroll', function (e) {
    if (e.target && e.target.id === 'nx-body') popup.bodyScroll = e.target.scrollTop;
  }, true);

  /** After a draw: the open card keeps its scroll and takes the focus when it opens; the page behind cannot be used. */
  function settlePopup(sheet) {
    var body = document.getElementById('nx-body');
    if (body) body.scrollTop = popup.bodyScroll;
    if (!popup.entering) return;
    popup.entering = false;
    var name = popup.selectName && document.getElementById('nx-name');
    popup.selectName = false;
    if (name) { name.focus(); name.select(); }
    else { try { sheet.focus({ preventScroll: true }); } catch (err) {} }
  }

  function setInert(el, on) {
    if (!el) return;
    if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert');
  }

  FT.onRender(function () {
    var onTab = FT.state.view === 'lists', sheet = onTab ? document.getElementById('nx-sheet') : null;
    if (popup.id && !sheet) { // its card is gone (deleted, another mode) or the page changed
      var entry = popup.historyEntry;
      popup = closedPopup();
      if (entry) FT.popHistory();
    }
    document.body.classList.toggle('nx-showing-card', !!sheet);
    setInert(document.querySelector('.bar'), !!sheet);
    setInert(document.getElementById('pager'), !!sheet);
    if (sheet) settlePopup(sheet);
    makeCardsSortable(); // also drops the old ones when the page changed
    if (onTab) askForWaitingPreviews();
  });

  /** The search draws the cards again without the rest of the page, so the search box keeps the cursor. */
  function drawResults() {
    var box = document.getElementById('nx-results');
    if (!box) return;
    box.innerHTML = resultsHtml(allCards());
    makeCardsSortable();
    askForWaitingPreviews();
  }

  // ---------- dragging cards into a new order (a long press first on a phone) ----------
  var cardSorts = [], lastCardDragEnd = 0;
  var LONG_PRESS_MS = 300;

  /** The order values the lists have, given out again in their new sequence (as lists.move does on the server). */
  function ordersToGiveOut(ordered) {
    var orders = ordered.map(function (l) { return l.order || 0; });
    var allDifferent = orders.every(function (order, place) { return place === 0 || order > orders[place - 1]; });
    return allDifferent ? orders : ordered.map(function (l, place) { return place + 1; });
  }

  /** A list's card put at a place in the dealt order: the lists take their new order at once, and the move is saved behind. */
  function moveCard(id, place) {
    var ordered = lists().slice().sort(byOrder), from = ordered.map(function (l) { return l.id; }).indexOf(id), to = Math.min(place, ordered.length - 1);
    if (from === -1 || from === to) { FT.dragEnded(); return; }
    var ordersBefore = ordered.map(function (l) { return l.order; });
    FT.optimistic(function () {
      var orders = ordersToGiveOut(ordered), moved = ordered.slice();
      moved.splice(to, 0, moved.splice(from, 1)[0]);
      moved.forEach(function (l, place) { l.order = orders[place]; });
      FT.store.lists = lists().slice().sort(byOrder);
      return function () { ordered.forEach(function (l, place) { l.order = ordersBefore[place]; }); FT.store.lists = lists().slice().sort(byOrder); };
    }, function () { return FT.rpc('lists', 'move', { id: id, d: to - from }, { render: false }); }).catch(function () {});
  }

  /** Where a dropped card now sits in the dealt order: its row among the lists' cards of its column, times the columns, plus its column. */
  function placeOfDroppedCard(card, columns) {
    var column = card.parentNode, row = Array.prototype.filter.call(column.children, function (el) { return el.matches('.nx-card[data-list]'); }).indexOf(card);
    return row * columns.length + columns.indexOf(column);
  }

  /** Each column takes cards from the others; a project's notes stay after the lists. */
  function makeCardsSortable() {
    cardSorts.forEach(function (sortable) { sortable.destroy(); });
    cardSorts = [];
    var grid = document.getElementById('nx-grid');
    if (!grid || !window.Sortable || !canReorder() || popup.id) return;
    var columns = Array.prototype.slice.call(grid.children);
    columns.forEach(function (column) {
      cardSorts.push(window.Sortable.create(column, {
        group: 'nx-cards', draggable: '.nx-card[data-list]', animation: 150, delay: LONG_PRESS_MS, delayOnTouchOnly: true,
        filter: 'input, label', preventOnFilter: false, ghostClass: 'nx-ghost', chosenClass: 'nx-chosen',
        onStart: function () { FT.state.dragging = true; },
        onEnd: function (evt) {
          lastCardDragEnd = Date.now();
          FT.state.dragging = false;
          moveCard(evt.item.dataset.list, placeOfDroppedCard(evt.item, columns));
        }
      }));
    });
  }

  // A window made wider or narrower deals the cards into as many columns as now fit.
  window.addEventListener('resize', function () {
    var grid = document.getElementById('nx-grid');
    if (grid && !FT.state.dragging && Number(grid.dataset.columns) !== columnCount()) drawResults();
  });

  // ---------- notes whose first lines nobody kept yet (written before the server kept them) ----------
  // Their cards ask for the notes once they are on screen, two at a time, once per page load. The server keeps the
  // first lines from then on, so each note is read once, not every time the tab opens.
  var PREVIEW_LOADS_AT_ONCE = 2, PREVIEW_WAIT_MS = 600;
  var previewQueue = [], previewsLoading = 0, previewAsked = {}, previewWatch = null, previewTimer = null;

  function askForWaitingPreviews() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(watchWaitingCards, PREVIEW_WAIT_MS); // a fresh load may bring the first lines meanwhile
  }

  function watchWaitingCards() {
    if (previewWatch) { previewWatch.disconnect(); previewWatch = null; }
    var waiting = Array.prototype.slice.call(document.querySelectorAll('#nx-results .nx-card[data-wait]'));
    if (!waiting.length || !FT.notes) return;
    if (!window.IntersectionObserver) { waiting.forEach(function (card) { askForPreview(card.dataset.wait); }); return; }
    previewWatch = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { if (entry.isIntersecting) askForPreview(entry.target.dataset.wait); });
    });
    waiting.forEach(function (card) { previewWatch.observe(card); });
  }

  function askForPreview(key) {
    if (previewAsked[key]) return;
    previewAsked[key] = true;
    previewQueue.push(key);
    loadNextPreviews();
  }

  function loadNextPreviews() {
    while (previewsLoading < PREVIEW_LOADS_AT_ONCE && previewQueue.length) {
      var key = previewQueue.shift();
      previewsLoading++;
      FT.notes.loadPreview(key).then(previewLoaded(key), previewLoaded(key));
    }
  }

  /** Draw again the cards that waited for these notes. */
  function previewLoaded(key) {
    return function () {
      previewsLoading--;
      if (!FT.state.dragging) {
        Array.prototype.forEach.call(document.querySelectorAll('#nx-results .nx-card[data-wait="' + key + '"]'), function (el) {
          var card = cardById(el.dataset.id);
          if (card) el.outerHTML = cardHtml(card);
        });
      }
      loadNextPreviews();
    };
  }

  FT.on('change', 'lists.rename', function (el) {
    var name = el.value.trim(), l = byId(el.dataset.id);
    if (!name || !l) { FT.render(); return; }
    l.name = name.slice(0, 80);
    FT.rpc('lists', 'rename', { id: l.id, name: name }, { render: false }).catch(FT.saveFailed);
  });

  /** Show project notes, or not: shown at once, saved for the mode. */
  FT.on('change', 'lists.projectNotes', function (el) {
    var change = { projectNotes: el.checked ? PROJECT_NOTES_ON : PROJECT_NOTES_OFF };
    FT.store.layout = FT.store.layout || {};
    var before = FT.store.layout[VIEW_KEY];
    FT.optimistic(function () {
      FT.store.layout[VIEW_KEY] = Object.assign({}, before || {}, change);
      return function () { if (before) FT.store.layout[VIEW_KEY] = before; else delete FT.store.layout[VIEW_KEY]; };
    }, function () { return FT.rpc('layout', 'saveView', { page: 'lists', view: change }, { render: false }); }).catch(function () {});
  });

  // ---------- list settings: name, colour (with a live preview), Show on Today, linked project; a list's display ----------
  function swatchesHtml(current) {
    return '<label>Colour</label><div class="swatches" role="radiogroup" aria-label="List colour">' + COLORS.map(function (c) {
      return '<label title="' + c[1] + '"><input type="radio" name="dlg-listcolor" value="' + c[0] + '"' + ((current || '') === c[0] ? ' checked' : '') + ' aria-label="' + c[1] + '">' +
        '<span class="' + (c[0] ? '' : 'none') + '"' + (c[0] ? ' style="--c: var(--cat-' + c[0] + ')"' : '') + '></span></label>';
    }).join('') + '</div>';
  }

  function displayHtml(l) {
    var one = l.display === 'one';
    return '<label>Display on Today</label><div class="seg" role="radiogroup" aria-label="Display on Today">' +
      '<label><input type="radio" name="dlg-display" value=""' + (one ? '' : ' checked') + '> Full list<small>All groups and items.</small></label>' +
      '<label><input type="radio" name="dlg-display" value="one"' + (one ? ' checked' : '') + '> One at a time<small>A random item as a quote, changing by itself.</small></label></div>' +
      '<div id="dlg-secsrow"><label for="dlg-seconds">Show each item for</label><div class="secs"><input type="text" inputmode="numeric" id="dlg-seconds" value="' + secondsOf(l) + '"> <span style="color:var(--muted)">seconds</span></div></div>';
  }

  /** A small copy of the list as it will look, with its real first items. */
  function previewHtml(l) {
    var k = FT.store.kanban || { columns: [], tasks: [] };
    var group = k.columns.filter(function (c) { return c.owner === l.id; }).sort(function (a, b) { return a.order - b.order; })[0];
    var items = group ? k.tasks.filter(function (t) { return t.column_id === group.id; }).sort(function (a, b) { return a.order - b.order; }).slice(0, 2) : [];
    if (!items.length) items = [{ title: 'An item' }, { title: 'Another item' }];
    return '<label>Preview</label><section class="panel listpanel listpreview" id="dlg-listpreview" aria-hidden="true">' +
      '<div class="label" id="dlg-previewname">' + FT.esc(l.name) + '</div><div class="col"><div class="colhead"><span class="colname">' + FT.esc(group ? group.name : 'Items') + '</span></div>' +
      items.map(function (t) { return '<div class="kcard"><span class="kt">' + FT.esc(t.title) + '</span></div>'; }).join('') + '</div></section>';
  }

  function showPreview(color) {
    var preview = document.getElementById('dlg-listpreview');
    if (!preview) return;
    preview.classList.toggle('tinted', !!color);
    if (color) preview.style.setProperty('--list-c', 'var(--cat-' + color + ')'); else preview.style.removeProperty('--list-c');
  }

  /** "No project" and every project by name. Archived ones only when the list is already linked to one. */
  function projectOptions(l) {
    var projects = (FT.store.projects || []).filter(function (p) { return p.status !== 'archived' || p.id === l.project_id; })
      .slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    return [{ value: '', label: 'No project' }].concat(projects.map(function (p) { return { value: p.id, label: p.name }; }));
  }

  FT.action('lists.settings', function (el) {
    var l = byId(el.dataset.id);
    if (!l) return;
    var isList = kindOf(l) === LIST, words = kindWords(l);
    FT.dialog({
      title: words.title + ' settings',
      wide: true,
      fields: [{ id: 'listname', label: 'Name', value: l.name },
        { id: 'listproject', label: 'Linked project (the ' + words.noun + ' also shows on its page)', type: 'select', value: l.project_id || '', options: projectOptions(l) }],
      after: (isList ? displayHtml(l) : '') + swatchesHtml(l.color) + (isList ? previewHtml(l) : '') +
        '<label class="toggle"><input type="checkbox" id="dlg-showtoday"' + (l.show_today ? ' checked' : '') + '> Show this ' + words.noun + ' on Today</label>',
      onOpen: function () {
        showPreview(l.color || '');
        Array.prototype.forEach.call(document.querySelectorAll('input[name="dlg-listcolor"]'), function (radio) {
          radio.addEventListener('change', function () { showPreview(radio.value); });
        });
        if (!isList) return;
        var secs = document.getElementById('dlg-secsrow');
        function syncDisplay() { secs.hidden = !document.querySelector('input[name="dlg-display"][value="one"]').checked; }
        Array.prototype.forEach.call(document.querySelectorAll('input[name="dlg-display"]'), function (radio) { radio.addEventListener('change', syncDisplay); });
        syncDisplay();
        document.getElementById('dlg-listname').addEventListener('input', function (e) {
          document.getElementById('dlg-previewname').textContent = e.target.value;
        });
      },
      onSubmit: function (v) {
        if (!v.listname) throw new Error('A ' + words.noun + ' needs a name.');
        var picked = document.querySelector('input[name="dlg-listcolor"]:checked');
        var color = picked ? picked.value : '', showToday = document.getElementById('dlg-showtoday').checked;
        var displayPicked = document.querySelector('input[name="dlg-display"]:checked');
        var display = displayPicked ? displayPicked.value : (l.display || '');
        var secondsField = document.getElementById('dlg-seconds');
        var seconds = secondsField ? Number(secondsField.value) : secondsOf(l);
        if (display === 'one' && !(Math.floor(seconds) === seconds && seconds >= 5 && seconds <= 3600)) throw new Error('Show each item for 5 to 3600 seconds.');
        if (display !== 'one') seconds = secondsOf(l);
        var changes = [];
        if (isList && (display !== (l.display || '') || seconds !== secondsOf(l))) changes.push(['setDisplay', { id: l.id, display: display, seconds: seconds }]);
        if (v.listname !== l.name) changes.push(['rename', { id: l.id, name: v.listname }]);
        if (color !== (l.color || '')) changes.push(['setColor', { id: l.id, color: color }]);
        if (showToday !== !!l.show_today) changes.push(['showToday', { id: l.id, on: showToday }]);
        if (v.listproject !== (l.project_id || '')) changes.push(['setProject', { id: l.id, projectId: v.listproject }]);
        // Shown at once, saved in the background.
        l.name = v.listname.slice(0, 80); l.color = color; l.show_today = showToday ? 'yes' : '';
        l.project_id = v.listproject; l.project = v.listproject ? (FT.project(v.listproject) || {}).name || '' : '';
        l.display = display; l.seconds = seconds;
        FT.render();
        changes.forEach(function (c) { FT.rpc('lists', c[0], c[1], { render: false }).catch(FT.saveFailed); });
      }
    });
  });

  /** What deleting takes with it, by kind. */
  function deleteText(l) {
    var name = '"' + FT.esc(l.name) + '"';
    if (kindOf(l) === NOTE) return 'Delete the note ' + name + '? Its Google Doc goes to Drive\'s bin. You can undo this.';
    if (kindOf(l) === TODO) return 'Delete the to-do list ' + name + ' and its to-dos? You can undo this.';
    return 'Delete ' + name + ' and everything in it? You can undo this.';
  }

  FT.action('lists.remove', function (el) {
    var l = byId(el.dataset.id);
    if (!l) return;
    var words = kindWords(l);
    FT.dialog({
      title: 'Delete ' + words.noun,
      body: '<p>' + deleteText(l) + '</p>',
      submit: 'Delete ' + words.noun, danger: true,
      onSubmit: function () {
        var before = FT.store.lists;
        FT.optimistic(function () {
          FT.store.lists = before.filter(function (x) { return x.id !== l.id; });
          return function () { FT.store.lists = before; };
        }, function () { return FT.rpc('lists', 'remove', { id: l.id }); }).catch(function () {});
        FT.deleted(words.title);
      }
    });
  });
})();
</script>

<style>
.kbhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.kbhead .label { margin: 0; }
.board { display: flex; gap: 10px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
.board.vertical { flex-direction: column; align-items: stretch; overflow-x: visible; }
.col { flex: 0 0 240px; background: var(--surface-2); border-radius: 8px; padding: 10px; min-height: 120px; }
.board.vertical .col { flex: 0 0 auto; width: 100%; }
.colhead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.colname { flex: 1 1 auto; min-width: 0; width: auto; padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; background: transparent !important; border-color: transparent !important; color: var(--ink); }
.colname:hover, .colname:focus { background: var(--surface) !important; border-color: var(--line) !important; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.rm { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; flex: none; }
.rm:hover { background: var(--surface); color: var(--bad); }
.rm[disabled] { opacity: 1; color: var(--muted); text-decoration: line-through; cursor: default; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; overflow-wrap: anywhere; }
.kcard .mv { display: flex; gap: 2px; flex: none; }
.cards { min-height: 8px; }
.kcard { cursor: grab; touch-action: manipulation; }
.kghost { opacity: 0.4; }
.kchosen { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); }
.mvb { border: 1px solid var(--line); background: transparent; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.mvb:hover { background: var(--surface-2); color: var(--ink); }
.mvb[disabled] { opacity: 1; color: var(--muted); border-style: dashed; cursor: default; }
.addcol { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; min-height: 56px; font-weight: 500; border-radius: 8px; }
.addcol:hover { background: var(--surface-2); color: var(--ink); }
.coladd { display: flex; gap: 4px; align-items: center; }
.coladd input { padding: 6px 9px; font-size: 14px; background: transparent; border-style: dashed; }
.coladd input:focus { background: var(--surface); border-style: solid; }
.kcard { border-left: 4px solid var(--card, var(--line)); }
.kcard .ktitle { flex: 1 1 auto; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; overflow-wrap: anywhere; }
.kcard .ktitle:hover .kt { text-decoration: underline; text-underline-offset: 3px; }
.kcard .knote { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches label { margin: 0; display: inline-flex; }
.swatches input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatches span { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--surface-2)); border: 2px solid var(--line); cursor: pointer; display: inline-block; }
.swatches span.none { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, var(--surface) 4px 8px); }
.swatches input:checked + span { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
/* The chosen colour also gets a tick, so the choice never rests on colour or a shadow alone (E-ink has neither). */
.swatches input:checked + span::after { content: "\2713"; position: absolute; right: -7px; bottom: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script>
/**
 * Kanban boards. A board belongs to an owner: a project (shown on its page) or any other module's item, such as a list.
 * Other modules draw a board with FT.kanban.boardHtml(ownerId, opts). Every control finds its board through the
 * nearest [data-owner], so several boards can share a page.
 *
 * Cards move by drag and drop (SortableJS from the CDN; a short press on touch screens) or with "Column" in the card
 * dialog. Adding, moving, editing and deleting cards show on screen at once and save in the background.
 */
(function () {
  var userDir = null;
  try { userDir = localStorage.getItem('ft.kanban.dir'); } catch (e) {}
  var phone = window.matchMedia('(max-width: 640px)');
  function dir() { return userDir || (phone.matches ? 'vertical' : 'horizontal'); }
  function onPhoneChange() { if (!userDir && FT.state.view === 'project') FT.render(); }
  if (phone.addEventListener) phone.addEventListener('change', onPhoneChange);

  var sortables = [], lastDragEnd = 0;

  function byOrder(a, b) { return a.order - b.order; }

  function board(ownerId) {
    var k = FT.store.kanban || { columns: [], tasks: [] };
    return {
      cols: k.columns.filter(function (c) { return c.project_id === ownerId; }).sort(byOrder),
      tasks: k.tasks.filter(function (t) { return t.project_id === ownerId; }).sort(byOrder)
    };
  }

  function taskById(id) { return (FT.store.kanban.tasks || []).filter(function (t) { return t.id === id; })[0] || null; }

  function ownerOf(el) {
    var host = el.closest('[data-owner]');
    return host ? host.dataset.owner : FT.state.projectId;
  }
  function wordOf(el) {
    var host = el.closest('[data-owner]');
    return (host && host.dataset.word) || 'column';
  }

  function cardHtml(t) {
    var id = FT.esc(t.id);
    var color = t.color ? ' style="--card: var(--cat-' + FT.esc(t.color) + ')"' : '';
    var note = t.note_text ? '<span class="knote">' + FT.linkify(t.note_text.slice(0, 160)) + '</span>' : '';
    // A div, not a button: titles and notes can hold links, and a link may not sit inside a button.
    return '<div class="kcard" data-id="' + id + '"' + color + '><div class="ktitle" role="button" tabindex="0" data-act="kanban.open-card" data-id="' + id + '">' +
      '<span class="kt">' + FT.linkify(t.title) + '</span>' + note + '</div><span class="mv">' +
      '<button class="mvb kdel" data-act="kanban.del-task" data-id="' + id + '" aria-label="Delete ' + FT.esc(t.title) + '">×</button></span></div>';
  }

  function columnHtml(c, b, word) {
    var mine = b.tasks.filter(function (t) { return t.column_id === c.id; });
    var name = FT.esc(c.name);
    return '<div class="col"><div class="colhead"><input type="text" class="colname" data-change="kanban.rename-col" data-id="' + FT.esc(c.id) + '" value="' + name + '" aria-label="' + word + ' name">' +
      '<span class="count">' + mine.length + '</span><button class="rm" data-act="kanban.del-col" data-id="' + FT.esc(c.id) + '" aria-label="Delete ' + word + ' ' + name + '"' + (b.cols.length < 2 ? ' disabled' : '') + '>Delete</button></div>' +
      '<div class="cards" data-col="' + FT.esc(c.id) + '">' + mine.map(cardHtml).join('') + '</div>' + addTaskHtml(c) + '</div>';
  }

  /**
   * One board. opts: { vertical: true to stack columns, word: 'column' | 'group' (used in labels and dialogs) }.
   */
  function boardHtml(ownerId, opts) {
    opts = opts || {};
    var b = board(ownerId), vertical = !!opts.vertical, word = opts.word || 'column';
    return '<div class="board' + (vertical ? ' vertical' : '') + '" data-owner="' + FT.esc(ownerId) + '" data-word="' + word + '">' +
      b.cols.map(function (c) { return columnHtml(c, b, word); }).join('') +
      '<button class="col addcol" data-act="kanban.add-col">+ Add ' + word + '</button></div>';
  }

  function addTaskHtml(col) {
    var id = FT.esc(col.id);
    return '<div class="coladd"><input type="text" id="kb-new-' + id + '" placeholder="+ Add" aria-label="New card in ' + FT.esc(col.name) + '" data-enter="kanban.add-task" data-col="' + id + '">' +
      '<button class="mvb" data-act="kanban.add-task" data-col="' + id + '" aria-label="Add to ' + FT.esc(col.name) + '">+</button></div>';
  }

  function panel(p) {
    var vertical = dir() === 'vertical';
    return '<section class="panel"><div class="kbhead"><div class="label">Kanban</div>' +
      '<button class="btn sm" data-act="kanban.dir">' + (vertical ? 'Switch to horizontal' : 'Switch to vertical') + '</button></div>' +
      boardHtml(p.id, { vertical: vertical }) + '</section>';
  }

  // ---------- moving cards ----------
  /** A place for a card between two neighbours: halfway between their orders, so no other card has to change. */
  function orderBetween(before, after) {
    if (before && after) return (before.order + after.order) / 2;
    if (before) return before.order + 1;
    if (after) return after.order - 1;
    return 1;
  }

  /** Move a card on screen now and save it in the background. index: its place in the target column. */
  function moveCard(task, columnId, index) {
    var others = board(task.project_id).tasks.filter(function (t) { return t.column_id === columnId && t.id !== task.id; });
    var at = index === undefined ? others.length : index;
    task.column_id = columnId;
    task.order = orderBetween(others[at - 1], others[at]);
    FT.render();
    FT.rpc('kanban', 'moveTask', { id: task.id, columnId: columnId, order: task.order }, { render: false }).catch(FT.saveFailed);
  }

  function makeSortable(list) {
    var owner = list.closest('[data-owner]').dataset.owner;
    return window.Sortable.create(list, {
      group: 'board-' + owner, animation: 150, delay: 180, delayOnTouchOnly: true,
      filter: '.kdel', preventOnFilter: false, ghostClass: 'kghost', chosenClass: 'kchosen',
      onStart: function () { FT.state.dragging = true; },
      onEnd: function (evt) {
        lastDragEnd = Date.now();
        var task = taskById(evt.item.dataset.id);
        var moved = evt.from !== evt.to || evt.oldIndex !== evt.newIndex;
        FT.state.dragging = false;
        if (task && moved) moveCard(task, evt.to.dataset.col, evt.newIndex);
        else FT.dragEnded();
      }
    });
  }

  FT.onRender(function () {
    sortables.forEach(function (sortable) { sortable.destroy(); });
    sortables = [];
    if (!window.Sortable) return;
    Array.prototype.forEach.call(document.querySelectorAll('#app .board .cards'), function (list) { sortables.push(makeSortable(list)); });
  });

  FT.kanban = { boardHtml: boardHtml };
  FT.module({ id: 'kanban', slots: { 'project.page': [{ id: 'kanban', title: 'Kanban', order: 10, span: 'full', render: panel }] } });

  FT.action('kanban.dir', function () {
    userDir = dir() === 'vertical' ? 'horizontal' : 'vertical';
    try { localStorage.setItem('ft.kanban.dir', userDir); } catch (e) {}
    FT.render();
  });

  /** A new card shows at once and the box clears, so pressing Enter again cannot add it twice. */
  function addTask(el) {
    var columnId = el.dataset.col, inputId = 'kb-new-' + columnId;
    var input = document.getElementById(inputId), title = input ? input.value.trim() : '';
    if (!title) { if (input) input.focus(); return; }
    var ownerId = ownerOf(el), others = board(ownerId).tasks.filter(function (t) { return t.column_id === columnId; });
    var task = {
      id: FT.newId(), project_id: ownerId, column_id: columnId, title: title.slice(0, 200), order: orderBetween(others[others.length - 1], null),
      created: new Date().toISOString(), color: '', note_html: '', note_text: ''
    };
    FT.store.kanban.tasks.push(task);
    FT.render();
    var again = document.getElementById(inputId);
    if (again) again.focus();
    FT.rpc('kanban', 'addTask', { id: task.id, projectId: ownerId, columnId: columnId, title: task.title }, { render: false }).catch(FT.saveFailed);
  }
  FT.action('kanban.add-task', addTask);
  FT.on('enter', 'kanban.add-task', addTask);

  FT.action('kanban.add-col', function (el) {
    var ownerId = ownerOf(el), word = wordOf(el), cols = board(ownerId).cols;
    var col = { id: FT.newId(), project_id: ownerId, name: 'New ' + word, order: orderBetween(cols[cols.length - 1], null) };
    FT.store.kanban.columns.push(col);
    FT.render();
    var input = document.querySelector('.colname[data-id="' + col.id + '"]');
    if (input) { input.focus(); input.select(); }
    FT.rpc('kanban', 'addColumn', { id: col.id, projectId: ownerId, name: col.name }, { render: false }).catch(FT.saveFailed);
  });

  FT.on('change', 'kanban.rename-col', function (el) {
    var name = el.value.trim() || 'Untitled';
    var col = FT.store.kanban.columns.filter(function (c) { return c.id === el.dataset.id; })[0];
    if (!col) return;
    col.name = name; el.value = name;
    FT.rpc('kanban', 'renameColumn', { id: col.id, name: name }, { render: false }).catch(FT.saveFailed);
  });

  FT.action('kanban.del-col', function (el) {
    var b = board(ownerOf(el)), word = wordOf(el);
    var i = b.cols.map(function (c) { return c.id; }).indexOf(el.dataset.id);
    if (i < 0 || b.cols.length < 2) return;
    var col = b.cols[i], target = b.cols[i > 0 ? i - 1 : 1];
    var count = b.tasks.filter(function (t) { return t.column_id === col.id; }).length;
    FT.dialog({
      title: 'Delete ' + word,
      body: '<p>Delete "' + FT.esc(col.name) + '"? ' + (count ? count + (count === 1 ? ' card moves' : ' cards move') + ' to "' + FT.esc(target.name) + '".' : 'It has no cards.') + ' You can undo this.</p>',
      submit: 'Delete ' + word, danger: true,
      onSubmit: function () {
        return FT.rpc('kanban', 'deleteColumn', { id: col.id }, { quiet: true }).then(function () { FT.deleted(word.charAt(0).toUpperCase() + word.slice(1)); });
      }
    });
  });

  /** Deleting a card is immediate; the message offers Undo. */
  FT.action('kanban.del-task', function (el) {
    var t = taskById(el.dataset.id);
    if (!t) return;
    FT.store.kanban.tasks = FT.store.kanban.tasks.filter(function (x) { return x.id !== t.id; });
    FT.render();
    FT.rpc('kanban', 'deleteTask', { id: t.id }, { render: false })
      .then(function () { FT.deleted('Card'); })
      .catch(FT.saveFailed);
  });

  // ---------- card dialog: title, column, colour and a rich-text note ----------
  var CARD_COLORS = [['', 'No colour'], ['1', 'Teal'], ['2', 'Amber'], ['3', 'Blue'], ['4', 'Red'], ['5', 'Purple'], ['6', 'Green'], ['7', 'Grey'], ['8', 'Orange']];
  // execCommand needs real colours, not CSS variables. These read well on light and dark backgrounds.
  var TEXT_COLORS = [['#d64545', 'Red'], ['#2f7fd6', 'Blue'], ['#2b9a5b', 'Green'], ['#c27a00', 'Amber']];
  var TOOLS = [
    ['undo', null, '↶', 'Undo'], ['redo', null, '↷', 'Redo'],
    ['bold', null, '<b>B</b>', 'Bold'], ['italic', null, '<i>I</i>', 'Italic'], ['underline', null, '<u>U</u>', 'Underline'],
    ['insertUnorderedList', null, '• List', 'Bullet list'], ['insertOrderedList', null, '1. List', 'Numbered list'],
    ['fontSize', '2', 'Small', 'Small text'], ['fontSize', '3', 'Normal', 'Normal text'], ['fontSize', '5', 'Large', 'Large text']
  ];

  function swatchesHtml(current) {
    return '<label>Card colour</label><div class="swatches" role="radiogroup" aria-label="Card colour">' + CARD_COLORS.map(function (c) {
      return '<label title="' + c[1] + '"><input type="radio" name="dlg-color" value="' + c[0] + '"' + ((current || '') === c[0] ? ' checked' : '') + ' aria-label="' + c[1] + '">' +
        '<span class="' + (c[0] ? '' : 'none') + '"' + (c[0] ? ' style="--c: var(--cat-' + c[0] + ')"' : '') + '></span></label>';
    }).join('') + '</div>';
  }

  function toolbarHtml() {
    return '<div class="rtbar" role="toolbar" aria-label="Text formatting">' +
      TOOLS.map(function (t) {
        return '<button type="button" data-cmd="' + t[0] + '"' + (t[1] ? ' data-val="' + t[1] + '"' : '') + ' title="' + t[3] + '" aria-label="' + t[3] + '">' + t[2] + '</button>';
      }).join('') +
      TEXT_COLORS.map(function (c) {
        return '<button type="button" class="dot" data-cmd="foreColor" data-val="' + c[0] + '" title="' + c[1] + ' text" aria-label="' + c[1] + ' text"><i style="--dot:' + c[0] + '"></i></button>';
      }).join('') +
      '<button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">Clear</button></div>';
  }

  /** Toolbar buttons keep the editor's text selection: mousedown would otherwise move focus away from it. */
  function wireToolbar() {
    var bar = document.querySelector('.rtbar');
    if (!bar) return;
    FT.richShortcuts(document.getElementById('dlg-note'));
    bar.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
    // Links in the note open with Cmd or Ctrl + click, so a plain click still places the cursor to edit the text.
    document.getElementById('dlg-note').addEventListener('click', function (e) {
      var link = e.target.closest('a[href]');
      if (link && (e.metaKey || e.ctrlKey)) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
    });
    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      document.getElementById('dlg-note').focus();
      try { document.execCommand('styleWithCSS', false, false); } catch (err) {}
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    });
  }

  FT.action('kanban.open-card', function (el) {
    if (Date.now() - lastDragEnd < 400) return; // the click that ends a drag is not a click on the card
    var t = taskById(el.dataset.id);
    if (!t) return;
    var host = el.closest('[data-owner]'), word = (host && host.dataset.word) || 'column';
    var columns = board(t.project_id).cols.map(function (c) { return { value: c.id, label: c.name }; });
    var opened = '';
    function cardState() {
      var title = document.getElementById('dlg-cardtitle'), note = document.getElementById('dlg-note'), col = document.getElementById('dlg-cardcolumn');
      var picked = document.querySelector('input[name="dlg-color"]:checked');
      return [title && title.value, note && note.innerHTML, col && col.value, picked && picked.value].join('\u0000');
    }
    FT.dialog({
      title: 'Card',
      wide: true,
      fields: [
        { id: 'cardtitle', label: 'Title', value: t.title, maxlength: 200 },
        { id: 'cardcolumn', label: word.charAt(0).toUpperCase() + word.slice(1), type: 'select', options: columns, value: t.column_id }
      ],
      after: swatchesHtml(t.color) + '<label for="dlg-note">Note</label>' + toolbarHtml() +
        '<div class="rtedit" id="dlg-note" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Details, links, checklists…">' + (t.note_html || '') + '</div>' +
        '<div class="hint" style="background:none;padding:4px 0 0">Type <b>- </b> for a list, <b># </b>, <b>## </b> or <b>### </b> for a heading, **bold** or _italic_ and they format as you go. Web addresses become links when you save.</div>',
      onOpen: function () { wireToolbar(); opened = cardState(); },
      // A tap outside the dialog or Esc would throw away what was typed: the dialog asks first.
      isDirty: function () { return cardState() !== opened; },
      onSubmit: function (v) {
        assert(v.cardtitle, 'A card needs a title.');
        var picked = document.querySelector('input[name="dlg-color"]:checked');
        var color = picked ? picked.value : '', noteHtml = document.getElementById('dlg-note').innerHTML;
        // Shown at once; the server cleans the note and sends the stored version back.
        t.title = v.cardtitle.slice(0, 200); t.color = color;
        var editor = document.getElementById('dlg-note');
        t.note_html = noteHtml; t.note_text = (editor.innerText || editor.textContent || '').trim();
        FT.rpc('kanban', 'updateTask', { id: t.id, title: t.title, color: color, noteHtml: noteHtml }).catch(FT.saveFailed);
        if (v.cardcolumn !== t.column_id) moveCard(t, v.cardcolumn); else FT.render();
      }
    });
  });

  function assert(ok, message) { if (!ok) throw new Error(message); }
})();
</script>

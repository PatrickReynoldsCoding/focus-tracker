<style>
.wblist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 2px; }
.wblist li { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; flex-wrap: wrap; }
.wblist li:hover { background: var(--surface-2); }
.wblist .wbname { flex: 1 1 140px; min-width: 0; font-weight: 600; text-align: left; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; font: inherit; font-weight: 600; overflow-wrap: anywhere; }
.wblist .wbname:hover { text-decoration: underline; text-underline-offset: 3px; }
.wblist .wbmeta { font-size: 13px; color: var(--muted); }
.wbfoot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
/* No pull-to-refresh or browser pinch-zoom while drawing: the canvas handles its own touch gestures. */
.wbshell { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; overscroll-behavior: none; touch-action: none; }
.wbbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.wbbar h2 { font-size: 17px; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wbbar .wbstatus { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.wbbar .btn { white-space: nowrap; }
.wbcanvas { flex: 1 1 auto; position: relative; min-height: 0; }
.wbcanvas .wbmsg { padding: 24px; color: var(--muted); }
/* On a phone the bar is one slim line so the canvas gets the screen. */
@media (max-width: 760px) {
  .wbbar { gap: 8px; padding: 4px 8px; padding-top: max(4px, env(safe-area-inset-top)); }
  .wbbar h2 { font-size: 14px; }
  .wbbar .wbstatus { font-size: 11px; }
  .wbbar .btn { min-height: 36px; }
}
</style>
<script>
/**
 * Whiteboards: any number of named Excalidraw canvases per project, opened full screen (also on a phone, where
 * Excalidraw uses its own touch layout: finger drawing, pinch zoom, bottom menu). React and
 * Excalidraw (about 1.3 MB) load from the CDN the first time a whiteboard opens, not with the page. Changes save to
 * Drive two seconds after you stop drawing, and again when you close it. The canvas is always Excalidraw's white one.
 */
(function () {
  var CDN = 'https://cdn.jsdelivr.net/npm/';
  var SCRIPTS = [CDN + 'react@18.2.0/umd/react.production.min.js', CDN + 'react-dom@18.2.0/umd/react-dom.production.min.js',
    CDN + '@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js'];
  var SAVE_DELAY_MS = 2000;
  var libraryLoading = null, open = null; // open: { boardId, root, api, lastJson, timer, ready }

  function boardsOf(projectId) {
    return (FT.store.whiteboard || []).filter(function (w) { return w.project_id === projectId; })
      .sort(function (a, b) { return (a.created || a.updated) < (b.created || b.updated) ? -1 : 1; });
  }
  function boardById(id) { return (FT.store.whiteboard || []).filter(function (w) { return w.id === id; })[0] || null; }

  function boardRow(w) {
    var id = FT.esc(w.id);
    return '<li><button class="wbname" data-act="whiteboard.open" data-id="' + id + '" title="Open whiteboard">' + FT.esc(w.name) + '</button>' +
      '<span class="wbmeta">Saved ' + FT.fmtDate(w.updated) + '</span>' +
      '<a class="wbmeta" href="' + FT.esc(w.url) + '" target="_blank" rel="noopener noreferrer">Drive</a>' +
      '<button class="mvb" data-act="whiteboard.rename" data-id="' + id + '" aria-label="Rename ' + FT.esc(w.name) + '" title="Rename">✎</button>' +
      '<button class="mvb" data-act="whiteboard.remove" data-id="' + id + '" aria-label="Remove ' + FT.esc(w.name) + '" title="Remove">×</button></li>';
  }

  function panel(p) {
    var boards = boardsOf(p.id);
    return '<section class="panel"><div class="label">Whiteboards</div>' +
      (boards.length ? '<ul class="wblist">' + boards.map(boardRow).join('') + '</ul>'
                     : '<p style="margin:0 0 10px;color:var(--muted)">Blank Excalidraw canvases for sketches and diagrams.</p>') +
      '<div class="wbfoot"><button class="btn sm primary wbopen" data-act="whiteboard.new" data-project="' + FT.esc(p.id) + '">+ New whiteboard</button>' +
      '</div></section>';
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error('Could not load the whiteboard from ' + src.split('/')[2] + '. Check your connection.')); };
      document.head.appendChild(s);
    });
  }

  function loadLibrary() {
    if (window.ExcalidrawLib) return Promise.resolve();
    if (!libraryLoading) {
      window.EXCALIDRAW_ASSET_PATH = CDN + '@excalidraw/excalidraw@0.17.6/dist/';
      libraryLoading = SCRIPTS.reduce(function (chain, src) { return chain.then(function () { return loadScript(src); }); }, Promise.resolve())
        .catch(function (e) { libraryLoading = null; throw e; });
    }
    return libraryLoading;
  }

  function status(text) { var el = document.getElementById('wb-status'); if (el) el.textContent = text; }

  function sceneJson() {
    var api = open.api, lib = window.ExcalidrawLib;
    return lib.serializeAsJSON(api.getSceneElements(), api.getAppState(), api.getFiles(), 'local');
  }

  /** Save if the drawing changed since the last save. Resolves when done. */
  function save() {
    if (!open || !open.api) return Promise.resolve();
    clearTimeout(open.timer);
    var current = open, json = sceneJson();
    if (json === current.lastJson) return Promise.resolve();
    status('Saving…');
    return FT.rpc('whiteboard', 'save', { id: current.boardId, json: json }, { render: false, quiet: true })
      .then(function () { current.lastJson = json; if (open === current) status('Saved'); })
      .catch(function (e) { if (open === current) status('Not saved: ' + e.message); throw e; });
  }

  function scheduleSave() {
    if (!open || !open.ready) return;
    // Excalidraw reports every view change (cursor, zoom, selection) here; save() only writes when the drawing changed.
    clearTimeout(open.timer);
    open.timer = setTimeout(function () { save().catch(function () {}); }, SAVE_DELAY_MS);
  }

  function showShell(title) {
    var shell = document.createElement('div');
    shell.className = 'wbshell'; shell.id = 'wb-shell';
    shell.setAttribute('role', 'dialog'); shell.setAttribute('aria-label', 'Whiteboard: ' + title);
    shell.innerHTML = '<div class="wbbar"><h2>' + FT.esc(title) + '</h2><span class="wbstatus" id="wb-status" aria-live="polite">Loading…</span>' +
      '<button class="btn sm primary" data-act="whiteboard.close">Save and close</button></div><div class="wbcanvas" id="wb-canvas"></div>';
    document.body.appendChild(shell);
    return document.getElementById('wb-canvas');
  }

  function mount(canvas, json) {
    var lib = window.ExcalidrawLib, scene = JSON.parse(json);
    var initial = { elements: scene.elements, appState: Object.assign({}, scene.appState, { collaborators: new Map(), theme: 'light' }), files: scene.files || {}, scrollToContent: true };
    open.root = window.ReactDOM.createRoot(canvas);
    open.root.render(window.React.createElement(lib.Excalidraw, {
      initialData: initial,
      theme: 'light', // Excalidraw's default white canvas, also when the app is dark
      excalidrawAPI: function (api) { if (open) open.api = api; },
      onChange: scheduleSave,
      UIOptions: { canvasActions: { loadScene: false, saveToActiveFile: false, toggleTheme: false } }
    }));
    open.lastJson = null;
    // Excalidraw fires onChange while it starts up; real edits only count after that settles.
    setTimeout(function () {
      if (!open || !open.api) return;
      open.lastJson = sceneJson();
      open.ready = true;
      status(scene.elements.length ? 'Saved' : 'New drawing');
    }, 800);
  }

  function closeShell() {
    if (open && open.root) open.root.unmount();
    var shell = document.getElementById('wb-shell');
    if (shell) shell.remove();
    open = null;
    FT.render();
  }

  function openBoard(board) {
    if (!board || open) return;
    var project = FT.project(board.project_id);
    open = { boardId: board.id, ready: false };
    var canvas = showShell((project ? project.name + ': ' : '') + board.name), mine = open;
    Promise.all([loadLibrary(), FT.rpc('whiteboard', 'get', { id: board.id }, { render: false, quiet: true })])
      .then(function (results) { if (open === mine) mount(canvas, results[1].json); })
      .catch(function (e) {
        if (open !== mine) return;
        canvas.innerHTML = '<p class="wbmsg">' + FT.esc(e.message) + '</p>';
        status('');
      });
  }

  FT.module({ id: 'whiteboard', slots: { 'project.page': [{ id: 'whiteboard', title: 'Whiteboards', order: 25, span: 'half', render: panel }] } });

  FT.action('whiteboard.open', function (el) { openBoard(boardById(el.dataset.id)); });

  FT.action('whiteboard.new', function (el) {
    var projectId = el.dataset.project, count = boardsOf(projectId).length;
    FT.dialog({
      title: 'New whiteboard',
      submit: 'Create and open',
      fields: [{ id: 'boardname', label: 'Name', value: count ? '' : 'Whiteboard', placeholder: 'e.g. Wiring plan' }],
      onSubmit: function (v) {
        if (!v.boardname) throw new Error('A whiteboard needs a name.');
        return FT.rpc('whiteboard', 'create', { id: FT.newId(), projectId: projectId, name: v.boardname }, { quiet: true }).then(function (row) {
          setTimeout(function () { openBoard(boardById(row.id)); }, 0);
        });
      }
    });
  });

  FT.action('whiteboard.rename', function (el) {
    var w = boardById(el.dataset.id);
    if (!w) return;
    FT.dialog({
      title: 'Rename whiteboard',
      fields: [{ id: 'boardname', label: 'Name', value: w.name }],
      hint: 'The file in Drive is renamed too.',
      onSubmit: function (v) {
        if (!v.boardname) throw new Error('A whiteboard needs a name.');
        w.name = v.boardname.slice(0, 80);
        FT.render();
        FT.rpc('whiteboard', 'rename', { id: w.id, name: w.name }, { render: false }).catch(FT.saveFailed);
      }
    });
  });

  /** Removing takes it off the project at once (with Undo). The drawing file stays in Drive. */
  FT.action('whiteboard.remove', function (el) {
    var w = boardById(el.dataset.id);
    if (!w) return;
    FT.store.whiteboard = FT.store.whiteboard.filter(function (x) { return x.id !== w.id; });
    FT.render();
    FT.rpc('whiteboard', 'remove', { id: w.id }, { render: false })
      .then(function () { FT.toast('Whiteboard removed. Its file stays in Drive.', null, { label: 'Undo', run: FT.undo }); })
      .catch(FT.saveFailed);
  });

  FT.action('whiteboard.close', function () {
    if (!open) return;
    var btn = document.querySelector('[data-act="whiteboard.close"]');
    if (btn) btn.disabled = true;
    save().then(closeShell).catch(function () { if (btn) btn.disabled = false; FT.toast('The drawing was not saved. Try again, or close the tab to discard the changes.', 'error'); });
  });

  // A closed or reloaded tab still saves what it can.
  window.addEventListener('pagehide', function () { if (open && open.ready) save().catch(function () {}); });
})();
</script>

<style>
.rowlink { border: 0; background: none; padding: 0; margin: 0; font: inherit; font-weight: 700; color: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.rowlink:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Phone: each project is a card (name and age, next action, category and status) instead of a table wider than the screen. The header becomes a row of sort buttons. */
@media (max-width: 760px) {
  .scroll table.ptable { min-width: 0; }
  .ptable, .ptable thead, .ptable tbody { display: block; }
  .ptable thead tr { display: flex; flex-wrap: wrap; gap: 2px 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .ptable th { padding: 2px 0; border: 0; }
  .ptable .sortbtn { min-height: 36px; padding: 0 6px; }
  .ptable tbody tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name age" "next next" "cat status"; gap: 4px 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .ptable tbody td { display: block; padding: 0; border: 0; min-width: 0; text-align: left; }
  .ptable tbody td:nth-child(1) { grid-area: name; font-size: 16px; overflow-wrap: anywhere; }
  .ptable tbody td:nth-child(2) { grid-area: cat; }
  .ptable tbody td:nth-child(3) { grid-area: status; justify-self: end; align-self: center; }
  .ptable tbody td:nth-child(4) { grid-area: next; color: var(--muted); overflow-wrap: anywhere; }
  .ptable tbody td:nth-child(5) { grid-area: age; text-align: right; white-space: nowrap; font-size: 13px; }
}
.lockbox { margin: 12px 0; padding: 12px 14px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); display: grid; gap: 4px; }
.lockbox span { color: var(--ink); font-size: 14px; }
.waitbox { margin: 12px 0; padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); display: grid; gap: 4px; }
.waitbox span { font-size: 14px; }
.waitmark { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 600; vertical-align: middle; }
:root[data-theme="eink"] .waitmark { border: 2px solid #000; background: #fff; color: #000; }
.tophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.tophead .label { margin: 0; }
.status-paused, .status-done, .status-archived { color: var(--muted); }
.phead { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.phead > div:first-child { min-width: 0; }
.phead h2 { font-size: clamp(22px, 4.5vw, 30px); line-height: 1.15; }
/* The category pill is a button that opens the category picker; ⋯ opens the More menu. Both menus are .pmenu. */
.pmenuwrap { position: relative; display: inline-flex; flex: none; }
.catbtn { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 99px; display: inline-flex; align-items: center; }
.catbtn .pill::after { content: "\25BE"; font-size: 10px; color: var(--muted); }
.catbtn:hover .pill { background: var(--line); }
.morebtn { min-width: 40px; min-height: 40px; padding: 0 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
.morebtn:hover { background: var(--surface-2); }
.morebtn[aria-expanded="true"], .catbtn[aria-expanded="true"] .pill { outline: 2px solid var(--accent); outline-offset: 1px; }
.pmenu { position: fixed; z-index: 40; min-width: 200px; max-width: calc(100vw - 16px); max-height: min(60vh, 420px); overflow-y: auto; display: grid; gap: 2px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
.pmenu [role^="menuitem"] { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 8px 10px; border: 0; border-radius: 6px; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.pmenu [role^="menuitem"]:hover, .pmenu [role^="menuitem"]:focus { background: var(--surface-2); outline: none; }
.pmenu [aria-checked="true"]::after { content: "\2713"; margin-left: auto; font-weight: 700; }
.pmenusep { height: 1px; margin: 4px 2px; background: var(--line); }
/* Sections that open inside the top panel, such as Linked projects. */
.psection { margin-top: 12px; border-top: 1px solid var(--line); }
.psectbtn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 8px 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer; }
.psectbtn .chev { display: inline-block; width: 1em; transition: transform 0.15s; }
.psectbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.pcount { padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; }
.psectbody { padding: 2px 0 6px; }
@media (max-width: 760px) {
  .morebtn, .psectbtn, .catbtn { min-height: 44px; }
  .morebtn { min-width: 44px; }
  .pmenu [role^="menuitem"] { min-height: 44px; font-size: 16px; }
}
:root[data-theme="eink"] .morebtn { min-width: 44px; min-height: 44px; border: 2px solid #000; background: #fff; color: #000; }
:root[data-theme="eink"] .morebtn[aria-expanded="true"], :root[data-theme="eink"] .catbtn[aria-expanded="true"] .pill { outline: 3px solid #000; }
:root[data-theme="eink"] .pmenu { border: 3px solid #000; background: #fff; }
:root[data-theme="eink"] .pmenu [role^="menuitem"] { min-height: 44px; color: #000; }
:root[data-theme="eink"] .pmenu [role^="menuitem"]:hover, :root[data-theme="eink"] .pmenu [role^="menuitem"]:focus { background: #fff; outline: 3px solid #000; outline-offset: -3px; }
:root[data-theme="eink"] .pmenusep { height: 2px; background: #000; }
:root[data-theme="eink"] .psection { border-top: 2px solid #000; }
:root[data-theme="eink"] .psectbtn { min-height: 44px; }
:root[data-theme="eink"] .pcount { border: 2px solid #000; background: #fff; color: #000; }
.pfilters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; align-items: center; }
@media (max-width: 640px) { .pfilters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .pfilters input { grid-column: 1 / -1; } }
/* Status filter: a button that opens a short list of checkboxes, so several statuses can be shown at once. */
.msel { position: relative; min-width: 0; }
.mselbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; }
.mselbtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mselbtn[aria-expanded="true"] { border-color: var(--accent); }
.mselpop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 100%; display: grid; gap: 2px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
.mselpop label { display: flex; align-items: center; gap: 10px; margin: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.mselpop label:hover { background: var(--surface-2); }
.mselpop input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
@media (max-width: 760px) { .mselbtn { min-height: 44px; font-size: 16px; } .mselpop label { min-height: 44px; font-size: 16px; } .mselpop input { width: 22px; height: 22px; } }
:root[data-theme="eink"] .mselbtn { border: 2px solid #000; background: #fff; color: #000; min-height: 44px; border-radius: 6px; }
:root[data-theme="eink"] .mselpop { border: 3px solid #000; background: #fff; }
:root[data-theme="eink"] .mselpop label { min-height: 44px; color: #000; }
:root[data-theme="eink"] .mselpop label:hover { background: #fff; }
:root[data-theme="eink"] .mselpop label:has(input:checked) { font-weight: 700; }
.sortbtn { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sortbtn:hover { color: var(--ink); }
.sortbtn .arrow { display: inline-block; width: 1em; }
</style>
<script>
(function () {
  var ORDER = { active: 0, paused: 1, done: 2, archived: 3 };
  var STATUSES = ['active', 'paused', 'done', 'archived'];
  var COLUMNS = [
    { key: 'name', title: 'Project' },
    { key: 'category', title: 'Category' },
    { key: 'status', title: 'Status' },
    { key: 'next_action', title: 'Next action' },
    { key: 'last_touched', title: 'Last touched' }
  ];
  // Values compared when sorting by a column. Status sorts by its life-cycle order, not alphabetically.
  var SORT_VALUE = {
    name: function (p) { return p.name.toLowerCase(); },
    category: function (p) { return FT.category(p.category).label.toLowerCase(); },
    status: function (p) { return ORDER[p.status]; },
    next_action: function (p) { return p.next_action.toLowerCase(); },
    last_touched: function (p) { return p.last_touched; }
  };
  // view.sort null keeps the default order: active first, then longest untouched.
  var view = { sort: null, desc: false, category: '', statusOpen: false, text: '' };

  // Choices kept in the mode's Settings tab through the layout module (layout.<page>.view), so every device shows the same:
  // the Projects tab's statuses (none for all) and the project page's hidden next action.
  var DEFAULT_STATUSES = ['active'];
  var NEXT_ACTION_HIDDEN = 'hidden';
  function savedView(page) { return (FT.store.layout || {})[page + '.view'] || {}; }
  /** Shown at once; saved behind. changes: { name: value }, null forgets one. */
  function saveView(page, changes) {
    var layoutInstalled = FT.store.layout !== undefined;
    FT.store.layout = FT.store.layout || {};
    FT.store.layout[page + '.view'] = Object.assign({}, savedView(page), changes);
    if (layoutInstalled) FT.rpc('layout', 'saveView', { page: page, view: changes }, { render: false }).catch(FT.saveFailed);
  }
  function shownStatuses() {
    var saved = savedView('projects').status;
    return Array.isArray(saved) ? STATUSES.filter(function (s) { return saved.indexOf(s) !== -1; }) : DEFAULT_STATUSES;
  }
  function saveStatuses(statuses) { saveView('projects', { status: statuses }); }
  function nextActionHidden() { return savedView('project').nextAction === NEXT_ACTION_HIDDEN; }

  // The status list closes when the mode changes.
  var statusMode = null;
  function closeStatusOnModeChange() {
    if (statusMode === FT.state.mode) return;
    statusMode = FT.state.mode; view.statusOpen = false;
  }

  /** The unfinished projects p waits for (Links tab: they block p), when the links module is installed. Finished projects wait for nothing. */
  function waitingOn(p) {
    var finished = function (x) { return x.status === 'done' || x.status === 'archived'; };
    if (!p || finished(p)) return [];
    return (FT.store.links || []).filter(function (l) { return l.type === 'blocks' && l.to_id === p.id; })
      .map(function (l) { return FT.project(l.from_id); })
      .filter(function (b) { return b && !finished(b); });
  }

  function defaultOrder(a, b) {
    return (ORDER[a.status] - ORDER[b.status]) || (a.last_touched < b.last_touched ? -1 : 1);
  }

  function columnOrder(a, b) {
    var value = SORT_VALUE[view.sort], left = value(a), right = value(b);
    var result = left < right ? -1 : left > right ? 1 : 0;
    return (view.desc ? -result : result) || defaultOrder(a, b);
  }

  function matchesFilters(p) {
    if (view.category && p.category !== view.category) return false;
    var statuses = shownStatuses();
    if (statuses.length && statuses.indexOf(p.status) === -1) return false;
    var text = view.text.trim().toLowerCase();
    return !text || (p.name + ' ' + p.next_action).toLowerCase().indexOf(text) !== -1;
  }

  function isFiltered() { return !!(view.category || shownStatuses().length || view.text.trim()); }

  function statusLabel() {
    var statuses = shownStatuses();
    if (!statuses.length || statuses.length === STATUSES.length) return 'All statuses';
    return statuses.join(', ');
  }

  function statusHtml() {
    return '<div class="msel"><button type="button" class="mselbtn" id="pj-status" aria-haspopup="true" aria-expanded="' + view.statusOpen + '" aria-controls="pj-status-pop" data-act="projects.statusOpen"' +
      ' aria-label="Filter by status: ' + statusLabel() + '"><span>' + statusLabel() + '</span><span aria-hidden="true">▾</span></button>' +
      (view.statusOpen ? '<div class="mselpop" id="pj-status-pop" role="group" aria-label="Statuses to show">' + STATUSES.map(function (s) {
        return '<label><input type="checkbox" value="' + s + '" data-change="projects.statusFilter"' + (shownStatuses().indexOf(s) !== -1 ? ' checked' : '') + '>' + s + '</label>';
      }).join('') + '</div>' : '') + '</div>';
  }

  function filtersHtml() {
    var categories = '<option value="">All categories</option>' + FT.categories().map(function (c) {
      return '<option value="' + FT.esc(c.id) + '"' + (c.id === view.category ? ' selected' : '') + '>' + FT.esc(c.label) + '</option>';
    }).join('');
    return '<div class="pfilters">' +
      '<input type="text" id="pj-text" placeholder="Search name or next action" aria-label="Search projects" value="' + FT.esc(view.text) + '" data-input="projects.text">' +
      '<select id="pj-category" aria-label="Filter by category" data-change="projects.category">' + categories + '</select>' +
      statusHtml() +
      '<button class="btn sm" data-act="projects.clear"' + (isFiltered() ? '' : ' disabled') + '>Clear</button></div>';
  }

  function headHtml() {
    return COLUMNS.map(function (c) {
      var active = view.sort === c.key;
      var sortState = active ? (view.desc ? 'descending' : 'ascending') : 'none';
      return '<th aria-sort="' + sortState + '"><button class="sortbtn" data-act="projects.sort" data-key="' + c.key + '">' + FT.esc(c.title) +
        '<span class="arrow" aria-hidden="true">' + (active ? (view.desc ? '↓' : '↑') : '') + '</span></button></th>';
    }).join('');
  }

  function tabHtml() {
    closeStatusOnModeChange();
    var all = FT.store.projects || [];
    var list = all.filter(matchesFilters).sort(view.sort ? columnOrder : defaultOrder);
    var rows = list.map(function (p) {
      var n = FT.daysSince(p.last_touched);
      return '<tr class="row" data-act="projects.open" data-id="' + FT.esc(p.id) + '"><td><b><button class="rowlink" data-act="projects.open" data-id="' + FT.esc(p.id) + '">' + (FT.lockedUntil(p) ? '🔒 ' : '') + FT.esc(p.name) + '</button></b>' + waitMarkHtml(p) + '</td><td>' + categoryButtonHtml(p) +
        '</td><td class="status-' + FT.esc(p.status) + '">' + FT.esc(p.status) + '</td><td>' + FT.linkify(p.next_action) +
        '</td><td class="num ' + (p.status === 'active' ? FT.ageClass(n) : '') + '">' + FT.ageLabel(n) + '</td></tr>';
    }).join('');
    var table = list.length
      ? '<div class="scroll"><table class="ptable"><thead><tr>' + headHtml() + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="empty">' + (all.length ? 'No projects match these filters.' : 'No projects yet. Add the first one.') + '</p>';
    var main = '<section class="panel"><div class="tophead"><div class="label">All projects</div><button class="btn sm primary" data-act="projects.add">+ Add project</button></div>' +
      (all.length ? filtersHtml() : '') + table + '</section>';
    var extra = FT.slots('projects.tab').map(function (s) { return { id: s.id || 'slot' + s.order, title: s.title, description: s.description, html: s.render(FT), w: s.w || 12 }; });
    return FT.layout('projects', [{ id: 'projects', title: 'All projects', description: 'Every project in this mode, sortable and filterable.', html: main, w: 12 }].concat(extra));
  }

  /** Re-render after a keystroke in the search box, then put the caret back where it was. */
  function renderKeepingSearchFocus(el) {
    var caret = el.selectionStart;
    FT.render();
    var again = document.getElementById('pj-text');
    if (!again) return;
    again.focus();
    again.setSelectionRange(caret, caret);
  }

  function waitMarkHtml(p) {
    var on = waitingOn(p);
    return on.length ? '<span class="waitmark" title="Waiting on ' + FT.esc(on.map(function (b) { return b.name; }).join(', ')) + '">Waiting</span>' : '';
  }

  function waitBoxHtml(p) {
    var on = waitingOn(p);
    if (!on.length) return '';
    return '<div class="waitbox"><b>Waiting on ' + on.map(function (b) {
      return '<button class="rowlink" data-act="projects.open" data-id="' + FT.esc(b.id) + '">' + FT.esc(b.name) + '</button>';
    }).join(', ') + '</b><span>It is left out of your focus pick until ' + (on.length === 1 ? 'that project is' : 'those projects are') + ' done.</span></div>';
  }

  /** The project's top panel ('header'): name, category, status, next action, its buttons, the ⋯ More menu and the sections other modules add. */
  function headerHtml(p) {
    var n = FT.daysSince(p.last_touched);
    var inactive = p.status !== 'active', lockedUntil = FT.lockedUntil(p);
    return '<section class="panel"><div class="phead"><div><h2>' + FT.esc(p.name) + '</h2><div class="meta" style="margin-top:8px">' + categoryButtonHtml(p) +
      '<span class="status-' + FT.esc(p.status) + '">' + FT.esc(p.status) + '</span><span class="' + (inactive ? '' : FT.ageClass(n)) + '">Last touched ' + FT.ageLabel(n) + '</span>' +
      skippedHtml(p) + '</div></div>' + moreButtonHtml(p) + '</div>' + waitBoxHtml(p) +
      (lockedUntil ? '<div class="lockbox"><b>🔒 Locked until ' + FT.esc(FT.lockLabel(lockedUntil)) + '</b><span>You locked this project so it cannot take over. It is hidden from your focus pick and its boards, notes and whiteboards are closed until then.</span></div>'
        : nextActionHidden() ? '' : '<div class="next"><small>Next action</small>' + FT.linkify(p.next_action) + '</div>') +
      (lockedUntil ? '' : '<div class="actions" style="margin-top:0"><button class="btn sm" data-act="projects.edit">Edit</button>' +
        (p.status === 'paused' ? '<button class="btn sm" data-act="projects.status" data-status="active">Resume</button>' : '') +
        (p.status === 'active' ? '<button class="btn sm" data-act="projects.status" data-status="paused">Pause</button>' : '') +
        (p.status === 'done' || p.status === 'archived' ? '<button class="btn sm" data-act="projects.status" data-status="active">Reopen</button>' : '<button class="btn sm" data-act="projects.status" data-status="done">Mark done</button>') +
        '<button class="btn sm" data-act="projects.delete">Delete</button></div>') + sectionsHtml(p) + '</section>';
  }

  function moreButtonHtml(p) {
    return '<span class="pmenuwrap"><button type="button" class="morebtn" data-act="projects.more" aria-haspopup="menu" aria-expanded="false" aria-label="More for ' + FT.esc(p.name) + '">⋯</button></span>';
  }

  function menuItemHtml(act, label, data) {
    return '<button type="button" role="menuitem" tabindex="-1" data-act="' + act + '"' + (data || '') + '>' + FT.esc(label) + '</button>';
  }

  function moreMenuHtml(p) {
    var lockedUntil = FT.lockedUntil(p);
    return menuItemHtml('projects.lock', lockedUntil ? 'Change lock…' : 'Lock…') +
      (lockedUntil ? '' : menuItemHtml('projects.toggleNextAction', nextActionHidden() ? 'Show next action' : 'Hide next action'));
  }

  // ---------- sections in the top panel ----------
  // Other modules add sections through the slot 'project.header': { id, title, order, render(project, FT) -> { count, html } }.
  // Each opens and closes with its button; which ones are open is remembered on this device.
  var SECTIONS_KEY = 'ft.projects.sections';
  function openSections() {
    try { return JSON.parse(localStorage.getItem(SECTIONS_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function keepOpenSections(open) { try { localStorage.setItem(SECTIONS_KEY, JSON.stringify(open)); } catch (e) {} }

  function sectionsHtml(p) {
    var open = openSections();
    return FT.slots('project.header').map(function (slot) {
      var out = slot.render(p, FT), id = FT.esc(slot.id), isOpen = !!open[slot.id];
      return '<div class="psection"><button type="button" class="psectbtn" data-act="projects.section" data-id="' + id + '" aria-expanded="' + isOpen + '" aria-controls="ps-' + id + '">' +
        '<span class="chev" aria-hidden="true">▸</span>' + FT.esc(slot.title) + (out.count ? ' <span class="pcount">' + out.count + '</span>' : '') + '</button>' +
        '<div class="psectbody" id="ps-' + id + '"' + (isOpen ? '' : ' hidden') + '>' + out.html + '</div></div>';
    }).join('');
  }

  /** Today's skip count for this project, if the Today module is installed and it was ever skipped. */
  function skippedHtml(p) {
    var counts = (FT.store.today && FT.store.today.skipCounts) || {};
    var n = counts[p.id] || 0;
    return n ? '<span>Skipped ' + n + (n === 1 ? ' time' : ' times') + '</span>' : '';
  }

  // ---------- category picker ----------
  var PALETTE = [['1', 'Teal'], ['2', 'Amber'], ['3', 'Blue'], ['4', 'Red'], ['5', 'Purple'], ['6', 'Green'], ['7', 'Grey'], ['8', 'Orange']];
  var CATEGORY_NAME_MAX = 40;

  function categoryButtonHtml(p) {
    return '<span class="pmenuwrap"><button type="button" class="catbtn" data-act="projects.pickCategory" data-id="' + FT.esc(p.id) + '" aria-haspopup="menu" aria-expanded="false"' +
      ' aria-label="Category: ' + FT.esc(FT.category(p.category).label) + '. Change category">' + FT.pill(p.category) + '</button></span>';
  }

  function categoryMenuHtml(p) {
    var id = ' data-id="' + FT.esc(p.id) + '"';
    return FT.categories().map(function (c) {
      return '<button type="button" role="menuitemradio" tabindex="-1" aria-checked="' + (c.id === p.category) + '" data-act="projects.setCategory"' + id +
        ' data-category="' + FT.esc(c.id) + '">' + FT.pill(c.id) + '</button>';
    }).join('') + '<div class="pmenusep" role="separator"></div>' + menuItemHtml('projects.newCategory', 'New category…', id);
  }

  /** The palette slot used least, as the server picks it, so a new category looks different from the others where possible. */
  function leastUsedColor() {
    var uses = {};
    FT.categories().forEach(function (c) { uses[c.color] = (uses[c.color] || 0) + 1; });
    return PALETTE.reduce(function (best, slot) { return (uses[slot[0]] || 0) < (uses[best] || 0) ? slot[0] : best; }, PALETTE[0][0]);
  }

  function paletteHtml(current) {
    return '<label>Colour</label><div class="swatches" role="radiogroup" aria-label="Category colour">' + PALETTE.map(function (slot) {
      return '<label title="' + slot[1] + '"><input type="radio" name="dlg-catcolor" value="' + slot[0] + '"' + (slot[0] === current ? ' checked' : '') + ' aria-label="' + slot[1] + '">' +
        '<span style="--c: var(--cat-' + slot[0] + ')"></span></label>';
    }).join('') + '</div>';
  }

  /** Give project p category id: on screen at once, saved behind; a refusal puts it back. newCategory: the category to make on the way, if any. */
  function assignCategory(p, categoryId, newCategory) {
    var before = { category: p.category, categories: FT.store.categories };
    var args = { id: p.id, category: categoryId };
    if (newCategory) args = { id: p.id, newCategory: newCategory.label, newCategoryColor: newCategory.color, newCategoryId: newCategory.id };
    FT.optimistic(function () {
      if (newCategory) FT.store.categories = before.categories.concat([newCategory]);
      p.category = categoryId;
      return function () { p.category = before.category; FT.store.categories = before.categories; };
    }, function () { return FT.rpc('projects', 'update', args, { render: false }); }).catch(function () {});
    FT.toast('Category: ' + FT.category(categoryId).label + '.', null, { label: 'Undo', run: FT.undo });
  }

  function newCategoryDialog(p) {
    FT.dialog({
      title: 'New category',
      subtitle: 'For ' + p.name,
      submit: 'Add category',
      fields: [{ id: 'catlabel', label: 'Name', placeholder: 'e.g. Garden', maxlength: CATEGORY_NAME_MAX }],
      after: paletteHtml(leastUsedColor()),
      onSubmit: function (v) {
        if (!v.catlabel) throw new Error('A category needs a name.');
        var picked = document.querySelector('input[name="dlg-catcolor"]:checked');
        var order = FT.categories().reduce(function (most, c) { return Math.max(most, Number(c.order) || 0); }, 0) + 1;
        var category = { id: FT.newId(), label: v.catlabel.slice(0, CATEGORY_NAME_MAX), color: picked ? picked.value : leastUsedColor(), order: order };
        assignCategory(p, category.id, category);
        setTimeout(function () { refocus('[data-act="projects.pickCategory"][data-id="' + p.id + '"]'); }, 0); // once the dialog has closed
      }
    });
  }

  var NEW_CATEGORY = '__new';

  function categoryOptions() {
    return FT.categories().map(function (c) { return { value: c.id, label: c.label }; })
      .concat([{ value: NEW_CATEGORY, label: '+ New category…' }]);
  }

  /** The "new category" name box shows only when "+ New category…" is picked. */
  function wireNewCategory() {
    var select = document.getElementById('dlg-category'), input = document.getElementById('dlg-newcategory');
    var label = document.querySelector('label[for="dlg-newcategory"]');
    function sync() {
      var on = select.value === NEW_CATEGORY;
      input.hidden = !on; label.hidden = !on;
      if (on) input.focus();
    }
    select.addEventListener('change', sync);
    sync();
  }

  /** The category fields of a project form as rpc arguments: an existing id, or a new category's name. */
  function categoryArgs(v) {
    if (v.category !== NEW_CATEGORY) return { category: v.category };
    if (!v.newcategory) throw new Error('Type a name for the new category.');
    return { newCategory: v.newcategory };
  }

  // ---------- coming back to the Projects tab ----------
  // The project page last shown in the Projects tab, per mode (and kept on this device): coming back to the tab from
  // another one reopens it. "‹ All projects" goes to the list, and then the list is what the tab shows.
  var OPEN_PROJECT_KEY = 'ft.projects.open.', openProjectByMode = {};
  function rememberOpenProject() {
    var mode = FT.state.mode, id = FT.state.view === 'project' ? FT.state.projectId : FT.state.view === 'projects' ? '' : null;
    if (!mode || id === null || openProjectByMode[mode] === id) return;
    openProjectByMode[mode] = id;
    try { localStorage.setItem(OPEN_PROJECT_KEY + mode, id); } catch (e) {}
  }
  function lastOpenProject() {
    var mode = FT.state.mode;
    if (openProjectByMode[mode] === undefined) {
      try { openProjectByMode[mode] = localStorage.getItem(OPEN_PROJECT_KEY + mode) || ''; } catch (e) { openProjectByMode[mode] = ''; }
    }
    return openProjectByMode[mode] ? { view: 'project', id: openProjectByMode[mode] } : null;
  }
  FT.onRender(rememberOpenProject);

  FT.module({
    id: 'projects',
    tab: { title: 'Projects', order: 20, render: tabHtml, reopen: lastOpenProject },
    slots: { 'project.page': [{ id: 'header', title: 'Project', description: 'Name, category, status, next action and the project\'s buttons.', order: 0, span: 'full', alwaysShown: true, render: headerHtml }] }
  });

  // ---------- menus: ⋯ More and the category picker ----------
  // A menu opens under its button (above it near the bottom of the screen). Arrow keys, Home and End move through it,
  // Escape closes it and puts focus back on the button, Tab or a click elsewhere closes it. Items run through data-act.
  var openMenu = null;
  var MENU_GAP = 4, MENU_MARGIN = 8;

  function closeMenu(focusButton) {
    if (!openMenu) return;
    var closing = openMenu;
    openMenu = null;
    if (closing.menu.parentNode) closing.menu.parentNode.removeChild(closing.menu);
    closing.button.setAttribute('aria-expanded', 'false');
    if (focusButton && document.body.contains(closing.button)) closing.button.focus();
  }

  function menuItems(menu) { return Array.prototype.slice.call(menu.querySelectorAll('[role^="menuitem"]')); }

  function placeMenu(button, menu) {
    var at = button.getBoundingClientRect(), height = menu.offsetHeight, width = menu.offsetWidth;
    var below = at.bottom + MENU_GAP, fitsBelow = below + height <= window.innerHeight - MENU_MARGIN;
    menu.style.top = Math.max(MENU_MARGIN, fitsBelow ? below : at.top - MENU_GAP - height) + 'px';
    menu.style.left = Math.max(MENU_MARGIN, Math.min(at.left, window.innerWidth - width - MENU_MARGIN)) + 'px';
  }

  function moveInMenu(e) {
    var items = menuItems(openMenu.menu), at = items.indexOf(document.activeElement);
    var TARGET_BY_KEY = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: items.length - 1 };
    if (TARGET_BY_KEY[e.key] !== undefined) { e.preventDefault(); items[(TARGET_BY_KEY[e.key] + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === 'Tab') closeMenu(false);
  }

  /** Open a menu of itemsHtml under button, or close it when it is already open there. */
  function toggleMenu(button, label, itemsHtml) {
    var wasOpenHere = !!openMenu && openMenu.button === button;
    closeMenu(false);
    if (wasOpenHere) return;
    var menu = document.createElement('div');
    menu.className = 'pmenu'; menu.id = 'pj-menu';
    menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', label);
    menu.innerHTML = itemsHtml;
    button.parentNode.insertBefore(menu, button.nextSibling);
    button.setAttribute('aria-expanded', 'true');
    button.setAttribute('aria-controls', 'pj-menu');
    openMenu = { button: button, menu: menu };
    menu.addEventListener('keydown', moveInMenu);
    placeMenu(button, menu);
    (menu.querySelector('[aria-checked="true"]') || menuItems(menu)[0]).focus();
  }

  document.addEventListener('click', function (e) {
    if (openMenu && !openMenu.menu.contains(e.target) && !openMenu.button.contains(e.target)) closeMenu(false);
  });
  window.addEventListener('scroll', function () { closeMenu(false); }, { passive: true });
  window.addEventListener('resize', function () { closeMenu(false); });
  FT.onRender(function () { if (openMenu && !document.body.contains(openMenu.menu)) openMenu = null; });

  /** After a redraw, put focus back on the button that was used (found again by selector). */
  function refocus(selector) {
    var again = document.querySelector(selector);
    if (again) again.focus();
  }

  FT.action('projects.more', function (el) { toggleMenu(el, 'More', moreMenuHtml(FT.project(FT.state.projectId))); });

  FT.action('projects.toggleNextAction', function () {
    closeMenu(true);
    saveView('project', { nextAction: nextActionHidden() ? null : NEXT_ACTION_HIDDEN });
    FT.render();
    refocus('[data-act="projects.more"]');
  });

  FT.action('projects.pickCategory', function (el) {
    var p = FT.project(el.dataset.id);
    if (p) toggleMenu(el, 'Category', categoryMenuHtml(p));
  });

  FT.action('projects.setCategory', function (el) {
    var p = FT.project(el.dataset.id), categoryId = el.dataset.category;
    closeMenu(true);
    if (!p || p.category === categoryId) return;
    assignCategory(p, categoryId, null);
    refocus('[data-act="projects.pickCategory"][data-id="' + p.id + '"]');
  });

  FT.action('projects.newCategory', function (el) {
    var p = FT.project(el.dataset.id);
    closeMenu(true);
    if (p) newCategoryDialog(p);
  });

  FT.action('projects.section', function (el) {
    var open = openSections(), body = document.getElementById('ps-' + el.dataset.id), isOpen = !open[el.dataset.id];
    if (isOpen) open[el.dataset.id] = true; else delete open[el.dataset.id];
    keepOpenSections(open);
    el.setAttribute('aria-expanded', String(isOpen));
    if (body) body.hidden = !isOpen;
  });

  /** A click on a row opens the project, unless it was inside the category picker opened from that row. */
  FT.action('projects.open', function (el, e) {
    if (e && e.target.closest && e.target.closest('.pmenu')) return;
    FT.go('project', { id: el.dataset.id });
  });

  /** Click a column title to sort by it, again to reverse, a third time to go back to the default order. */
  FT.action('projects.sort', function (el) {
    var key = el.dataset.key;
    if (view.sort !== key) { view.sort = key; view.desc = false; }
    else if (!view.desc) view.desc = true;
    else { view.sort = null; view.desc = false; }
    FT.render();
  });
  FT.on('input', 'projects.text', function (el) { view.text = el.value; renderKeepingSearchFocus(el); });
  FT.on('change', 'projects.category', function (el) { view.category = el.value; FT.render(); });

  /** The status list stays open while boxes are ticked; a click elsewhere or Escape closes it. */
  FT.action('projects.statusOpen', function () {
    view.statusOpen = !view.statusOpen;
    FT.render();
    var first = view.statusOpen && document.querySelector('#pj-status-pop input');
    if (first) first.focus();
  });
  FT.on('change', 'projects.statusFilter', function (el) {
    var picked = Array.prototype.filter.call(document.querySelectorAll('#pj-status-pop input'), function (b) { return b.checked; });
    saveStatuses(picked.map(function (b) { return b.value; }));
    FT.render();
    var again = document.querySelector('#pj-status-pop input[value="' + el.value + '"]');
    if (again) again.focus();
  });
  function closeStatus(focusButton) {
    if (!view.statusOpen) return;
    view.statusOpen = false;
    FT.render();
    var btn = focusButton && document.getElementById('pj-status');
    if (btn) btn.focus();
  }
  document.addEventListener('click', function (e) { if (view.statusOpen && !(e.target.closest && e.target.closest('.msel'))) closeStatus(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && view.statusOpen) closeStatus(true); });
  FT.action('projects.clear', function () { view.category = ''; view.statusOpen = false; view.text = ''; saveStatuses([]); FT.render(); });

  FT.action('projects.add', function () {
    FT.dialog({
      title: 'Add project',
      submit: 'Add project',
      fields: [
        { id: 'name', label: 'Name', placeholder: 'e.g. Loft insulation quotes', maxlength: 120 },
        { id: 'category', label: 'Category', type: 'select', options: categoryOptions(), value: FT.categories()[0].id },
        { id: 'newcategory', label: 'New category name', placeholder: 'e.g. Garden' },
        { id: 'next', label: 'Next action', placeholder: 'The first small step', maxlength: 300 }
      ],
      onOpen: wireNewCategory,
      onSubmit: function (v) {
        var args = Object.assign({ name: v.name, next_action: v.next }, categoryArgs(v));
        return FT.rpc('projects', 'create', args, { quiet: true })
          .then(function (row) { FT.go('project', { id: row.id }); });
      }
    });
  });

  FT.action('projects.edit', function () {
    var p = FT.project(FT.state.projectId);
    FT.dialog({
      title: 'Edit project',
      fields: [
        { id: 'name', label: 'Name', value: p.name, maxlength: 120 },
        { id: 'category', label: 'Category', type: 'select', options: categoryOptions(), value: p.category },
        { id: 'newcategory', label: 'New category name', placeholder: 'e.g. Garden' },
        { id: 'next', label: 'Next action', value: p.next_action, maxlength: 300 }
      ],
      onOpen: wireNewCategory,
      onSubmit: function (v) {
        var args = Object.assign({ id: p.id, name: v.name, next_action: v.next }, categoryArgs(v));
        return FT.rpc('projects', 'update', args, { quiet: true });
      }
    });
  });

  // ---------- lock ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayInput() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  FT.action('projects.lock', function () {
    closeMenu(true);
    var p = FT.project(FT.state.projectId), current = FT.lockedUntil(p);
    FT.dialog({
      title: current ? 'Change lock' : 'Lock this project',
      subtitle: current ? 'Locked until ' + FT.lockLabel(current) + '. You can make it longer here.' : 'It will not be picked as your focus and its page is closed until the date you choose.',
      after: '<label for="lk-date">Locked until</label><input type="date" id="lk-date" min="' + todayInput() + '">' +
        '<label for="lk-time">Time (optional, otherwise it opens at the start of that day)</label><input type="time" id="lk-time">' +
        (current ? '<div class="actions" style="margin-top:16px"><button class="btn danger sm" type="button" data-act="projects.liftlock">Lift the lock early…</button></div>' : ''),
      submit: current ? 'Make it longer' : 'Lock it',
      onSubmit: function () {
        var date = document.getElementById('lk-date').value, time = document.getElementById('lk-time').value;
        if (!date) throw new Error('Pick a date.');
        var until = time ? new Date(date + 'T' + time).toISOString() : date;
        return FT.rpc('projects', 'setLock', { id: p.id, until: until }, { quiet: true });
      }
    });
  });

  /** Lifting a running lock takes two separate warnings, then the server is told it was confirmed. */
  FT.action('projects.liftlock', function () {
    var p = FT.project(FT.state.projectId);
    FT.closeDialog();
    setTimeout(function () {
      FT.dialog({
        title: 'Lift the lock early?', danger: true, submit: 'Yes, lift it',
        body: '<div class="err" style="display:block;margin:10px 0">You locked "' + FT.esc(p.name) + '" to protect your time. Lifting it now undoes that decision.</div>',
        onSubmit: function () {
          setTimeout(function () {
            FT.dialog({
              title: 'Are you really sure?', danger: true, submit: 'Lift the lock now',
              body: '<div class="err" style="display:block;margin:10px 0">Last chance. This project will come back into your focus pick straight away.</div>',
              onSubmit: function () { return FT.rpc('projects', 'setLock', { id: p.id, until: '', early: true }, { quiet: true }); }
            });
          }, 0);
        }
      });
    }, 0);
  });

  var STATUS_DONE_WORDS = { done: 'Marked done.', paused: 'Paused.', active: 'Active again.' };
  FT.action('projects.status', function (el) {
    var id = FT.state.projectId, p = FT.project(id), status = el.dataset.status;
    if (!p || p.status === status) return;
    var before = p.status;
    // The page changes at once; the save follows. If it fails the status goes back and the error is shown.
    FT.optimistic(function () { p.status = status; return function () { p.status = before; }; },
      function () { return FT.rpc('projects', 'update', { id: id, status: status }); }).catch(function () {});
    FT.toast(STATUS_DONE_WORDS[status] || 'Saved.', null, { label: 'Undo', run: FT.undo });
  });

  FT.action('projects.delete', function () {
    var p = FT.project(FT.state.projectId);
    FT.dialog({
      title: 'Delete project',
      body: '<p>This removes "' + FT.esc(p.name) + '" with its Kanban board, resource links and log lines from the tracker. The notes file stays in Drive. To keep the project but hide it, use Mark done instead. You can undo this.</p>',
      submit: 'Delete project',
      danger: true,
      // The dialog closes and the project goes at once; the server's answer brings its board, links and log up to date.
      onSubmit: function () {
        var before = FT.store.projects;
        FT.optimistic(function () {
          FT.store.projects = before.filter(function (x) { return x.id !== p.id; });
          FT.go('projects');
          return function () { FT.store.projects = before; FT.go('project', { id: p.id }); };
        }, function () { return FT.rpc('projects', 'remove', { id: p.id }); }).catch(function () {});
        FT.deleted('Project');
      }
    });
  });
})();
</script>

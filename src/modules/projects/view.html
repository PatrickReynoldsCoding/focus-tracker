<style>
.rowlink { border: 0; background: none; padding: 0; margin: 0; font: inherit; font-weight: 700; color: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.rowlink:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Phone: each project is a card (name and age, next action, category and status) instead of a table wider than the screen. The header becomes a row of sort buttons. */
@media (max-width: 760px) {
  .scroll table.ptable { min-width: 0; }
  .ptable, .ptable thead, .ptable tbody { display: block; }
  .ptable thead tr { display: flex; flex-wrap: wrap; gap: 2px 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .ptable th { padding: 2px 0; border: 0; }
  .ptable .sortbtn { min-height: 36px; padding: 0 6px; }
  .ptable tbody tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name age" "next next" "cat status"; gap: 4px 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .ptable tbody td { display: block; padding: 0; border: 0; min-width: 0; text-align: left; }
  .ptable tbody td:nth-child(1) { grid-area: name; font-size: 16px; overflow-wrap: anywhere; }
  .ptable tbody td:nth-child(2) { grid-area: cat; }
  .ptable tbody td:nth-child(3) { grid-area: status; justify-self: end; align-self: center; }
  .ptable tbody td:nth-child(4) { grid-area: next; color: var(--muted); overflow-wrap: anywhere; }
  .ptable tbody td:nth-child(5) { grid-area: age; text-align: right; white-space: nowrap; font-size: 13px; }
}
.lockbox { margin: 12px 0; padding: 12px 14px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); display: grid; gap: 4px; }
.lockbox span { color: var(--ink); font-size: 14px; }
.tophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.tophead .label { margin: 0; }
.status-paused, .status-done, .status-archived { color: var(--muted); }
.phead { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
.phead h2 { font-size: clamp(22px, 4.5vw, 30px); line-height: 1.15; }
.pfilters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; align-items: center; }
@media (max-width: 640px) { .pfilters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .pfilters input { grid-column: 1 / -1; } }
.sortbtn { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sortbtn:hover { color: var(--ink); }
.sortbtn .arrow { display: inline-block; width: 1em; }
</style>
<script>
(function () {
  var ORDER = { active: 0, paused: 1, done: 2, archived: 3 };
  var STATUSES = ['active', 'paused', 'done', 'archived'];
  var COLUMNS = [
    { key: 'name', title: 'Project' },
    { key: 'category', title: 'Category' },
    { key: 'status', title: 'Status' },
    { key: 'next_action', title: 'Next action' },
    { key: 'last_touched', title: 'Last touched' }
  ];
  // Values compared when sorting by a column. Status sorts by its life-cycle order, not alphabetically.
  var SORT_VALUE = {
    name: function (p) { return p.name.toLowerCase(); },
    category: function (p) { return FT.category(p.category).label.toLowerCase(); },
    status: function (p) { return ORDER[p.status]; },
    next_action: function (p) { return p.next_action.toLowerCase(); },
    last_touched: function (p) { return p.last_touched; }
  };
  // view.sort null keeps the default order: active first, then longest untouched.
  var view = { sort: null, desc: false, category: '', status: '', text: '' };

  function defaultOrder(a, b) {
    return (ORDER[a.status] - ORDER[b.status]) || (a.last_touched < b.last_touched ? -1 : 1);
  }

  function columnOrder(a, b) {
    var value = SORT_VALUE[view.sort], left = value(a), right = value(b);
    var result = left < right ? -1 : left > right ? 1 : 0;
    return (view.desc ? -result : result) || defaultOrder(a, b);
  }

  function matchesFilters(p) {
    if (view.category && p.category !== view.category) return false;
    if (view.status && p.status !== view.status) return false;
    var text = view.text.trim().toLowerCase();
    return !text || (p.name + ' ' + p.next_action).toLowerCase().indexOf(text) !== -1;
  }

  function isFiltered() { return !!(view.category || view.status || view.text.trim()); }

  function filtersHtml() {
    var categories = '<option value="">All categories</option>' + FT.categories().map(function (c) {
      return '<option value="' + FT.esc(c.id) + '"' + (c.id === view.category ? ' selected' : '') + '>' + FT.esc(c.label) + '</option>';
    }).join('');
    var statuses = '<option value="">All statuses</option>' + STATUSES.map(function (s) {
      return '<option value="' + s + '"' + (s === view.status ? ' selected' : '') + '>' + s + '</option>';
    }).join('');
    return '<div class="pfilters">' +
      '<input type="text" id="pj-text" placeholder="Search name or next action" aria-label="Search projects" value="' + FT.esc(view.text) + '" data-input="projects.text">' +
      '<select id="pj-category" aria-label="Filter by category" data-change="projects.category">' + categories + '</select>' +
      '<select id="pj-status" aria-label="Filter by status" data-change="projects.statusFilter">' + statuses + '</select>' +
      '<button class="btn sm" data-act="projects.clear"' + (isFiltered() ? '' : ' disabled') + '>Clear</button></div>';
  }

  function headHtml() {
    return COLUMNS.map(function (c) {
      var active = view.sort === c.key;
      var sortState = active ? (view.desc ? 'descending' : 'ascending') : 'none';
      return '<th aria-sort="' + sortState + '"><button class="sortbtn" data-act="projects.sort" data-key="' + c.key + '">' + FT.esc(c.title) +
        '<span class="arrow" aria-hidden="true">' + (active ? (view.desc ? '↓' : '↑') : '') + '</span></button></th>';
    }).join('');
  }

  function tabHtml() {
    var all = FT.store.projects || [];
    var list = all.filter(matchesFilters).sort(view.sort ? columnOrder : defaultOrder);
    var rows = list.map(function (p) {
      var n = FT.daysSince(p.last_touched);
      return '<tr class="row" data-act="projects.open" data-id="' + FT.esc(p.id) + '"><td><b><button class="rowlink" data-act="projects.open" data-id="' + FT.esc(p.id) + '">' + (FT.lockedUntil(p) ? '🔒 ' : '') + FT.esc(p.name) + '</button></b></td><td>' + FT.pill(p.category) +
        '</td><td class="status-' + FT.esc(p.status) + '">' + FT.esc(p.status) + '</td><td>' + FT.linkify(p.next_action) +
        '</td><td class="num ' + (p.status === 'active' ? FT.ageClass(n) : '') + '">' + FT.ageLabel(n) + '</td></tr>';
    }).join('');
    var table = list.length
      ? '<div class="scroll"><table class="ptable"><thead><tr>' + headHtml() + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="empty">' + (all.length ? 'No projects match these filters.' : 'No projects yet. Add the first one.') + '</p>';
    var main = '<section class="panel"><div class="tophead"><div class="label">All projects</div><button class="btn sm primary" data-act="projects.add">+ Add project</button></div>' +
      (all.length ? filtersHtml() : '') + table + '</section>';
    var extra = FT.slots('projects.tab').map(function (s) { return { id: s.id || 'slot' + s.order, title: s.title, html: s.render(FT), w: s.w || 12 }; });
    return FT.layout('projects', [{ id: 'projects', title: 'All projects', html: main, w: 12 }].concat(extra));
  }

  /** Re-render after a keystroke in the search box, then put the caret back where it was. */
  function renderKeepingSearchFocus(el) {
    var caret = el.selectionStart;
    FT.render();
    var again = document.getElementById('pj-text');
    if (!again) return;
    again.focus();
    again.setSelectionRange(caret, caret);
  }

  function headerHtml(p) {
    var n = FT.daysSince(p.last_touched);
    var inactive = p.status !== 'active', lockedUntil = FT.lockedUntil(p);
    return '<section class="panel"><div class="phead"><div><h2>' + FT.esc(p.name) + '</h2><div class="meta" style="margin-top:8px">' + FT.pill(p.category) +
      '<span class="status-' + FT.esc(p.status) + '">' + FT.esc(p.status) + '</span><span class="' + (inactive ? '' : FT.ageClass(n)) + '">Last touched ' + FT.ageLabel(n) + '</span>' +
      skippedHtml(p) + '</div></div></div>' +
      (lockedUntil ? '<div class="lockbox"><b>🔒 Locked until ' + FT.esc(FT.lockLabel(lockedUntil)) + '</b><span>You locked this project so it cannot take over. It is hidden from your focus pick and its boards, notes and whiteboards are closed until then.</span></div>' : '<div class="next"><small>Next action</small>' + FT.linkify(p.next_action) + '</div>') +
      '<div class="actions" style="margin-top:0">' +
      (lockedUntil ? '<button class="btn sm" data-act="projects.lock">Change lock…</button>' : '<button class="btn sm" data-act="projects.edit">Edit</button><button class="btn sm" data-act="projects.lock">Lock…</button>') +
      (lockedUntil ? '' :
        (p.status === 'paused' ? '<button class="btn sm" data-act="projects.status" data-status="active">Resume</button>' : '') +
        (p.status === 'active' ? '<button class="btn sm" data-act="projects.status" data-status="paused">Pause</button>' : '') +
        (p.status === 'done' || p.status === 'archived' ? '<button class="btn sm" data-act="projects.status" data-status="active">Reopen</button>' : '<button class="btn sm" data-act="projects.status" data-status="done">Mark done</button>') +
        '<button class="btn sm" data-act="projects.delete">Delete</button>') + '</div></section>';
  }

  /** Today's skip count for this project, if the Today module is installed and it was ever skipped. */
  function skippedHtml(p) {
    var counts = (FT.store.today && FT.store.today.skipCounts) || {};
    var n = counts[p.id] || 0;
    return n ? '<span>Skipped ' + n + (n === 1 ? ' time' : ' times') + '</span>' : '';
  }

  var NEW_CATEGORY = '__new';

  function categoryOptions() {
    return FT.categories().map(function (c) { return { value: c.id, label: c.label }; })
      .concat([{ value: NEW_CATEGORY, label: '+ New category…' }]);
  }

  /** The "new category" name box shows only when "+ New category…" is picked. */
  function wireNewCategory() {
    var select = document.getElementById('dlg-category'), input = document.getElementById('dlg-newcategory');
    var label = document.querySelector('label[for="dlg-newcategory"]');
    function sync() {
      var on = select.value === NEW_CATEGORY;
      input.hidden = !on; label.hidden = !on;
      if (on) input.focus();
    }
    select.addEventListener('change', sync);
    sync();
  }

  /** The category fields of a project form as rpc arguments: an existing id, or a new category's name. */
  function categoryArgs(v) {
    if (v.category !== NEW_CATEGORY) return { category: v.category };
    if (!v.newcategory) throw new Error('Type a name for the new category.');
    return { newCategory: v.newcategory };
  }

  FT.module({
    id: 'projects',
    tab: { title: 'Projects', order: 20, render: tabHtml },
    slots: { 'project.page': [{ id: 'header', title: 'Project', order: 0, span: 'full', render: headerHtml }] }
  });

  FT.action('projects.open', function (el) { FT.go('project', { id: el.dataset.id }); });

  /** Click a column title to sort by it, again to reverse, a third time to go back to the default order. */
  FT.action('projects.sort', function (el) {
    var key = el.dataset.key;
    if (view.sort !== key) { view.sort = key; view.desc = false; }
    else if (!view.desc) view.desc = true;
    else { view.sort = null; view.desc = false; }
    FT.render();
  });
  FT.on('input', 'projects.text', function (el) { view.text = el.value; renderKeepingSearchFocus(el); });
  FT.on('change', 'projects.category', function (el) { view.category = el.value; FT.render(); });
  FT.on('change', 'projects.statusFilter', function (el) { view.status = el.value; FT.render(); });
  FT.action('projects.clear', function () { view.category = ''; view.status = ''; view.text = ''; FT.render(); });

  FT.action('projects.add', function () {
    FT.dialog({
      title: 'Add project',
      submit: 'Add project',
      fields: [
        { id: 'name', label: 'Name', placeholder: 'e.g. Loft insulation quotes', maxlength: 120 },
        { id: 'category', label: 'Category', type: 'select', options: categoryOptions(), value: FT.categories()[0].id },
        { id: 'newcategory', label: 'New category name', placeholder: 'e.g. Garden' },
        { id: 'next', label: 'Next action', placeholder: 'The first small step', maxlength: 300 }
      ],
      onOpen: wireNewCategory,
      onSubmit: function (v) {
        var args = Object.assign({ name: v.name, next_action: v.next }, categoryArgs(v));
        return FT.rpc('projects', 'create', args, { quiet: true })
          .then(function (row) { FT.go('project', { id: row.id }); });
      }
    });
  });

  FT.action('projects.edit', function () {
    var p = FT.project(FT.state.projectId);
    FT.dialog({
      title: 'Edit project',
      fields: [
        { id: 'name', label: 'Name', value: p.name, maxlength: 120 },
        { id: 'category', label: 'Category', type: 'select', options: categoryOptions(), value: p.category },
        { id: 'newcategory', label: 'New category name', placeholder: 'e.g. Garden' },
        { id: 'next', label: 'Next action', value: p.next_action, maxlength: 300 }
      ],
      onOpen: wireNewCategory,
      onSubmit: function (v) {
        var args = Object.assign({ id: p.id, name: v.name, next_action: v.next }, categoryArgs(v));
        return FT.rpc('projects', 'update', args, { quiet: true });
      }
    });
  });

  // ---------- lock ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayInput() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  FT.action('projects.lock', function () {
    var p = FT.project(FT.state.projectId), current = FT.lockedUntil(p);
    FT.dialog({
      title: current ? 'Change lock' : 'Lock this project',
      subtitle: current ? 'Locked until ' + FT.lockLabel(current) + '. You can make it longer here.' : 'It will not be picked as your focus and its page is closed until the date you choose.',
      after: '<label for="lk-date">Locked until</label><input type="date" id="lk-date" min="' + todayInput() + '">' +
        '<label for="lk-time">Time (optional, otherwise it opens at the start of that day)</label><input type="time" id="lk-time">' +
        (current ? '<div class="actions" style="margin-top:16px"><button class="btn danger sm" type="button" data-act="projects.liftlock">Lift the lock early…</button></div>' : ''),
      submit: current ? 'Make it longer' : 'Lock it',
      onSubmit: function () {
        var date = document.getElementById('lk-date').value, time = document.getElementById('lk-time').value;
        if (!date) throw new Error('Pick a date.');
        var until = time ? new Date(date + 'T' + time).toISOString() : date;
        return FT.rpc('projects', 'setLock', { id: p.id, until: until }, { quiet: true });
      }
    });
  });

  /** Lifting a running lock takes two separate warnings, then the server is told it was confirmed. */
  FT.action('projects.liftlock', function () {
    var p = FT.project(FT.state.projectId);
    FT.closeDialog();
    setTimeout(function () {
      FT.dialog({
        title: 'Lift the lock early?', danger: true, submit: 'Yes, lift it',
        body: '<div class="err" style="display:block;margin:10px 0">You locked "' + FT.esc(p.name) + '" to protect your time. Lifting it now undoes that decision.</div>',
        onSubmit: function () {
          setTimeout(function () {
            FT.dialog({
              title: 'Are you really sure?', danger: true, submit: 'Lift the lock now',
              body: '<div class="err" style="display:block;margin:10px 0">Last chance. This project will come back into your focus pick straight away.</div>',
              onSubmit: function () { return FT.rpc('projects', 'setLock', { id: p.id, until: '', early: true }, { quiet: true }); }
            });
          }, 0);
        }
      });
    }, 0);
  });

  var STATUS_DONE_WORDS = { done: 'Marked done.', paused: 'Paused.', active: 'Active again.' };
  FT.action('projects.status', function (el) {
    var id = FT.state.projectId, p = FT.project(id), status = el.dataset.status;
    if (!p || p.status === status) return;
    var before = p.status;
    // The page changes at once; the save follows. If it fails the status goes back and the error is shown.
    FT.optimistic(function () { p.status = status; return function () { p.status = before; }; },
      function () { return FT.rpc('projects', 'update', { id: id, status: status }); }).catch(function () {});
    FT.toast(STATUS_DONE_WORDS[status] || 'Saved.', null, { label: 'Undo', run: FT.undo });
  });

  FT.action('projects.delete', function () {
    var p = FT.project(FT.state.projectId);
    FT.dialog({
      title: 'Delete project',
      body: '<p>This removes "' + FT.esc(p.name) + '" with its Kanban board, resource links and log lines from the tracker. The notes file stays in Drive. To keep the project but hide it, use Mark done instead. You can undo this.</p>',
      submit: 'Delete project',
      danger: true,
      onSubmit: function () {
        return FT.rpc('projects', 'remove', { id: p.id }, { quiet: true }).then(function () { FT.go('projects'); FT.deleted('Project'); });
      }
    });
  });
})();
</script>
